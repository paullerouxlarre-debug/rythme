<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rythme</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rythme">
<meta name="theme-color" content="#F5F4EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  /* Direction : app iOS. Gris système, cartes blanches arrondies, grands titres, barre d'onglets translucide.
     La couleur d'accent est choisie dans les réglages (variable --accent posée par le script). */
  :root{
    --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F2F2F7; --surface-3:#E5E5EA;
    --text:#000000; --muted:#8E8E93; --sep:rgba(60,60,67,.16); --border:rgba(60,60,67,.16);
    --accent:#1F9D55; --on-accent:#fff; --accent-soft:color-mix(in srgb,var(--accent) 15%,transparent);
    --negative:#FF3B30; --gold:#FF9500;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
    --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
    --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",sans-serif;
    color-scheme:light; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C;
      --text:#FFFFFF; --muted:#98989F; --sep:rgba(84,84,88,.5); --border:rgba(84,84,88,.5);
      --negative:#FF453A; --gold:#FF9F0A; --shadow:none; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C;
    --text:#FFFFFF; --muted:#98989F; --sep:rgba(84,84,88,.5); --border:rgba(84,84,88,.5);
    --negative:#FF453A; --gold:#FF9F0A; --shadow:none; color-scheme:dark;
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
  body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:40; }
  button,input,select{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  [hidden]{ display:none!important; }

  .app{ max-width:560px; margin:0 auto; padding:0 16px 130px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 2px 0; min-height:52px; }
  .greeting{ margin:0; font-size:13px; color:var(--muted); font-weight:500; }
  .avbtn{ width:36px; height:36px; border-radius:50%; border:none; background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; transition:transform .15s ease; }
  .avbtn:active{ transform:scale(.92); }

  h1.page{ font-family:var(--font-display); font-weight:800; font-size:34px; letter-spacing:-.025em; margin:2px 2px 14px; line-height:1.08; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 4px 10px; gap:10px; }
  .section-title{ font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:-.015em; margin:0; }
  .section-sub{ font-size:13px; color:var(--muted); }
  .sublabel{ font-size:13px; font-weight:600; color:var(--muted); margin:18px 4px 8px; }
  .muted{ color:var(--muted); }
  .mono{ font-variant-numeric:tabular-nums; }
  .pos{ color:var(--accent); } .neg{ color:var(--negative); }
  a{ color:var(--accent); }

  .iconbtn,.navbtn{ width:34px; height:34px; border-radius:50%; border:none; background:var(--accent-soft); color:var(--accent); font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none; transition:transform .12s ease; }
  .iconbtn:active,.navbtn:active{ transform:scale(.9); }

  .seg{ display:flex; background:var(--surface-3); border-radius:10px; padding:2px; margin:0 0 10px; }
  .seg button{ flex:1; border:none; background:none; padding:7px 4px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text); opacity:.62; transition:all .2s ease; white-space:nowrap; }
  .seg button.on{ background:var(--surface); opacity:1; box-shadow:0 2px 6px rgba(0,0,0,.14); }

  .card{ background:var(--surface); border-radius:20px; padding:16px; box-shadow:var(--shadow); }
  .card + .card{ margin-top:12px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat .k{ font-size:12.5px; color:var(--muted); margin-bottom:3px; }
  .stat .v{ font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .stat .s{ font-size:12px; color:var(--muted); margin-top:3px; }
  .stat.box{ background:var(--surface); border-radius:16px; padding:14px; box-shadow:var(--shadow); min-width:0; }
  .bignum{ font-family:var(--font-display); font-weight:800; font-size:40px; line-height:1.05; letter-spacing:-.02em; margin:0; }
  .tag{ font-size:12px; font-weight:700; padding:3px 8px; border-radius:7px; }
  .tag.pos{ background:var(--accent-soft); } .tag.neg{ background:color-mix(in srgb,var(--negative) 14%,transparent); }

  .row-list{ background:var(--surface); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
  .row{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:.5px solid var(--sep); gap:10px; }
  .row:last-child{ border-bottom:none; }
  .row-title{ font-size:15.5px; font-weight:600; }
  .row-sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .row-value{ font-size:15px; font-weight:600; text-align:right; }
  .row-change{ font-size:12px; margin-top:2px; text-align:right; }
  .row-del{ background:none; border:none; color:var(--muted); font-size:20px; padding:0 2px; line-height:1; }
  .empty{ padding:22px 16px; color:var(--muted); font-size:14px; line-height:1.5; }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; }

  .form-panel{ background:var(--surface); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field.wide{ grid-column:1/-1; }
  .field label{ font-size:12.5px; color:var(--muted); font-weight:500; }
  .field input,.field select,.inl,.plain{ width:100%; border:none; background:var(--surface-2); color:var(--text); border-radius:11px; padding:11px 12px; font-size:16px; outline:none; min-width:0; }
  .field input:focus,.field select:focus,.inl:focus{ box-shadow:0 0 0 2px var(--accent); }
  .inl{ flex:1; width:auto; }
  .plain{ margin-bottom:8px; }
  .form-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .btn{ border:none; border-radius:13px; padding:12px 16px; font-size:15px; font-weight:600; transition:transform .12s ease,opacity .2s ease; }
  .btn:active{ transform:scale(.97); opacity:.85; }
  .btn-primary{ background:var(--accent); color:var(--on-accent); flex:1; }
  .btn-ghost{ background:var(--accent-soft); color:var(--accent); }
  .btn.danger{ background:color-mix(in srgb,var(--negative) 14%,transparent); color:var(--negative); }
  input[type=file]{ font-size:13px; max-width:100%; }
  input[type=checkbox]{ width:auto!important; accent-color:var(--accent); }

  .alloc-bar{ display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--surface-3); }
  .legend{ display:flex; flex-direction:column; gap:8px; font-size:13.5px; }
  .legend .li{ display:flex; align-items:center; gap:8px; }
  .legend .li .n{ flex:1; }
  .legend .li .p{ font-size:13px; color:var(--muted); }
  .progress{ height:8px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
  .progress div{ height:100%; border-radius:5px; }
  .note{ font-size:12.5px; color:var(--muted); line-height:1.5; margin:10px 4px 0; }
  .callout{ background:var(--accent-soft); border-radius:14px; padding:13px 14px; font-size:14px; line-height:1.5; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .chip{ border:none; background:var(--surface-3); color:var(--text); border-radius:999px; padding:8px 13px; font-size:13.5px; font-weight:600; transition:transform .12s ease,background .2s ease; }
  .chip:active{ transform:scale(.95); }
  .chip.on{ background:var(--accent); color:var(--on-accent); }
  .chip.static{ cursor:default; } .chip.off{ opacity:.4; }
  .lg{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-right:6px; }
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile{ text-align:left; border:none; background:var(--surface); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:3px; min-width:0; box-shadow:var(--shadow); position:relative; transition:transform .12s ease; }
  .tile b{ font-size:15px; color:var(--text); } .tile span{ font-size:12.5px; color:var(--muted); }
  .tile:active{ transform:scale(.97); }
  .tile .x{ position:absolute; top:6px; right:8px; color:var(--muted); font-size:16px; padding:2px 6px; }

  .exblock{ background:var(--surface-2); border-radius:14px; padding:12px; margin-bottom:10px; }
  .setrow{ display:grid; grid-template-columns:30px 1fr 1fr 1fr 24px; gap:8px; align-items:center; margin-top:8px; }
  .setrow.head{ font-size:11.5px; color:var(--muted); margin-top:10px; }
  .setrow input{ width:100%; min-width:0; border:none; background:var(--surface); color:var(--text); border-radius:9px; padding:9px 6px; font-size:16px; text-align:center; }
  .setn{ width:24px; height:24px; border-radius:50%; background:var(--surface); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .exadd{ display:flex; gap:8px; flex-wrap:wrap; }
  .exadd input,.exadd select{ border:none; background:var(--surface-2); color:var(--text); border-radius:11px; padding:11px 12px; font-size:16px; min-width:0; }
  .exadd input{ flex:1 1 160px; }
  .mini{ width:74px; border:none; background:var(--surface-2); color:var(--text); border-radius:9px; padding:8px 8px; font-size:15px; text-align:right; }

  .rings3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; }
  .rw{ position:relative; width:92px; height:92px; margin:0 auto; max-width:100%; }
  .rc{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:700; }
  .rl{ font-size:12.5px; font-weight:600; margin-top:8px; line-height:1.35; }
  .heat12{ display:grid; grid-template-columns:repeat(12,1fr); gap:4px; }
  .heat12 i{ aspect-ratio:1; border-radius:5px; background:var(--surface-3); display:block; }
  .heat12 i.fut{ opacity:.35; }

  .evbar{ width:4px; align-self:stretch; border-radius:3px; flex:none; }
  .wkhead{ display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px; }
  .wkhead b{ font-family:var(--font-display); font-size:20px; font-weight:700; }
  .wkstrip{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .daycell{ border:none; background:var(--surface); color:var(--text); border-radius:14px; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center; gap:4px; box-shadow:var(--shadow); }
  .daycell span{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .daycell b{ font-size:17px; font-weight:700; }
  .daycell i{ height:6px; display:flex; gap:2px; }
  .daycell i u{ width:6px; height:6px; border-radius:50%; display:block; }
  .daycell.tod{ background:var(--accent); color:var(--on-accent); }
  .daycell.tod span{ color:var(--on-accent); opacity:.85; }
  .mhead{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; font-size:11.5px; color:var(--muted); text-align:center; margin-bottom:5px; font-weight:600; }
  .mgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .mday{ border:none; background:var(--surface); color:var(--text); border-radius:12px; min-height:54px; padding:7px 2px 6px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; min-width:0; box-shadow:var(--shadow); transition:transform .12s ease; }
  .mday:active{ transform:scale(.94); }
  .mday b{ font-size:14.5px; font-weight:600; }
  .mday i{ height:6px; display:flex; gap:2px; }
  .mday i u{ width:6px; height:6px; border-radius:50%; display:block; }
  .mday.out{ opacity:.35; }
  .mday.sel{ background:var(--accent); color:var(--on-accent); }
  .mday.tod:not(.sel){ box-shadow:inset 0 0 0 2px var(--accent); }
  .src{ font-size:11px; font-weight:700; color:#FC4C02; margin-left:6px; }
  .acc{ border-bottom:.5px solid var(--sep); }
  .acc summary{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; font-weight:600; font-size:15.5px; list-style:none; }
  .acc summary::-webkit-details-marker{ display:none; }
  .acc p{ margin:0 16px 14px; font-size:14px; line-height:1.55; color:var(--muted); }
  .quest .qchk{ width:26px; height:26px; border-radius:50%; border:2px solid var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--on-accent); flex:none; transition:all .25s ease; }
  .quest.done .qchk{ background:var(--accent); border-color:var(--accent); }

  /* barre d'onglets */
  nav.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:color-mix(in srgb,var(--bg) 78%,transparent); backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px); border-top:.5px solid var(--sep); padding-bottom:env(safe-area-inset-bottom,0px); }
  .tabbar-inner{ max-width:560px; margin:0 auto; display:flex; padding:6px 4px 4px; }
  .tab{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; color:var(--muted); min-width:0; transition:color .2s ease; }
  .tab svg{ width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .tab span{ font-size:10px; font-weight:600; white-space:nowrap; }
  .tab.on{ color:var(--accent); }
  .tab.on svg{ animation:pop .45s cubic-bezier(.3,1.6,.5,1); }
  button:focus-visible,input:focus-visible,select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* feuilles (réglages, lecteur PDF) */
  .sheet{ position:fixed; inset:0; z-index:90; background:var(--bg); overflow:auto; animation:sheetin .38s cubic-bezier(.2,.9,.3,1); padding-top:env(safe-area-inset-top,0px); }
  .sheet-in{ max-width:560px; margin:0 auto; padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px)); }
  .sheet-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .swatches{ display:flex; gap:12px; flex-wrap:wrap; }
  .sw{ width:36px; height:36px; border-radius:50%; border:3px solid var(--surface); box-shadow:0 0 0 2px transparent; transition:transform .15s ease; }
  .sw.on{ box-shadow:0 0 0 2px var(--text); transform:scale(1.08); }
  .pdfv{ position:fixed; inset:0; z-index:95; background:rgba(0,0,0,.92); overflow:auto; padding:calc(54px + env(safe-area-inset-top,0px)) 8px 24px; }
  .pdfv canvas{ display:block; width:100%; max-width:760px; margin:0 auto 10px; background:#fff; border-radius:4px; }
  .pdfv .x{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; z-index:96; }
  .pdfv .msg{ color:#fff; text-align:center; padding:40px 20px; font-size:14px; }

  /* ===== Jeu idle ===== */
  .scene{ position:relative; height:340px; border-radius:28px; overflow:hidden; background:linear-gradient(180deg,#1B1464 0%,#4B2FA8 42%,#B24FC2 72%,#FF8A5B 100%); box-shadow:0 10px 30px rgba(75,47,168,.35); isolation:isolate; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .scene .sk i{ position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; animation:twinkle 3s ease-in-out infinite; }
  .scene .moon{ position:absolute; right:26px; top:112px; width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FFF6D6,#FFD97A); box-shadow:0 0 40px rgba(255,217,122,.6); animation:glow 4s ease-in-out infinite; }
  .scene .cl{ position:absolute; height:18px; border-radius:20px; background:rgba(255,255,255,.18); animation:drift linear infinite; }
  .scene .cl::before{ content:""; position:absolute; left:14px; top:-9px; width:26px; height:20px; border-radius:50%; background:inherit; }
  .scene .hills{ position:absolute; left:0; right:0; bottom:0; width:100%; height:130px; z-index:1; }
  .res{ position:absolute; left:14px; right:14px; top:14px; display:flex; gap:8px; z-index:3; }
  .res .pill{ flex:1; background:rgba(255,255,255,.16); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:16px; padding:8px 12px; color:#fff; min-width:0; }
  .res .pill small{ display:block; font-size:11px; opacity:.8; font-weight:600; }
  .res .pill b{ font-size:21px; font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:6px; }
  .res .pill svg{ width:17px; height:17px; flex:none; }
  .mascot-wrap{ position:absolute; left:50%; bottom:46px; width:170px; height:170px; margin-left:-85px; z-index:2; cursor:pointer; animation:bob 3s ease-in-out infinite; }
  .mascot-wrap svg{ width:100%; height:100%; overflow:visible; transition:transform .12s cubic-bezier(.3,1.8,.5,1); }
  .mascot-wrap.tap svg{ transform:scale(.88,1.1); }
  .mascot-wrap .blink{ animation:blink 4.5s infinite; transform-box:fill-box; transform-origin:center; }
  .mascot-wrap .arm{ transform-box:fill-box; transform-origin:top center; animation:wave 2.2s ease-in-out infinite; }
  .shadow{ position:absolute; left:50%; bottom:40px; width:110px; height:14px; margin-left:-55px; border-radius:50%; background:rgba(0,0,0,.28); z-index:1; animation:shadow 3s ease-in-out infinite; }
  .hint{ position:absolute; left:0; right:0; bottom:10px; text-align:center; color:rgba(255,255,255,.85); font-size:12px; font-weight:600; z-index:3; }
  .fl{ position:absolute; z-index:5; color:#FFE27A; font-weight:800; font-size:20px; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.35); animation:floatup .9s ease-out forwards; }
  .gen{ display:flex; align-items:center; gap:12px; padding:12px 14px; }
  .gico{ width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:none; color:#fff; }
  .gico svg{ width:26px; height:26px; fill:none; stroke:#fff; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .buy{ border:none; border-radius:12px; padding:9px 12px; font-weight:800; font-size:13.5px; background:var(--surface-3); color:var(--muted); min-width:92px; transition:transform .12s ease; display:flex; flex-direction:column; align-items:center; line-height:1.15; }
  .buy small{ font-size:11px; font-weight:600; opacity:.85; }
  .buy.ok{ background:linear-gradient(135deg,#FFB020,#FF7A1A); color:#fff; box-shadow:0 4px 14px rgba(255,138,26,.45); animation:wiggle 2.4s ease-in-out infinite; }
  .buy:active{ transform:scale(.94); }
  .buy.star.ok{ background:linear-gradient(135deg,#B06BFF,#6C4BFF); box-shadow:0 4px 14px rgba(108,75,255,.45); }
  .gcount{ white-space:nowrap; font-size:12px; font-weight:800; padding:2px 8px; border-radius:8px; background:var(--surface-3); margin-left:6px; }
  .claim{ border:none; border-radius:11px; padding:8px 12px; font-weight:800; font-size:13px; background:linear-gradient(135deg,#B06BFF,#6C4BFF); color:#fff; flex:none; animation:wiggle 2.4s ease-in-out infinite; }
  .claimed{ font-size:12.5px; color:var(--muted); font-weight:600; flex:none; }
  .mult{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .mult span{ font-size:12px; font-weight:700; padding:4px 9px; border-radius:8px; background:var(--accent-soft); color:var(--accent); }
  .skin{ width:44px; height:44px; border-radius:50%; border:3px solid var(--surface); transition:transform .15s ease; position:relative; }

  /* =====================================================================
     v17 : direction « tracker pro ». Neutres chauds, graphite, accents sourds,
     hairlines plutôt qu'ombres colorées, mouvements doux sans rebond.
     ===================================================================== */
  :root{
    --bg:#F3F2EE; --surface:#FFFFFF; --surface-2:#F1F0EC; --surface-3:#E7E6E1;

    --negative:#D9473B; --gold:#B8902F; --shadow:0 1px 2px rgba(18,18,20,.04);

      --bg:#09090A; --surface:#131315; --surface-2:#1A1A1D; --surface-3:#242428;
      --text:#EDEDEF; --muted:#8A8A91; --sep:rgba(255,255,255,.07); --border:rgba(255,255,255,.07);
      --negative:#E5584C; --shadow:none; --gph:#17181B; --gph2:#111113;
    }
  }
  :root[data-theme="dark"]{
    --bg:#09090A; --surface:#131315; --surface-2:#1A1A1D; --surface-3:#242428;
    --text:#EDEDEF; --muted:#8A8A91; --sep:rgba(255,255,255,.07); --border:rgba(255,255,255,.07);
    --negative:#E5584C; --shadow:none; --gph:#17181B; --gph2:#111113;
  }
  body[data-tab=game]{ --tc:#7C74E8; --tc2:#A9A3F2; }

  body[data-tab=plan]{ --tc:#4F7BE8; --tc2:#93B0F2; }
  body[data-tab=money]{ --tc:#1E9A87; --tc2:#C9A54A; }
  body[data-tab=sport]{ --tc:#D9663F; --tc2:#E8A07F; }
  body[data-tab=food]{ --tc:#7D9F45; --tc2:#B5C98A; }
  .tab[data-id=game]{ --c:#7C74E8; } .tab[data-id=today]{ --c:#2E9E76; } .tab[data-id=plan]{ --c:#4F7BE8; }
  .tab[data-id=money]{ --c:#1E9A87; } .tab[data-id=sport]{ --c:#D9663F; } .tab[data-id=food]{ --c:#7D9F45; }

  @keyframes titlein{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  .sgrid{ position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px); background-size:28px 28px; mask-image:radial-gradient(circle at 50% 55%,#000 30%,transparent 75%); -webkit-mask-image:radial-gradient(circle at 50% 55%,#000 30%,transparent 75%); }

  .tico,.mtile .viz,.circ-e,.pbtn{ animation:none!important; }

<script>
(function(){

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN;};
const fmt=n=>(isFinite(n)?n:0).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
const fmtS=n=>(n>=0?'+':'−')+Math.abs(isFinite(n)?n:0).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
const fmtN=(n,d=0)=>(isFinite(n)?n:0).toLocaleString('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=(n,d=1)=>(n>=0?'+':'−')+Math.abs(isFinite(n)?n:0).toFixed(d).replace('.',',')+' %';
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayK=()=>dkey(new Date());
const addD=(k,n)=>{const d=new Date(k+'T12:00');d.setDate(d.getDate()+n);return dkey(d);};
const mkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const dShort=k=>new Date(k+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const dLong=k=>new Date(k+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const mShort=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('fr-FR',{month:'short'}).replace('.','')+' '+y.slice(2);};
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const sum=a=>a.reduce((s,x)=>s+x,0);

const fmtC=n=>{n=Math.floor(n);if(n<1e4)return n.toLocaleString('fr-FR');const u=['k','M','Md','T'];let i=-1,v=n;while(v>=1000&&i<u.length-1){v/=1000;i++;}return v.toLocaleString('fr-FR',{maximumFractionDigits:v<100?2:1})+' '+u[i];};
const fmtH=m=>{m=Math.max(Math.round(m),0);return Math.floor(m/60)+' h '+pad(m%60);};
const hhmm=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const tmin=s=>{if(!s)return NaN;const[h,m]=s.split(':').map(Number);return h*60+m;};

/* ================= constants ================= */
const CLASSES=['ETF','Actions','Crypto'];

const SPORTS={course:{name:'Course à pied',col:'#FF9500'},muscu:{name:'Musculation',col:'#0A84FF'},padel:{name:'Padel',col:'#FFCC00'},bodyboard:{name:'Bodyboard',col:'#32ADE6'}};
const EK={Voyage:'#6A9BCC',Sport:'#D97757',Anniversaire:'#C2483A',Boulot:'#5E5CA8',Congé:'#C9A15E',Perso:'#9A7BC0',Santé:'#4FA39A',Détente:'#7E9459'};

const ACCENTS=[['Vert','#1F9D55'],['Bleu','#0A7AFF'],['Violet','#AF52DE'],['Orange','#F57C00'],['Rose','#E91E63'],['Turquoise','#16A5B8']];
const KEY='rythme_v4';
const BUILD='30/10 11:59';

const blankGame=()=>({pts:0,life:0,taps:0,skin:0,skins:[0],claimed:{},myg:[],mig:0,chest:{last:'',streak:0,best:0},own:[],eq:{head:'',face:'',bg:''},badges:{},circle:0,wb:'',sprint:{day:'',plays:0,best:0},goal:{wT:'',wS:'',dT:'',dFrom:''}});
const blank=()=>({lines:[],ret:{ETF:6.5,Actions:8,Crypto:12},spread:{ETF:2.5,Actions:3.5,Crypto:8},dca:0,scen:null,
  proj:{init:5000,monthly:300,years:20,infl:2,goal:200000},ci:{init:1000,monthly:200,rate:7,years:20,freq:12},

function migrate(d){
  const o=Object.assign(blank(),d||{});
  o.lines=(o.lines||[]).map(l=>{const n=Object.assign({},l);if(n.pct==null)n.pct=n.w||0;delete n.w;return n;});

    if(gg.wT>0&&gg.wS>0){o.game.myg.push({id:'w0',type:'weight',from:gg.wS,target:gg.wT,start:dkey(new Date())});[25,50,75,100].forEach(f=>{if(cl['g:w:'+f])cl['og:w0:'+f]=1;});}
    if(gg.dT>0){o.game.myg.push({id:'d0',type:'km',target:gg.dT,start:gg.dFrom||dkey(new Date())});[25,50,75,100].forEach(f=>{if(cl['g:d:'+f])cl['og:d0:'+f]=1;});}}

  o.work=Object.assign({days:{},target:35},o.work||{});
  o.maxes=o.maxes||{};
  o.steps=o.steps||{};
  o.ci=Object.assign({init:1000,monthly:200,rate:7,years:20,freq:12},o.ci||{});
  if(!o.proj.monthly&&o.dca)o.proj.monthly=o.dca;
  if(!o.dca&&o.proj&&o.proj.monthly)o.dca=o.proj.monthly;
  if(!Array.isArray(o.scen)||!o.scen.length)o.scen=[

/* ================= Strava (import fichier) ================= */
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[];}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
const SV={run:'course','trail run':'course','virtual run':'course','weight training':'muscu',workout:'muscu',crossfit:'muscu',padel:'padel',surfing:'bodyboard'};
function importStrava(text){
  const rows=parseCSV(text);if(rows.length<2)return {err:'Fichier vide ou illisible.'};
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=n=>h.indexOf(n);
  const iId=col('activity id'),iD=col('activity date'),iT=col('activity type'),iDist=col('distance'),iMv=col('moving time'),iEl=col('elapsed time');
  if(iD<0||iT<0)return {err:'Colonnes « Activity Date » et « Activity Type » introuvables. L\'export doit être en anglais.'};
  const have=new Set(S.workouts.map(w=>w.sid).filter(Boolean));
  let added=0,dup=0,skip=0,bad=0;
  rows.slice(1).forEach(r=>{
    const type=SV[(r[iT]||'').trim().toLowerCase()];if(!type){skip++;return;}
    const sid=iId>=0?String(r[iId]).trim():'';if(sid&&have.has(sid)){dup++;return;}
    const dt=new Date(r[iD]);if(isNaN(dt)){bad++;return;}
    const sec=num(iMv>=0&&r[iMv]?r[iMv]:r[iEl]);if(!(sec>=180)){skip++;return;}
    const w={id:uid(),date:dkey(dt),type,rpe:6,min:Math.round(sec/60),src:'strava',sid:sid||undefined};
    if(type==='course'){let k=num(iDist>=0?r[iDist]:'');if(k>200)k=k/1000;if(k>0)w.dist=Math.round(k*100)/100;}
    S.workouts.push(w);if(sid)have.add(sid);added++;
  });
  S.imported=(S.imported||0)+added;
  return {added,dup,skip,bad};
}

function addConges(days){

  const groups=[];
  ds.forEach(k=>{const g=groups[groups.length-1];

function importHours(rows,opt){
  opt=opt||{};

  for(let i=0;i<Math.min(20,rows.length);i++){if((rows[i]||[]).some(c=>/^date\b/i.test(sv(c)))){hi=i;break;}}
  if(hi<0)for(let i=0;i<Math.min(20,rows.length);i++){if((rows[i]||[]).some(c=>/^(jour|day)s?$/i.test(sv(c)))){hi=i;break;}}
  const h=hi>=0?rows[hi].map(x=>sv(x).toLowerCase()):[];
  const find=(re,not)=>h.findIndex((x,i)=>re.test(x)&&!(not||[]).includes(i));
  const iD=hi>=0?(h.findIndex(x=>/^date\b/.test(x))>=0?h.findIndex(x=>/^date\b/.test(x)):find(/date|jour/)):0;
  const iLo=hi>=0?find(/(d[ée]but|d[ée]part|sortie).*(pause|d[ée]j|midi)|(pause|d[ée]j|midi).*(d[ée]but|d[ée]part|sortie)/):-1;
  const iLi=hi>=0?find(/(fin|retour|reprise).*(pause|d[ée]j|midi)|(pause|d[ée]j|midi).*(fin|retour|reprise)/):-1;
  const pz=[iLo,iLi];
  const iPz=hi>=0?find(/pause|d[ée]j|midi/,pz):-1;
  const used=[iD,iLo,iLi,iPz];
  const iIn=hi>=0?find(/d[ée]but|arriv|entr[ée]e|start|^in$|embauche|prise|matin/,used):1;
  const iOut=hi>=0?find(/^fin|\bfin\b|d[ée]part|sortie|end|^out$|d[ée]bauche|soir/,used.concat([iIn])):2;
  const iDur=hi>=0?find(/heure|dur[ée]e|total|hours|travaill|temps/,used.concat([iIn,iOut])):-1;
  const pDate=v=>{
    if(v instanceof Date&&!isNaN(v))return dkey(v);
    if(typeof v==='number'&&v>20000&&v<80000){if(opt.d1904)v+=1462;const d=new Date(Math.round((v-25569)*86400000));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
    const s=sv(v);let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
    m=s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if(m){let y=+m[3];if(y<100)y+=2000;const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+pad(mo)+'-'+pad(d);}
    m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
    return null;};
  const pTime=v=>{
    if(typeof v==='number'){if(v>=0&&v<1)return Math.round(v*1440);return NaN;}
    if(v instanceof Date&&!isNaN(v))return v.getUTCHours()*60+v.getUTCMinutes();
    const s=sv(v).toLowerCase();let m=s.match(/^(\d{1,2})\s*[:h]\s*(\d{2})?/);
    if(m){const a=+m[1]*60+(m[2]?+m[2]:0);return a<1440?a:NaN;}
    return NaN;};
  const pDur=(v,pause)=>{
    if(typeof v==='number'){if(v<=0)return 0;if(v<1)return Math.round(v*1440);return pause?Math.round(v):Math.round(v<=24?v*60:v);}
    const t=pTime(v);if(!isNaN(t))return t;
    const n=num(sv(v));if(isNaN(n)||n<=0)return 0;return pause?Math.round(n):Math.round(n<=24?n*60:n);};
  const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
  let added=0,dup=0,bad=0,tot=0,off=0;const batch={},offs=[];
  rows.slice(hi+1).forEach(r=>{
    if(!r||!r.length)return;
    const k=pDate(r[iD]);if(!k){if(r.some(c=>(typeof c==='number'&&c>0&&c<1)||/^\d{1,2}\s*[:h]\s*\d{2}$/.test(sv(c))))bad++;return;}
    let rec=null;
    if(iIn>=0&&/^x$/i.test(sv(r[iIn]))){off++;offs.push(k);return;}
    const a=iIn>=0?pTime(r[iIn]):NaN,b=iOut>=0?pTime(r[iOut]):NaN;
    if(!isNaN(a)&&isNaN(b)&&k===todayK()){const lo=iLo>=0?pTime(r[iLo]):NaN,li=iLi>=0?pTime(r[iLi]):NaN;rec={in:hm(a)};if(!isNaN(lo))rec.lo=hm(lo);if(!isNaN(li))rec.li=hm(li);batch[k]=rec;return;}
    if(isNaN(a)&&isNaN(b)&&(iDur<0||!(pDur(r[iDur],false)>0)))return;

        rec={in:'09:00',out:hm(540+net),syn:1};}
    }
    if(!rec){bad++;return;}
    batch[k]=rec;
  });
  Object.keys(batch).forEach(k=>{
    const ex=S.work.days[k];
    if(ex&&ex.in&&ex.out){dup++;return;}
    const rec=batch[k];delete rec.syn;
    S.work.days[k]=rec;added++;tot+=workMin(rec,false);
  });
  const conge=addConges(offs);
  return {added,dup,bad,tot,off,conge,cols:hi>=0?'':'sans en-têtes (colonnes : date, début, fin, pause)'};
}

function parseDur(s){
  s=String(s||'').trim().replace(',','.');if(!s)return NaN;
  const p=s.split(':').map(Number);if(p.some(x=>!isFinite(x)||x<0))return NaN;
  if(p.length===1)return p[0];
  if(p.length===2)return p[0]+p[1]/60;
  return p[0]*60+p[1]+p[2]/60;
}
function fmtDur(m){
  if(!isFinite(m)||m<=0)return '';
  let s=Math.round(m*60);const h=Math.floor(s/3600);s-=h*3600;const mi=Math.floor(s/60);s-=mi*60;
  return h>0?`${h}:${pad(mi)}:${pad(s)}`:`${mi}:${pad(s)}`;
}
function fmtPace(m){if(!isFinite(m)||m<=0)return '';let a=Math.floor(m),b=Math.round((m-a)*60);if(b===60){a++;b=0;}return a+':'+pad(b);}
function rcCompute(){
  const r=ui.rc,known=r.order.slice(0,2);
  if(known.length<2)return {};
  const d=num(r.d),t=parseDur(r.t),p=parseDur(r.p),o={};
  const miss=['d','t','p'].find(x=>!known.includes(x));
  if(miss==='d'&&t>0&&p>0)o.d=t/p;
  if(miss==='t'&&d>0&&p>0)o.t=d*p;
  if(miss==='p'&&d>0&&t>0)o.p=t/d;
  return {miss,o};
}

function workMin(rec,live){
  if(!rec||!rec.in)return 0;
  const a=tmin(rec.in);let end=null,lunch=0;
  if(rec.out)end=tmin(rec.out);
  else if(live){const n=new Date();end=n.getHours()*60+n.getMinutes();}

  else if(rec.lo&&!rec.li&&!rec.out){end=tmin(rec.lo);}
  if(end==null)return 0;
  return Math.max(end-a-lunch,0);

function glevel(){

  if(s<n){const a0=TH[s-1],b0=TH[s],step=(b0-a0)/5,k=Math.min(4,Math.floor((life-a0)/step));a=a0+k*step;b=a+step;l=(s-1)*5+k+1;}
  else{const step=350,k=Math.floor((life-TH[n-1])/step);a=TH[n-1]+k*step;b=a+step;l=(n-1)*5+k+1;}
  a=Math.round(a);b=Math.round(b);
  return {l,a,b,p:Math.min(Math.max((life-a)/(b-a),0),1),stage:s,toNext:s<n?TH[s]-life:0};
}

function goalProg(o){
  const st=o.start||'0000',T=+o.target||0;let cur=0,p=0,lab='';
  if(o.type==='weight'){cur=curWeight();const a=+o.from;p=(a&&T&&cur&&a!==T)?(a-cur)/(a-T):0;lab=`${fmtN(cur,1)} kg · cible ${fmtN(T,1)}`;}
  else if(o.type==='km'){cur=sum(S.workouts.filter(w=>w.type==='course'&&w.date>=st).map(w=>w.dist||0));p=T>0?cur/T:0;lab=`${fmtN(cur,1)} / ${fmtN(T,0)} km`;}
  else if(o.type==='sess'){cur=S.workouts.filter(w=>w.date>=st).length;p=T>0?cur/T:0;lab=`${cur} / ${fmtN(T)} séances`;}
  else if(o.type==='hours'){cur=sum(S.workouts.filter(w=>w.date>=st).map(w=>w.min))/60;p=T>0?cur/T:0;lab=`${fmtN(cur,1)} / ${fmtN(T)} h`;}
  else if(o.type==='streak'){o.max=Math.max(o.max||0,streak());cur=o.max;p=T>0?cur/T:0;lab=`${cur} / ${fmtN(T)} jours`;}
  else if(o.type==='save'){cur=S.dca||0;p=T>0?cur/T:0;lab=`${fmt(cur)} / ${fmt(T)} par mois`;}
  p=Math.min(Math.max(p,0),1);
  let left='';
  if(o.dl){const n=Math.round((new Date(o.dl+'T12:00')-new Date(todayK()+'T12:00'))/864e5);left=p>=1?'':n<0?'Échéance dépassée':n===0?'Dernier jour':n+' j restants';}
  return {p,lab,left,cur};
}
function goalMiles(){
  const out=[];
  (G().myg||[]).forEach(o=>{const p=goalProg(o).p;
    MILE.forEach(([f,pts])=>{const id='og:'+o.id+':'+Math.round(f*100);out.push({id,gid:o.id,f,pts,done:p>=f-1e-9,claimed:!!G().claimed[id]});});});
  return out;
}
function claim(id){
  const g=G(),it=objectives().concat(goalMiles()).find(o=>o.id===id);

}

function tap(ev,el){
  const sc=$('#scene');
  if(sc){const r=sc.getBoundingClientRect();
    const x=(ev&&ev.clientX?ev.clientX-r.left:r.width/2)-40,y=(ev&&ev.clientY?ev.clientY-r.top:r.height/2)-30;
    const f=document.createElement('div');f.className='fl';f.textContent=SAYS[Math.floor(Math.random()*SAYS.length)];f.style.left=Math.max(x,6)+'px';f.style.top=y+'px';sc.appendChild(f);setTimeout(()=>f.remove(),950);}
  el.classList.add('tap');setTimeout(()=>el.classList.remove('tap'),110);
  G().taps=(G().taps||0)+1;if(G().taps%15===0)burst(ev&&ev.clientX,ev&&ev.clientY,10);
}

/* ---- sprint : mini-jeu de 10 secondes ---- */
function startSprint(){
  const old=$('#sprint');if(old){clearInterval(old._t);old.remove();}
  const g=G(),td=todayK(),sp=g.sprint;if(sp.day!==td){sp.day=td;sp.plays=0;}
  const reward=sp.plays<2,ov=document.createElement('div');ov.className='sprint';ov.id='sprint';
  ov.innerHTML=`<button class="sx" data-act="sprintx" aria-label="Fermer">×</button>
  <div class="sinfo" id="sinfo">${reward?'Touche l\'emblème le plus vite possible':'Entraînement libre'}</div><div class="stime" id="stime">10,0</div>
  <div class="smas" id="smas">${mascot(glevel().stage)}</div><div class="scount" id="scount">0</div><div class="sgo" id="sgo">Touche pour démarrer</div>`;
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  let taps=0,t0=0,over=false;
  const mas=ov.querySelector('#smas');
  const finish=()=>{
    over=true;clearInterval(ov._t);
    const best=taps>sp.best;if(best)sp.best=taps;
    let r=0;if(reward){r=Math.min(4,Math.floor(taps/12));sp.plays++;g.pts+=r;g.life+=r;}
    saveSoon();
    ov.querySelector('#stime').textContent='0,0';
    ov.querySelector('#sgo').innerHTML=`<div class="sres"><b>${taps}</b> touches${best&&taps>0?' · nouveau record !':''}<div class="srew">${reward?(r?'+'+r+' '+STAR:'Encore un effort pour gagner des étoiles'):'Pas de récompense'}</div><button class="abtn" data-act="sprintagain">Rejouer</button></div>`;
    if(best&&taps>0)burst(innerWidth/2,innerHeight/2,40);else if(r)burst(innerWidth/2,innerHeight/2,20);
  };
  mas.addEventListener('pointerdown',e=>{
    e.preventDefault();if(over)return;
    if(!t0){t0=performance.now();ov.querySelector('#sgo').textContent='Vas-y !';
      ov._t=setInterval(()=>{const left=10-(performance.now()-t0)/1000;if(left<=0){finish();return;}ov.querySelector('#stime').textContent=fmtN(left,1);},50);}
    taps++;ov.querySelector('#scount').textContent=taps;
    mas.classList.remove('hit');void mas.offsetWidth;mas.classList.add('hit');
  });
}

function planMonth(){
  if(!ui.sel)ui.sel=todayK();
  const td=todayK(),b=new Date();b.setDate(1);b.setMonth(b.getMonth()+ui.pm);
  const y=b.getFullYear(),m=b.getMonth(),lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),rows=lead+dim>35?42:35;
  const cells=[];

function parseStepsText(t){
  const MO={janv:1,jan:1,'févr':2,fev:2,'fév':2,feb:2,mars:3,mar:3,avr:4,apr:4,mai:5,may:5,juin:6,jun:6,juil:7,jul:7,'août':8,aout:8,aug:8,sept:9,sep:9,oct:10,nov:11,'déc':12,dec:12};
  const out={};
  String(t||'').split(/\r?\n|;(?=\s*\d{4}-)/).forEach(line=>{
    const l=line.trim();if(!l)return;let k=null,rest=l;
    let m=l.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m){k=m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);rest=l.replace(m[0],' ');}
    else if((m=l.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;k=y+'-'+pad(+m[2])+'-'+pad(+m[1]);rest=l.replace(m[0],' ');}
    else if((m=l.toLowerCase().match(/(\d{1,2})\s+([a-zéû]+)\.?\s+(\d{4})/))){const mo=MO[m[2].slice(0,4)]||MO[m[2].slice(0,3)];if(mo){k=m[3]+'-'+pad(mo)+'-'+pad(+m[1]);rest=l.toLowerCase().replace(m[0],' ');}}
    if(!k)return;
    rest=rest.replace(/à\s*\d{1,2}[:h]\d{2}/gi,' ').replace(/\b\d{1,2}:\d{2}(:\d{2})?\b/g,' ');
    const nums=(rest.match(/\d[\d\s  ]*(?:[.,]\d+)?/g)||[]).map(x=>Math.round(parseFloat(x.replace(/[\s  ]/g,'').replace(',','.')))).filter(n=>n>=0&&n<200000);
    if(!nums.length)return;const v=Math.max(...nums);
    out[k]=Math.max(out[k]||0,v);
  });
  return out;
}
async function parseHealthXml(file,onProg){
  /* lecture par morceaux : supporte les gros export.xml de l'app Santé sans saturer la mémoire */
  const per={},CH=4*1024*1024,dec=new TextDecoder();let pos=0,carry='';
  const re=/<Record type="HKQuantityTypeIdentifierStepCount"[^>]*?sourceName="([^"]*)"[^>]*?startDate="(\d{4}-\d{2}-\d{2})[^"]*"[^>]*?value="([\d.]+)"/g;
  while(pos<file.size){
    const buf=await file.slice(pos,pos+CH).arrayBuffer();pos+=CH;
    let txt=carry+dec.decode(buf,{stream:pos<file.size});
    const cut=txt.lastIndexOf('<Record');carry=cut>0&&pos<file.size?txt.slice(cut):'';if(carry)txt=txt.slice(0,cut);
    let m;re.lastIndex=0;while((m=re.exec(txt))){const k=m[2],src=m[1],v=+m[3];(per[k]=per[k]||{})[src]=(per[k][src]||0)+v;}
    if(onProg)onProg(Math.min(pos/file.size,1));
  }
  const out={};Object.keys(per).forEach(k=>{out[k]=Math.round(Math.max(...Object.values(per[k])));});
  return out;
}

const goalRate=()=>{const t=S.goalT;return(t.rate!=null&&t.rate!=='')?+t.rate:Math.round(blended().r*10)/10;};
const goalInit=()=>{const t=S.goalT;return(t.init!=null&&t.init!=='')?+t.init:(S.proj.init||0);};
function goalCalc(){
  const t=S.goalT,y=Math.min(Math.max(Math.round(t.years)||1,1),50),n=y*12,rate=goalRate(),r=Math.pow(1+rate/100,1/12)-1,init=goalInit(),T=+t.target||0,dca=S.dca||0;
  const g=Math.pow(1+r,n);
  const need=r>0?Math.max((T-init*g)*r/(g-1),0):Math.max((T-init)/n,0);
  const path=pm=>{let v=init;const o=[v];for(let m=1;m<=n;m++){v=v*(1+r)+pm;if(m%12===0)o.push(v);}return o;};
  let months=init>=T?0:null;if(months==null){let v=init;for(let m=1;m<=1200;m++){v=v*(1+r)+dca;if(v>=T){months=m;break;}}}
  const needFor=yy=>{const nn=yy*12,gg=Math.pow(1+r,nn);return r>0?Math.max((T-init*gg)*r/(gg-1),0):Math.max((T-init)/nn,0);};
  return {y,n,rate,r,init,T,dca,need,pn:path(need),pd:path(dca),months,needFor};
}

const useAmt=()=>S.lines.some(l=>l.amt>0);

const lineRate=l=>(l.r!=null&&l.r!==''&&isFinite(l.r))?+l.r:(S.ret[l.cls]||0);
function mix(){
  const tot=pctTot(),ct={};CLASSES.forEach(c=>ct[c]=0);
  S.lines.forEach(l=>{ct[l.cls]+=lw(l);});
  if(tot<=0)return {tot:0,ct,sh:{ETF:0,Actions:0,Crypto:0},empty:true};
  const sh={};CLASSES.forEach(c=>sh[c]=ct[c]/tot);
  return {tot,ct,sh,empty:false};
}
function blended(){
  const m=mix();
  if(m.empty)return {r:S.ret.ETF,sp:S.spread.ETF,m};
  return {r:sum(S.lines.map(l=>lw(l)*lineRate(l)))/m.tot,sp:sum(S.lines.map(l=>lw(l)*(S.spread[l.cls]||0)))/m.tot,m};
}
function project(init,monthly,years,r){
  const rm=Math.pow(1+r/100,1/12)-1;let v=init;const out=[v];
  for(let y=1;y<=years;y++){for(let i=0;i<12;i++)v=v*(1+rm)+monthly;out.push(v);}
  return out;
}

const LCOL=['#0FA97A','#0A84FF','#FF9500','#AF52DE','#FF2D55','#32ADE6','#F5B400','#8E8E93'];
function evCalc(y){
  const tot=pctTot(),lines=tot>0?S.lines:[{id:'x',name:'ETF monde',cls:'ETF',pct:100}],T=tot>0?tot:100;
  const init=S.proj.init||0,dca=S.dca||0;
  const layers=lines.map((l,i)=>{const sh=lw(l)/T,r=lineRate(l),sp=S.spread[l.cls]||0;
    return {name:l.name,c:LCOL[i%LCOL.length],cls:l.cls,sh,v:project(init*sh,dca*sh,y,r),lo:project(init*sh,dca*sh,y,Math.max(r-sp,-5)),hi:project(init*sh,dca*sh,y,r+sp)};});
  const sumAt=(k,i)=>sum(layers.map(L=>L[k][i]));
  const mid=layers[0].v.map((_,i)=>sumAt('v',i)),lo=mid.map((_,i)=>sumAt('lo',i)),hi=mid.map((_,i)=>sumAt('hi',i));
  const versed=mid.map((_,i)=>init+dca*12*i);
  return {layers,mid,lo,hi,versed,empty:tot<=0};
}
function stackArea(ev,y,reveal){
  const W=340,H=210,pl=8,pr=8,pt=14,pb=24,n=y+1;
  const mx=Math.max(...ev.hi,1),X=i=>pl+(W-pl-pr)*i/Math.max(y,1),Y=v=>pt+(H-pt-pb)*(1-v/mx);
  const cum=ev.layers.map((_,li)=>ev.mid.map((_,i)=>sum(ev.layers.slice(0,li+1).map(L=>L.v[i]))));
  const paths=ev.layers.map((L,li)=>{
    const top=cum[li],bot=li?cum[li-1]:ev.mid.map(()=>0);
    const up=top.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    const dn=bot.map((v,i)=>'L'+X(n-1-i).toFixed(1)+' '+Y(bot[n-1-i]).toFixed(1)).join(' ');
    return `<path d="${up} ${dn} Z" fill="${L.c}" fill-opacity=".88"/>`;}).join('');
  const line=(arr,c,dash,w)=>`<path d="${arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="${w||1.6}" ${dash?'stroke-dasharray="5 4"':''} stroke-linecap="round" stroke-linejoin="round"/>`;
  const step=Math.ceil(n/6);
  const labs=Array.from({length:n},(_,i)=>(i%step===0||i===n-1)?`<text x="${X(i)}" y="${H-6}" font-size="10" text-anchor="middle" style="fill:var(--muted)">${i===0?'0':i+' a'}</text>`:'').join('');
  const grid=[.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" style="stroke:var(--border)"/>`).join('');
  return `<svg class="${reveal?'reveal':''}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution possible du portefeuille"${scrubData(W,pt,H-pb,Array.from({length:n},(_,i)=>X(i)),Array.from({length:n},(_,i)=>`<b>${i?'Dans '+i+' an'+(i>1?'s':''):'Aujourd\'hui'}</b><span>Probable ${esc(fmtK(ev.mid[i]))}</span><span>Versé ${esc(fmtK(ev.versed[i]))}</span><span>Fourchette ${esc(fmtK(ev.lo[i]))} – ${esc(fmtK(ev.hi[i]))}</span>`))}>${grid}${paths}${line(ev.versed,'#fff',1,1.8)}${line(ev.hi,'var(--text)',1,1.2)}${line(ev.lo,'var(--text)',1,1.2)}<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--border)"/>${labs}</svg>`;
}
const fmtK=v=>v>=1e6?fmtN(v/1e6,2)+' M€':v>=1e4?fmtN(v/1e3)+' k€':fmt(v);
function evOutAll(reveal){

function ciRun(c){
  const y=Math.min(Math.max(Math.round(c.years)||1,1),60),f=c.freq||12;
  const rm=Math.pow(1+(c.rate||0)/100/f,f/12)-1;
  let v=c.init||0,ver=c.init||0;const rows=[{y:0,ver,v,int:0}];
  for(let a=1;a<=y;a++){for(let i=0;i<12;i++){v=v*(1+rm)+(c.monthly||0);ver+=(c.monthly||0);}rows.push({y:a,ver,v,int:v-ver});}
  const rr=(c.rate||0)/100,mo=c.monthly||0,simple=(c.init||0)*(1+rr*y)+mo*12*y+mo*rr*y*(12*y-1)/2;
  return {rows,y,fin:v,ver,int:v-ver,simple};
}
function ciChart(rows){
  const W=340,H=200,pl=6,pr=6,pt=12,pb=22,n=rows.length-1;
  const mx=Math.max(...rows.map(r=>r.v),1),bw=(W-pl-pr)/n,w=Math.max(Math.min(bw*.7,26),2);
  const Y=v=>pt+(H-pt-pb)*(1-v/mx);
  const step=Math.ceil(n/8);
  const bars=rows.slice(1).map((r,i)=>{const x=pl+bw*i+(bw-w)/2,hv=(H-pb)-Y(r.ver),hi=Y(r.ver)-Y(r.v);
    return `<rect x="${x.toFixed(1)}" y="${Y(r.ver).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hv,0).toFixed(1)}" fill="#8E8E93" fill-opacity=".55"/><rect x="${x.toFixed(1)}" y="${Y(r.v).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hi,0).toFixed(1)}" fill="url(#cig)"/>${(r.y%step===0||r.y===n)?`<text x="${(x+w/2).toFixed(1)}" y="${H-6}" font-size="9.5" text-anchor="middle" style="fill:var(--muted)">${r.y}</text>`:''}`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Capital année par année"${scrubData(W,pt,H-pb,rows.slice(1).map((r,i)=>pl+bw*i+bw/2),rows.slice(1).map(r=>`<b>Année ${r.y}</b><span>Capital ${esc(fmtK(r.v))}</span><span>Versé ${esc(fmtK(r.ver))}</span><span>Intérêts ${esc(fmtK(r.v-r.ver))}</span>`))}><defs><linearGradient id="cig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5B400"/><stop offset="1" stop-color="#0FA97A"/></linearGradient></defs><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--border)"/>${bars}</svg>`;
}

async function pdfLines(blob){
  const L=await loadPdfJs(),doc=await L.getDocument({data:await blob.arrayBuffer()}).promise,out=[];
  for(let i=1;i<=Math.min(doc.numPages,3);i++){
    const tc=await (await doc.getPage(i)).getTextContent(),rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r){r={y,it:[]};rows.push(r);}r.it.push({x,s:it.str});});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.it.sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim()));
  }
  return out;
}
const AMT='(\\d{1,3}(?:[ \\u00a0\\u202f]\\d{3})*(?:[.,]\\d{1,2})?)';
const pAmt=s=>{if(s==null)return null;s=String(s).replace(/[   ]/g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:null;};

  const T=lines.join(' \n ').replace(/[  ]/g,' '),F=T.replace(/\s*\n\s*/g,' ');
  const g=(re)=>{const m=F.match(re);return m?pAmt(m[1]):null;};
  const d={};
  let m=F.match(/Du\s+(\d{2})\/(\d{2})\/(\d{4})\s+au\s+(\d{2})\/(\d{2})\/(\d{4})/i);
  if(m)d.m=m[3]+'-'+m[2];
  else{const MO={janvier:1,'février':2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,'août':8,aout:8,septembre:9,octobre:10,novembre:11,'décembre':12,decembre:12};
    const mm=F.toLowerCase().match(/(janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[ée]cembre)\s+(20\d{2})/);
    if(mm)d.m=mm[2]+'-'+pad(MO[mm[1]]||MO[mm[1].normalize('NFD').replace(/[̀-ͯ]/g,'')]);}

  d.charges=g(new RegExp('Charges salariales\\s*:?\\s*'+AMT,'i'))??g(new RegExp('TOTAL DES COTISATIONS ET CONTRIBUTIONS\\s+'+AMT,'i'));
  d.netAvant=g(new RegExp('Net à payer avant imp[ôo]t(?: sur le revenu)?\\s*:?\\s*'+AMT,'i'));
  d.impot=g(new RegExp('Imp[ôo]t (?:sur le revenu )?prélevé(?: à la source)?\\s*:?\\s*-?\\s*'+AMT,'i'));
  d.netSocial=g(new RegExp('Montant net social\\s*:?\\s*'+AMT,'i'));
  d.net=g(new RegExp('Net à payer après imp[ôo]t\\s*:?\\s*'+AMT,'i'))??g(new RegExp('Net payé\\s*:?\\s*'+AMT,'i'))??g(new RegExp('Salaire net à payer\\s+'+AMT+'\\s*€','i'));
  m=F.match(new RegExp('Assiette de l.imp[ôo]t.*?Cumul imp[ôo]t prélevé.*?'+AMT+'\\s*€\\s+(\\d{1,2}(?:[.,]\\d{1,2})?)\\s*%\\s+'+AMT+'\\s*€?\\s+'+AMT,'i'));
  if(m){d.imposable=pAmt(m[1]);d.taux=pAmt(m[2]);d.cumImposable=pAmt(m[3]);d.cumImpot=pAmt(m[4]);}
  else{d.taux=g(/Taux (?:neutre|personnalis[ée]|PAS)?\s*:?\s*(\d{1,2}(?:[.,]\d{1,2})?)\s*%/i);d.imposable=g(new RegExp('Net imposable\\s*:?\\s*'+AMT,'i'));}
  m=F.match(new RegExp('TOTAL DES COTISATIONS ET CONTRIBUTIONS\\s+'+AMT+'\\s+'+AMT,'i'));if(m)d.patronal=pAmt(m[2]);
  d.cout=g(new RegExp('Co[ûu]t (?:global|total employeur)\\s*:?\\s*'+AMT,'i'));
  m=F.match(/Cong[ée]s pay[ée]s[^]{0,140}?(\d+[.,]\d+)\s*jours/i);if(m)d.cp=pAmt(m[1]);
  m=F.match(/\bRTT\b[^]{0,200}?(\d+[.,]\d+)\s*jours/i);if(m)d.rtt=pAmt(m[1]);
  if(d.net==null&&d.netAvant!=null&&d.impot!=null)d.net=Math.round((d.netAvant-d.impot)*100)/100;
  if(d.cout==null&&d.brut!=null&&d.patronal!=null)d.cout=Math.round((d.brut+d.patronal)*100)/100;
  Object.keys(d).forEach(k=>{if(d[k]==null)delete d[k];});
  return d;
}

/* ---- Saisie unique ---- */
function tplList(t){
  const out=[];
  if(t==='muscu')TPL_M.forEach((x,i)=>out.push({ref:'m:'+i,n:x.n,d:x.d}));
  else TPL_O.forEach((x,i)=>{if(x.t===t)out.push({ref:'o:'+i,n:x.n,d:x.d});});
  S.templates.filter(x=>x.type===t).forEach(x=>out.push({ref:'c:'+x.id,n:x.name,d:x.type==='muscu'?x.exs.length+' exercices':(x.min?x.min+' min':'')+(x.dist?' · '+x.dist+' km':''),custom:x.id}));
  return out;
}
function applyTpl(ref){
  const d=ui.draft,[k,id]=[ref.slice(0,1),ref.slice(2)];
  if(k==='m'){d.exs=TPL_M[+id].x.map(([n,s,r])=>exFromTpl(n,s,r));}
  else if(k==='o'){const t=TPL_O[+id];d.min=t.min;if(t.fmt)d.fmt=t.fmt;}
  else{const t=S.templates.find(x=>x.id===id);if(!t)return;
    if(t.type==='muscu')d.exs=t.exs.map(([n,s,r])=>exFromTpl(n,s,r));
    else{if(t.min)d.min=t.min;if(t.dist)d.dist=t.dist;if(t.fmt)d.fmt=t.fmt;}}
}

/* ---- Calcul de course ---- */
function rcFinal(){
  const r=ui.rc;const d=num(r.d),t=parseDur(r.t),p=parseDur(r.p);
  return (d>0&&t>0&&p>0)?{d,t,p}:null;
}
function rcResult(){
  const f=rcFinal();if(!f)return '';
  const {d,t,p}=f,neg=!!ui.rc.neg;
  const p1=neg?p*1.02:p,p2=neg?p*0.98:p,half=d/2;
  const at=k=>neg?(k<=half?k*p1:half*p1+(k-half)*p2):k*p;
  const step=d<=12?1:d<=25?2:5;
  const pts=[];for(let k=step;k<d-0.001;k+=step)pts.push(k);pts.push(d);
  const rows=[[5,'5 km'],[10,'10 km'],[21.0975,'Semi'],[42.195,'Marathon']];
  const riegel=k=>t*Math.pow(k/d,1.06);
  const p10=riegel(10)/10,p5=riegel(5)/5,pm=riegel(42.195)/42.195;
  const zones=[['Récupération',p10*1.28,p10*1.45,'#34C759'],['Endurance',p10*1.14,p10*1.28,'#32ADE6'],['Marathon',pm*0.99,pm*1.02,'#0A84FF'],['Seuil',p10*1.0,p10*1.06,'#FF9500'],['Intervalles',p5*0.93,p5*0.99,'#FF2D55']];
  return `<div class="hero2"><div class="sm">Ton allure</div><div class="big">${fmtPace(p)} <span style="font-size:18px;font-weight:700">/km</span></div><div class="sm">${fmtN(60/p,2)} km/h · ${fmtDur(t)} pour ${fmtN(d,2)} km</div>
    <div class="mini3"><div><small>Au mile</small><b>${fmtPace(p*1.609344)}</b></div><div><small>400 m</small><b>${fmtDur(p*0.4)}</b></div><div><small>Calories</small><b>${fmtN(10*weight()*(t/60)*0.98)}</b></div></div></div>
  <div class="sublabel">Temps de passage <button class="chip ${neg?'on':''}" style="margin-left:8px;padding:5px 10px;font-size:12px" data-act="rcneg">Départ prudent</button></div>
  <div class="row-list">${pts.map((k,i)=>{const pk=i?pts[i-1]:0,sp=(at(k)-at(pk))/(k-pk);return `<div class="row"><span class="row-title">${k===d?fmtN(d,2).replace(',00','')+' km (arrivée)':fmtN(k,0)+' km'}</span><span class="row-sub" style="margin:0">${fmtPace(sp)}/km</span><span class="row-value">${fmtDur(at(k))}</span></div>`;}).join('')}</div>
  ${neg?'<p class="note">Départ à +2 % plus lent, seconde moitié 2 % plus vite : même temps final.</p>':''}
  <div class="section-head"><h2 class="section-title">Au même rythme</h2></div>
  <div class="row-list">${rows.map(([k,l])=>`<div class="row"><span class="row-title">${l}</span><span class="row-value">${fmtDur(p*k)}</span></div>`).join('')}</div>
  <div class="sublabel">Prédiction depuis cette performance (Riegel)</div><div class="row-list">${rows.map(([k,l])=>`<div class="row"><span class="row-title">${l}</span><span class="row-value">${fmtDur(riegel(k))}</span></div>`).join('')}</div>
  <div class="section-head"><h2 class="section-title">Allures d'entraînement</h2></div>
  <div class="row-list">${zones.map(([n,a,b,c])=>`<div class="row"><span class="row-title"><span class="dot" style="background:${c};margin-right:8px"></span>${n}</span><span class="row-value">${fmtPace(Math.min(a,b))} à ${fmtPace(Math.max(a,b))}</span></div>`).join('')}</div>
  <p class="note">Estimations à partir de ton allure équivalente sur 10 km, à ajuster avec tes sensations et ta fréquence cardiaque. Pas un avis médical.</p>
  <button class="btn btn-primary" style="width:100%;margin-top:12px" data-act="rcsave">Enregistrer cette course</button>`;
}

function scrubInit(){

    let d=svg._sd;if(!d){try{d=svg._sd=JSON.parse(svg.getAttribute('data-scrub'));}catch(er){return;}}
    const r=svg.getBoundingClientRect(),vx=(e.clientX-r.left)/r.width*d.w;
    let i=0,best=1e9;d.x.forEach((x,k)=>{const dd=Math.abs(x-vx);if(dd<best){best=dd;i=k;}});
    let g=svg.querySelector('.scg');
    if(!g){svg.insertAdjacentHTML('beforeend',`<g class="scg"><line y1="${d.t}" y2="${d.b}"/></g>`);g=svg.querySelector('.scg');}
    const ln=g.querySelector('line');ln.setAttribute('x1',d.x[i]);ln.setAttribute('x2',d.x[i]);g.classList.add('on');
    const host=svg.parentElement;if(getComputedStyle(host).position==='static')host.style.position='relative';
    let tip=host.querySelector(':scope>.sctip');if(!tip){tip=document.createElement('div');tip.className='sctip';host.appendChild(tip);}
    if(tip._i!==i){tip.innerHTML=d.r[i];tip._i=i;}
    const hr=host.getBoundingClientRect(),px=r.left-hr.left+d.x[i]/d.w*r.width;
    tip.style.left=Math.max(4,Math.min(px-tip.offsetWidth/2,hr.width-tip.offsetWidth-4))+'px';tip.style.top=(r.top-hr.top-6)+'px';tip.classList.add('on');
    clearTimeout(tmo);
  };
  const hide=()=>{clearTimeout(tmo);tmo=setTimeout(()=>{document.querySelectorAll('.scg.on,.sctip.on').forEach(x=>x.classList.remove('on'));},1400);};
  document.addEventListener('pointerdown',show,{passive:true});
  document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pressure>0)show(e);},{passive:true});

}

function ageBand(a){return a<30?[18,29]:a<40?[30,39]:a<50?[40,49]:a<60?[50,59]:[60,99];}
function ageF(a,run){const f=run?[1,1.005,1.05,1.12,1.25]:[1,.98,.92,.84,.72];const i=a<30?0:a<40?1:a<50?2:a<60?3:4;return f[i];}

const ncdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;};
function mxVal(e){const m=(S.maxes||{})[e.k];if(!m)return null;
  if(e.u==='kg'){const kg=+m.kg,r=+m.reps||1;if(!(kg>0))return null;return r<=1?kg:kg*(1+Math.min(r,12)/30);}
  if(e.u==='reps'){return +m.reps>=0&&m.reps!==''?+m.reps:null;}

function mxPct(e,pan){
  const v=mxVal(e);if(v==null)return null;

  const p=S.profile||{},fem=p.sex==='f',bw=curWeight()||weight()||75,run=e.u==='time';
  let m=ref.m,s=ref.s;
  if(fem)m=run?m*MXSEX[e.k]:m*MXSEX[e.k];

/* ---- rappels dans le Calendrier de l'iPhone (.ics, notifications natives, 100 % local) ---- */
const icsD=(k,t)=>k.replace(/-/g,'')+'T'+t.replace(':','')+'00';
const icsEsc=s=>String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
function icsWrap(evs){return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rythme//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Rythme'].concat(evs,['END:VCALENDAR']).join('\r\n');}
function icsPointage(){
  let k=todayK();while(new Date(k+'T12:00').getDay()!==1)k=addD(k,1);
  const offs=[];for(let i=0;i<400;i++){const d=addD(todayK(),i);if(evOn(d).some(e=>e.kind==='Congé'))offs.push(d);}
  const st=Date.now();
  return icsWrap([['in','07:00','Pointer ton arrivée'],['lo','12:00','Pointer ta pause déjeuner'],['li','13:00','Pointer ton retour'],['out','17:00','Pointer ton départ']].map(([id,t,txt])=>{
    const e=t.split(':'),end=pad(+e[0])+':'+pad(+e[1]+5);
    return ['BEGIN:VEVENT','UID:rythme-'+id+'@rythme','DTSTAMP:'+icsD(todayK(),'00:00')+'Z','DTSTART:'+icsD(k,t),'DTEND:'+icsD(k,end),'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',
      ...(offs.length?['EXDATE:'+offs.map(d=>icsD(d,t)).join(',')]:[]),'SUMMARY:'+icsEsc(txt),'DESCRIPTION:Ouvre Rythme pour pointer.','TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(txt),'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n');}));
}
function icsPlanning(){
  const td=todayK(),evs=S.events.filter(e=>(e.end||e.date)>=td&&e.kind!=='Congé');
  return icsWrap(evs.map(e=>{const allDay=!e.time||e.end;const L=['BEGIN:VEVENT','UID:rythme-'+e.id+'@rythme','DTSTAMP:'+icsD(td,'00:00')+'Z'];
    if(allDay){L.push('DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addD(e.end||e.date,1).replace(/-/g,''));}
    else{const[h,m]=e.time.split(':').map(Number),t2=h*60+m+(+e.dur||60);L.push('DTSTART:'+icsD(e.date,e.time),'DTEND:'+icsD(e.date,pad(Math.floor(t2/60)%24)+':'+pad(t2%60)));}
    if(e.rep==='w')L.push('RRULE:FREQ=WEEKLY');else if(e.rep==='y')L.push('RRULE:FREQ=YEARLY');
    L.push('SUMMARY:'+icsEsc(e.title||e.kind),'CATEGORIES:'+icsEsc(e.kind));
    if(!allDay)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title||e.kind),'TRIGGER:-PT30M','END:VALARM');
    L.push('END:VEVENT');return L.join('\r\n');}));
}

function saveLocal(name,data){

let lastKey='',_en=null;
function animateCounts(){
  const els=document.querySelectorAll('#main .cu');if(!els.length)return;
  const t0=performance.now(),D=900;
  const step=now=>{const k=Math.min((now-t0)/D,1),e=1-Math.pow(1-k,3);
    els.forEach(el=>{const v=+el.dataset.v,f=CUF[el.dataset.f];if(f)el.textContent=f(v*e);});
    if(k<1)requestAnimationFrame(step);else els.forEach(el=>{const f=CUF[el.dataset.f];if(f)el.textContent=f(+el.dataset.v);});};
  requestAnimationFrame(step);
}
function revealBelow(main){return;
  if(!('IntersectionObserver' in window))return;

  if(a==='dele'){S.events=S.events.filter(x=>x.id!==id);save();render();return;}
  if(a==='evdone'){const ev=S.events.find(x=>x.id===id);if(!ev)return;
    ui.tab='sport';ui.sp='add';ui.draft=newDraft();ui.draft.type=ev.sport||'course';ui.draft.date=k||td;if(ev.dur)ui.draft.min=ev.dur;render();scrollTop();return;}

  /* nutrition */
  if(a==='saveprofile'){
    const age=num(val('p-a')),h=num(val('p-h')),w=num(val('p-w'));
    if(isNaN(age)||isNaN(h)||isNaN(w)||age<14||h<100||w<30)return;
    S.profile={sex:val('p-s'),age,height:h,weight:w,base:num(val('p-b')),goal:val('p-g')};
    S.wlog=S.wlog||[];const last=S.wlog[S.wlog.length-1];
    if(last&&last.d===td)last.kg=w;else if(!last||last.kg!==w)S.wlog.push({d:td,kg:w});
    ui.open.pf=false;save();render();return;}

  /* saisie */
  if(a==='dtype'){ui.draft.type=id;render();return;}
  if(a==='tpl'){applyTpl(id);render();return;}
  if(a==='deltpl'){S.templates=S.templates.filter(x=>x.id!==id);save();render();return;}
  if(a==='addex'){
    const name=val('ex-n').trim();if(!name)return;
    const lib=exLib();let group=lib[name];
    if(!group){group=val('ex-g');S.customEx.push({name,group});save();}
    const prev=lastSets(name);
    ui.draft.exs.push({name,group,prev,sets:prev?prev.map(t=>({kg:t.kg,reps:t.reps})):[{kg:'',reps:''}]});render();return;}
  if(a==='delex'){ui.draft.exs.splice(+id,1);render();return;}
  if(a==='addset'){const ex=ui.draft.exs[+id],l=ex.sets[ex.sets.length-1]||{kg:'',reps:''};ex.sets.push({kg:l.kg,reps:l.reps});render();return;}
  if(a==='delset'){const[i,j]=id.split(':').map(Number);const ex=ui.draft.exs[i];ex.sets.splice(j,1);if(!ex.sets.length)ui.draft.exs.splice(i,1);render();return;}
  if(a==='savetpl'){
    const n=val('tpl-n').trim(),d=ui.draft;if(!n){ui.msg='Donne un nom au modèle.';render();return;}
    const t={id:uid(),name:n,type:d.type};
    if(d.type==='muscu'){t.exs=d.exs.filter(x=>x.name).map(x=>[x.name,x.sets.length||3,num(x.sets[0]&&x.sets[0].reps)||10]);if(!t.exs.length){ui.msg='Ajoute au moins un exercice.';render();return;}}
    else{const m=num(d.min),di=num(d.dist);if(m>0)t.min=m;if(di>0)t.dist=di;if(d.type==='padel')t.fmt=d.fmt;if(!t.min&&!t.dist){ui.msg='Renseigne la durée ou la distance.';render();return;}}
    S.templates.push(t);ui.open.tn=false;ui.msg='';save();toast('Modèle ajouté');render();return;}
  if(a==='addw'){
    const d=ui.draft,t=d.type;let min=num(d.min);
    const w={id:uid(),date:d.date||td,type:t,rpe:num(d.rpe)||6};
    if(t==='muscu'){
      const exs=d.exs.map(x=>({name:x.name,group:x.group,sets:x.sets.map(y=>({kg:num(y.kg)||0,reps:num(y.reps)||0})).filter(y=>y.reps>0)})).filter(x=>x.sets.length);
      if(!exs.length){ui.msg='Ajoute au moins un exercice avec des répétitions.';render();return;}w.exs=exs;
      if(!(min>0))min=Math.round(sum(exs.map(x=>x.sets.length))*2.5+5);
    }else{
      if(!(min>0)){ui.msg='Indique la durée.';render();return;}
      if(t==='course'){const kk=num(d.dist);if(kk>0)w.dist=kk;}
      if(t==='padel')w.fmt=d.fmt;
      if(t==='bodyboard'){w.spot=d.spot;w.swell=d.swell;}
    }
    w.min=min;const prs=t==='muscu'?prCheck(w.exs):[];S.workouts.push(w);
    if(prs.length){const n=Math.min(prs.length,3)*3;G().pts+=n;G().life+=n;setTimeout(()=>{toast('Record · '+prs[0].name+' '+prs[0].kg+' kg × '+prs[0].reps+(prs.length>1?' (+'+(prs.length-1)+')':'')+' · +'+n+' ★');burst(innerWidth/2,innerHeight/3,34);},900);}
    evPlanned(w.date).filter(ev=>!ev.sport||ev.sport===t).forEach(ev=>{ev.done=ev.done||{};ev.done[w.date]=true;});
    ui.draft=null;ui.msg='';ui.sp='over';ui.open.tn=false;save();burst(e.clientX,e.clientY,26);toast('Séance enregistrée');render();scrollTop();return;}
  if(a==='delw'){S.workouts=S.workouts.filter(w=>w.id!==id);save();render();return;}
  if(a==='rcd'){ui.rc.d=String(id).replace('.',',');rcUpdate('d');return;}
  if(a==='rcclear'){ui.rc={d:'',t:'',p:'',v:'',order:[],neg:false};render();return;}
  if(a==='rcsave'){const f=rcFinal();if(!f)return;ui.tab='sport';ui.sp='add';ui.draft=newDraft();ui.draft.type='course';ui.draft.dist=Math.round(f.d*100)/100;ui.draft.min=Math.round(f.t*10)/10;render();scrollTop();return;}
});
const rcStr=(k,v)=>k==='d'?String(Math.round(v*100)/100).replace('.',','):k==='t'?fmtDur(v):fmtPace(v);
/* saisie sans « : » : les chiffres tapés sont mis en forme (500 → 5:00, 14530 → 1:45:30) */
function autoColon(v){
  v=String(v||'');
  if(/[.,]/.test(v))return v.replace(/[^0-9.,]/g,'');
  const d=v.replace(/\D/g,'').replace(/^0+(?=\d{3})/,'').slice(0,6);
  if(d.length<=2)return d;
  if(d.length<=4)return d.slice(0,-2)+':'+d.slice(-2);
  return d.slice(0,-4)+':'+d.slice(-4,-2)+':'+d.slice(-2);
}
function syncInit(){const t=sum(S.lines.map(l=>+l.amt||0));if(t>0)S.proj.init=Math.round(t);}
function rcUpdate(f){
  const r=ui.rc,key=f==='v'?'p':f;
  if(f==='v'){const v=num(r.v);r.p=v>0?fmtPace(60/v):'';}
  r.order=[key].concat(r.order.filter(x=>x!==key)).slice(0,2);
  const c=rcCompute();
  if(c.miss&&c.o[c.miss]!=null)r[c.miss]=rcStr(c.miss,c.o[c.miss]);
  const pm=parseDur(r.p);
  if(f!=='v')r.v=pm>0?String(Math.round(60/pm*100)/100).replace('.',','):'';
  ['d','t','p','v'].forEach(x=>{if(x!==f){const i=$('#rc-'+x);if(i&&i.value!==r[x])i.value=r[x];}});
  const o=$('#rcout');if(o)o.innerHTML=rcResult();
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.stepgoal){const v=Math.round(num(t.value));if(v>0){S.stepGoal=v;saveSoon();}return;}
  if(t.dataset.mx){const[k,f]=t.dataset.mx.split(':');S.maxes=S.maxes||{};const m=S.maxes[k]||(S.maxes[k]={});let v=t.value;if(f==='t'){v=autoColon(v);if(v!==t.value)t.value=v;}m[f]=v;m.date=todayK();saveSoon();clearTimeout(ui._mxt);ui._mxt=setTimeout(()=>mxRefresh(k),450);return;}
  if(t.dataset.rc){const f=t.dataset.rc;if(f==='t'||f==='p'){const nv=autoColon(t.value);if(nv!==t.value)t.value=nv;}ui.rc[f]=t.value;rcUpdate(f);return;}
  if(t.dataset.evy){S.proj.years=+t.value;const l=$('#evy-l');if(l)l.textContent=S.proj.years+' an'+(S.proj.years>1?'s':'');evUpdate(false);saveSoon();return;}
  if(t.dataset.evi){S.proj.init=Math.max(num(t.value)||0,0);evUpdate(false);saveSoon();return;}
  if(t.dataset.dca&&ui.tab==='money'&&ui.money==='evol'){S.dca=Math.max(num(t.value)||0,0);evUpdate(false);saveSoon();return;}
  if(t.dataset.ci){const f=t.dataset.ci;if(f==='freq')return;const v=num(t.value);if(isNaN(v))return;S.ci[f]=v;
    document.querySelectorAll('[data-ci="'+f+'"]').forEach(x=>{if(x!==t)x.value=v;});ciUpdate();saveSoon();return;}
  if(t.dataset.gl){const f=t.dataset.gl,v=num(t.value);if(isNaN(v))return;S.goalT[f]=v;
    document.querySelectorAll('[data-gl="'+f+'"]').forEach(x=>{if(x!==t)x.value=v;});goalUpdate();saveSoon();return;}
  if(t.dataset.ng&&ui.ng){ui.ng[t.dataset.ng]=t.value;return;}
  if(t.dataset.sim){S.sim[t.dataset.sim]=num(t.value)||0;save();simUpdate();return;}
  if(t.dataset.e&&ui.edraft){ui.edraft[t.dataset.e]=t.value;return;}
  if(t.dataset.d&&ui.draft){ui.draft[t.dataset.d]=t.value;if(t.dataset.d==='rpe')render();return;}
  if(t.dataset.s&&ui.draft){const[i,j,k]=t.dataset.s.split(':');ui.draft.exs[+i].sets[+j][k]=t.value;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.e&&ui.edraft){ui.edraft[t.dataset.e]=t.value;if(t.dataset.e==='kind')render();return;}
  if(t.dataset.d&&ui.draft){ui.draft[t.dataset.d]=t.value;if(t.dataset.d==='min'||t.dataset.d==='dist')render();return;}
  if(t.dataset.s&&ui.draft){render();return;}
  if(t.dataset.goal){S.goals[t.dataset.goal]=Math.max(num(t.value)||1,1);save();renderSheet();render();return;}
  if(t.dataset.wdate){ui.wd=t.value||null;render();return;}
  if(t.dataset.wt){const k=t.dataset.wd||ui.wd||todayK();const r=S.work.days[k]||(S.work.days[k]={});if(t.value)r[t.dataset.wt]=t.value;else delete r[t.dataset.wt];save();render();return;}
  if(t.dataset.wtarget){S.work.target=Math.max(num(t.value)||35,1);save();if(ui.sheet)renderSheet();render();return;}
  if(t.dataset.ci==='freq'){S.ci.freq=+t.value;ciUpdate();save();return;}
  if(t.dataset.dca){S.dca=Math.max(num(t.value)||0,0);save();render();return;}
  if(t.dataset.la){const l=S.lines.find(x=>x.id===t.dataset.la);if(l){l.amt=Math.max(num(t.value)||0,0);syncInit();saveSoon();clearTimeout(ui._lat);ui._lat=setTimeout(()=>{const a=document.activeElement,sel=a&&a.dataset&&a.dataset.la,pos=a&&a.selectionStart;render();if(sel){const n=document.querySelector('[data-la="'+sel+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(er){}}}},700);}return;}
  if(t.dataset.lp){const l=S.lines.find(x=>x.id===t.dataset.lp);if(l){l.pct=Math.max(num(t.value)||0,0);save();render();}return;}
  if(t.dataset.sc){const[sid,f]=t.dataset.sc.split(':'),s=S.scen.find(x=>x.id===sid);
    if(s){if(f==='name')s.name=t.value.trim()||s.name;else if(f==='tilt')s.tilt=+t.value;else if(f==='monthly')s.monthly=t.value===''?null:Math.max(num(t.value)||0,0);else s[f]=f==='years'?Math.min(Math.max(Math.round(num(t.value))||1,1),50):(num(t.value)||0);save();render();}return;}
  if(t.dataset.ret){S.ret[t.dataset.ret]=num(t.value)||0;save();render();return;}
  if(t.dataset.spr){S.spread[t.dataset.spr]=Math.max(num(t.value)||0,0);save();render();return;}
  if(t.dataset.pj){S.proj[t.dataset.pj]=num(t.value)||0;save();render();return;}
  if(t.dataset.fuel){ui.fuel[t.dataset.fuel]=Math.max(num(t.value)||0,0);render();return;}
});

/* ================= démarrage ================= */
render();
visInit();
(function boot(){
  setInterval(gLive,1000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  window.addEventListener('pagehide',save);
})();

/* ondulation au toucher */
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest&&e.target.closest('.btn,.chip,.toolrow,.tile,.mtile,.row[data-act],.claim,.buy,.iconbtn,.sitem');
  if(!t||t.disabled)return;
  const r=t.getBoundingClientRect(),d=Math.max(r.width,r.height)*2;
  if(getComputedStyle(t).position==='static')t.style.position='relative';
  t.classList.add('ripple-host');
  const s=document.createElement('span');s.className='rpl';
  s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  t.appendChild(s);setTimeout(()=>s.remove(),700);
},{passive:true});
})();

</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){let rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(rl)return;rl=true;location.reload();});addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{window.__swr=r;r.update();}).catch(()=>{}));document.addEventListener('visibilitychange',()=>{if(!document.hidden&&window.__swr)window.__swr.update();});}</script>
