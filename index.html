/* ---- Calcul de course ---- */
function rcFinal(){
  const r=ui.rc;const d=num(r.d),t=parseDur(r.t),p=parseDur(r.p);
  return (d>0&&t>0&&p>0)?{d,t,p}:null;
}
function rcResult(){
  const f=rcFinal();if(!f)return '';
  const {d,t,p}=f,neg=!!ui.rc.neg;
  const p1=neg?p*1.02:p,p2=neg?p*0.98:p,half=d/2;
  const at=k=>neg?(k<=half?k*p1:half*p1+(k-half)*p2):k*p;
  const step=d<=12?1:d<=25?2:5;
  const pts=[];for(let k=step;k<d-0.001;k+=step)pts.push(k);pts.push(d);
  const rows=[[5,'5 km'],[10,'10 km'],[21.0975,'Semi'],[42.195,'Marathon']];
  const riegel=k=>t*Math.pow(k/d,1.06);
  const p10=riegel(10)/10,p5=riegel(5)/5,pm=riegel(42.195)/42.195;
  const zones=[['Récupération',p10*1.28,p10*1.45,'#34C759'],['Endurance',p10*1.14,p10*1.28,'#32ADE6'],['Marathon',pm*0.99,pm*1.02,'#0A84FF'],['Seuil',p10*1.0,p10*1.06,'#FF9500'],['Intervalles',p5*0.93,p5*0.99,'#FF2D55']];
  return `<div class="hero2"><div class="sm">Ton allure</div><div class="big">${fmtPace(p)} <span style="font-size:18px;font-weight:700">/km</span></div><div class="sm">${fmtN(60/p,2)} km/h · ${fmtDur(t)} pour ${fmtN(d,2)} km</div>
    <div class="mini3"><div><small>Au mile</small><b>${fmtPace(p*1.609344)}</b></div><div><small>400 m</small><b>${fmtDur(p*0.4)}</b></div><div><small>Calories</small><b>${fmtN(10*weight()*(t/60)*0.98)}</b></div></div></div>
  <div class="sublabel">Temps de passage <button class="chip ${neg?'on':''}" style="margin-left:8px;padding:5px 10px;font-size:12px" data-act="rcneg">Départ prudent</button></div>
  <div class="row-list">${pts.map((k,i)=>{const pk=i?pts[i-1]:0,sp=(at(k)-at(pk))/(k-pk);return `<div class="row"><span class="row-title">${k===d?fmtN(d,2).replace(',00','')+' km (arrivée)':fmtN(k,0)+' km'}</span><span class="row-sub" style="margin:0">${fmtPace(sp)}/km</span><span class="row-value">${fmtDur(at(k))}</span></div>`;}).join('')}</div>
  ${neg?'<p class="note">Départ à +2 % plus lent, seconde moitié 2 % plus vite : même temps final.</p>':''}
  <div class="section-head"><h2 class="section-title">Au même rythme</h2></div>
  <div class="row-list">${rows.map(([k,l])=>`<div class="row"><span class="row-title">${l}</span><span class="row-value">${fmtDur(p*k)}</span></div>`).join('')}</div>
  <div class="sublabel">Prédiction depuis cette performance (Riegel)</div><div class="row-list">${rows.map(([k,l])=>`<div class="row"><span class="row-title">${l}</span><span class="row-value">${fmtDur(riegel(k))}</span></div>`).join('')}</div>
  <div class="section-head"><h2 class="section-title">Allures d'entraînement</h2></div>
  <div class="row-list">${zones.map(([n,a,b,c])=>`<div class="row"><span class="row-title"><span class="dot" style="background:${c};margin-right:8px"></span>${n}</span><span class="row-value">${fmtPace(Math.min(a,b))} à ${fmtPace(Math.max(a,b))}</span></div>`).join('')}</div>
  <p class="note">Estimations à partir de ton allure équivalente sur 10 km, à ajuster avec tes sensations et ta fréquence cardiaque. Pas un avis médical.</p>
  <button class="btn btn-primary" style="width:100%;margin-top:12px" data-act="rcsave">Enregistrer cette course</button>`;
}

  const last=L[L.length-1],first=L[0];
  const before=k=>{let r=null;L.forEach(x=>{if(x.d<=k)r=x;});return r;};
  const p30=before(addD(td,-30)),d30=p30?last.kg-p30.kg:null,dAll=last.kg-first.kg;

  const h=S.profile&&S.profile.height?S.profile.height/100:0,imc=h?last.kg/(h*h):0;
  const sg=v=>(v>0?'+':v<0?'−':'')+fmtN(Math.abs(v),1)+' kg';

    ${form}</div>

function scrubInit(){

    let d=svg._sd;if(!d){try{d=svg._sd=JSON.parse(svg.getAttribute('data-scrub'));}catch(er){return;}}

  document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pressure>0)show(e);},{passive:true});
  document.addEventListener('pointerup',hide,{passive:true});document.addEventListener('pointercancel',hide,{passive:true});
}

const PADEL_N=151126; /* hommes licenciés compétiteurs, classement FFT de septembre 2026 */
function padelCard(){
  const p=S.padel||{},r=+p.rank||0,n=PADEL_N;
  let out='';
  if(r>0){const q=1-r/n,tier=r<=100?'Élite nationale':r<=1000?'Très haut niveau':q>=.95?'Excellent':q>=.8?'Confirmé':q>=.5?'Intermédiaire':'Loisir';
    out=`${mxBar(Math.min(Math.max(q,.001),.999))}<div class="mxres"><b>${topTxt(q)}</b><span class="mxtier">${tier}</span></div><p class="note" style="margin:6px 0 0">Mieux classé que ${fmtN(Math.max(n-r,0))} des ${fmtN(n)} compétiteurs hommes.</p>`;}
  return `<div class="section-head"><h2 class="section-title">Classement padel</h2><span class="section-sub">FFT</span></div>
  <div class="card mxrow"><div class="mxin" style="margin-top:0"><input class="mxt" style="width:120px" data-padel="rank" inputmode="numeric" placeholder="Rang" value="${esc(p.rank||'')}"><span class="mxu">e</span><input style="width:100px" data-padel="pts" inputmode="numeric" placeholder="Points" value="${esc(p.pts||'')}"><span class="mxu">pts</span></div>${out}</div>`;
}
function vo2From(){
  const C=[['run5',5000],['run10',10000],['run21',21097],['run42',42195]],cands=[];
  C.forEach(([k,d])=>{const m=(S.maxes||{})[k],t=m&&parseDur(m.t);if(t>0){const v=d/t,vo2=-4.6+.182258*v+.000104*v*v,pm=.8+.1894393*Math.exp(-.012778*t)+.2989558*Math.exp(-.1932605*t);cands.push(vo2/pm);}});
  return cands.length?Math.max(...cands):null;
}
function cardioAge(vo2){
  const A=[[25,43.5],[35,42.2],[45,40.4],[55,37.4],[65,33.9],[75,30.8]];
  if(vo2>=A[0][1])return Math.max(18,25-(vo2-A[0][1])/.35);
  for(let i=0;i<A.length-1;i++){const[a1,v1]=A[i],[a2,v2]=A[i+1];if(vo2<=v1&&vo2>=v2)return a1+(v1-vo2)/(v1-v2)*(a2-a1);}
  return Math.min(85,75+(A[5][1]-vo2)/.3);
}
function mxProfile(){
  const pans=mxPanels(),gym=pans.find(x=>x.k==='gym'),ageP=pans[0],done=MXL.filter(e=>mxVal(e)!=null);
  const pg=k=>{const e=MXL.find(x=>x.k===k);return e&&mxVal(e)!=null?mxPct(e,gym):null;};
  const str=['bench','squat','dead','ohp','row','pull','push'].map(pg).filter(x=>x!=null),end=['run400','run5','run10','run21','run42'].map(pg).filter(x=>x!=null);
  const sAge=['bench','squat','dead','ohp','row','pull','push'].map(k=>{const e=MXL.find(x=>x.k===k);return e&&mxVal(e)!=null?mxPct(e,ageP):null;}).filter(x=>x!=null);
  return {done,str:str.length?avg(str):null,end:end.length?avg(end):null,sAge:sAge.length?avg(sAge):null,pg};
}
function mxAnalysis(){
  const P=mxProfile(),p=S.profile||{},age=+p.age||30,bw=curWeight()||+p.weight||0,h=+p.height||0,ins=[];
  if(!P.done.length)return '';
  const ranked=P.done.map(e=>({e,q:mxPct(e,mxPanels().find(x=>x.k==='gym'))})).filter(x=>x.q!=null).sort((a,b)=>b.q-a.q);
  if(ranked.length>=2){{const qa=mxPct(ranked[0].e,mxPanels()[0]);ins.push(['star','Point fort : <b>'+esc(ranked[0].e.n)+'</b> ('+topTxt(ranked[0].q).toLowerCase()+' des pratiquants'+(qa!=null?', '+topTxt(qa).toLowerCase()+' des hommes de ton âge':'')+').']);}const w=ranked[ranked.length-1];if(w.q<ranked[0].q-.15){const qa=mxPct(w.e,mxPanels()[0]);ins.push(['target','Ton max le moins avancé, en comparaison : <b>'+esc(w.e.n)+'</b> ('+Math.round(w.q*100)+' % des pratiquants battus'+(qa!=null?', mais '+Math.round(qa*100)+' % des hommes de ton âge':'')+'). C\'est là que tu progresseras le plus vite.']);}}
  const v=k=>{const e=MXL.find(x=>x.k===k);return e?mxVal(e):null;};
  const sq=v('squat'),be=v('bench'),de=v('dead'),oh=v('ohp'),pu=v('pull');
  if(sq&&be){const r=sq/be;ins.push(['scale',r<1.15?'Le bas du corps est en retard sur le haut : squat = '+fmtN(r,2)+' × couché (repère 1,25 à 1,5).':r>1.6?'Jambes dominantes : squat = '+fmtN(r,2)+' × couché, le haut du corps peut progresser.':'Bon équilibre haut / bas du corps (squat = '+fmtN(r,2)+' × couché).']);}
  if(de&&sq){const r=de/sq;if(r<1.05)ins.push(['scale','Soulevé de terre un peu faible face au squat ('+fmtN(r,2)+' ×, repère 1,1 à 1,3) : chaîne postérieure à renforcer.']);}
  if(oh&&be){const r=oh/be;if(r<.55)ins.push(['scale','Épaules en retrait : militaire = '+fmtN(r,2)+' × couché (repère 0,6 à 0,7).']);}
  if(be&&bw&&pu!=null){if(be/bw>=1&&pu<8)ins.push(['dumb','Tu pousses fort mais tires peu : '+pu+' tractions pour un couché à '+fmtN(be/bw,2)+' × ton poids. Ajoute du travail de dos.']);}
  if(P.str!=null&&P.end!=null){const d=P.str-P.end;ins.push(['bolt',Math.abs(d)<.12?'Profil <b>hybride équilibré</b> : force et endurance au même niveau.':d>0?'Profil <b>plutôt force</b> : l\'endurance est ton levier de progression.':'Profil <b>plutôt endurance</b> : la force est ton levier de progression.']);}
  /* âge physiologique : rang moyen face aux hommes de ton âge, sur les seuls max renseignés */
  const vo2=vo2From(),ageP=mxPanels()[0];
  const filled=MXL.map(e=>({e,q:mxVal(e)!=null?mxPct(e,ageP):null})).filter(x=>x.q!=null);
  const grp=(ks)=>{const L=filled.filter(x=>ks.includes(x.e.k));return L.length?avg(L.map(x=>x.q)):null;};
  const qC=grp(['run400','run5','run10','run21','run42']),qF=grp(['bench','squat','dead','ohp','row','pull','push']);
  const toAge=q=>Math.min(80,Math.max(18,age-(q-.5)*20));
  const parts=[];
  if(qC!=null)parts.push({n:'Cardio',a:toAge(qC),s:topTxt(qC)+' de ton âge'+(vo2?' · VO2 ≈ '+fmtN(vo2,0):'')});
  if(qF!=null)parts.push({n:'Force',a:toAge(qF),s:topTxt(qF)+' de ton âge'});
  const used=filled.map(x=>x.e.n);
  const pa=filled.length?Math.round(toAge(avg(filled.map(x=>x.q)))):null;
  /* athlète hybride */
  const LV=[['Intermédiaire',{squat:1.25,bench:1,dead:1.5,pull:8,run5:25,run10:52}],['Avancé',{squat:1.5,bench:1.25,dead:2,pull:12,run5:22,run10:46}],['Élite',{squat:2,bench:1.5,dead:2.5,pull:20,run5:19,run10:40}]];
  const ok=(k,t)=>{const x=v(k);if(x==null)return null;if(k==='run5'||k==='run10')return x<=t;if(k==='pull')return x>=t;return bw?x/bw>=t:null;};
  let lvl='Débutant',next=null;for(const [n,T] of LV){const res=Object.entries(T).map(([k,t])=>ok(k,t));if(res.every(r=>r===true))lvl=n;else{next=[n,T];break;}}
  const hs=P.str!=null&&P.end!=null?Math.round(Math.sqrt(P.str*P.end)*100):null;
  const lab={squat:'Squat',bench:'Couché',dead:'Terre',pull:'Tractions',run5:'5 km',run10:'10 km'};
  const tgt=next?Object.entries(next[1]).map(([k,t])=>{const r=ok(k,t);return `<span class="hy ${r===true?'ok':r===false?'no':'na'}">${lab[k]} ${k==='pull'?t:k.startsWith('run')?t+':00':fmtN(t,2)+'×'}</span>`;}).join(''):'';
  return `<div class="section-head"><h2 class="section-title">Mon analyse</h2></div>
  <div class="grid2 anag">
    <div class="card anak"><small>Âge physiologique</small><b>${pa!=null?pa+' <span>ans</span>':'—'}</b><em>${pa!=null?(pa<age?(age-pa)+' ans de moins que ton âge':pa>age?(pa-age)+' ans de plus que ton âge':'égal à ton âge'):'Renseigne au moins un max'}</em></div>
    <div class="card anak"><small>Athlète hybride</small><b>${hs!=null?hs+' <span>/100</span>':'—'}</b><em>${hs!=null?'Niveau '+esc(lvl):'Renseigne un max de force et un temps de course'}</em></div></div>
  ${parts.length?`<div class="card" style="margin-top:10px"><div class="anaparts" style="grid-template-columns:repeat(${parts.length},1fr)">${parts.map(x=>`<div><small>${x.n}</small><b>${Math.round(x.a)} ans</b><em>${esc(x.s)}</em></div>`).join('')}</div><p class="note" style="margin:10px 0 0">Calculé uniquement sur : ${esc(used.join(', '))}.</p></div>`:''}
  ${next?`<div class="card" style="margin-top:10px"><div class="sublabel" style="margin:0 0 8px">Pour passer ${esc(next[0])} (athlète hybride)</div><div class="hys">${tgt}</div><p class="note" style="margin:8px 0 0">Force rapportée à ton poids, tractions d'affilée, temps de course. Vert : atteint.</p></div>`:''}
  <div class="card anal" style="margin-top:10px">${ins.map(([i,t])=>`<div class="ani"><span class="qico">${IC(i,16)}</span><p>${t}</p></div>`).join('')}</div>
  <p class="note">Âge physiologique : ton rang moyen face aux hommes de ton âge (sportifs ou non), sur les seuls max renseignés ; un rang médian donne ton âge réel, chaque tranche de 10 % au-dessus retire 2 ans. Aucun calcul sur tes pas, ton poids ou ta régularité. Indicatif, pas un avis médical.</p>`;
}

const icsD=(k,t)=>k.replace(/-/g,'')+'T'+t.replace(':','')+'00';
const icsEsc=s=>String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
function icsWrap(evs){return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rythme//FR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Rythme'].concat(evs,['END:VCALENDAR']).join('\r\n');}
function icsPointage(){
  let k=todayK();while(new Date(k+'T12:00').getDay()!==1)k=addD(k,1);
  const offs=[];for(let i=0;i<400;i++){const d=addD(todayK(),i);if(evOn(d).some(e=>e.kind==='Congé'))offs.push(d);}
  const st=Date.now();
  return icsWrap([['in','07:00','Pointer ton arrivée'],['lo','12:00','Pointer ta pause déjeuner'],['li','13:00','Pointer ton retour'],['out','17:00','Pointer ton départ']].map(([id,t,txt])=>{
    const e=t.split(':'),end=pad(+e[0])+':'+pad(+e[1]+5);
    return ['BEGIN:VEVENT','UID:rythme-'+id+'@rythme','DTSTAMP:'+icsD(todayK(),'00:00')+'Z','DTSTART:'+icsD(k,t),'DTEND:'+icsD(k,end),'RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',
      ...(offs.length?['EXDATE:'+offs.map(d=>icsD(d,t)).join(',')]:[]),'SUMMARY:'+icsEsc(txt),'DESCRIPTION:Ouvre Rythme pour pointer.','TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(txt),'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n');}));
}
function icsPlanning(){
  const td=todayK(),evs=S.events.filter(e=>(e.end||e.date)>=td&&e.kind!=='Congé');
  return icsWrap(evs.map(e=>{const allDay=!e.time||e.end;const L=['BEGIN:VEVENT','UID:rythme-'+e.id+'@rythme','DTSTAMP:'+icsD(td,'00:00')+'Z'];
    if(allDay){L.push('DTSTART;VALUE=DATE:'+e.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+addD(e.end||e.date,1).replace(/-/g,''));}
    else{const[h,m]=e.time.split(':').map(Number),t2=h*60+m+(+e.dur||60);L.push('DTSTART:'+icsD(e.date,e.time),'DTEND:'+icsD(e.date,pad(Math.floor(t2/60)%24)+':'+pad(t2%60)));}
    if(e.rep==='w')L.push('RRULE:FREQ=WEEKLY');else if(e.rep==='y')L.push('RRULE:FREQ=YEARLY');
    L.push('SUMMARY:'+icsEsc(e.title||e.kind),'CATEGORIES:'+icsEsc(e.kind));
    if(!allDay)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(e.title||e.kind),'TRIGGER:-PT30M','END:VALARM');
    L.push('END:VEVENT');return L.join('\r\n');}));
}

let lastKey='',_en=null;
function animateCounts(){
  const els=document.querySelectorAll('#main .cu');if(!els.length)return;
  const t0=performance.now(),D=650;
  const step=now=>{const k=Math.min((now-t0)/D,1),e=1-Math.pow(1-k,5);
    els.forEach(el=>{const v=+el.dataset.v,f=CUF[el.dataset.f];if(f)el.textContent=f(v*e);});
    if(k<1)requestAnimationFrame(step);else els.forEach(el=>{const f=CUF[el.dataset.f];if(f)el.textContent=f(+el.dataset.v);});};
  requestAnimationFrame(step);
}
function revealBelow(main){return;
  if(!('IntersectionObserver' in window))return;
  const vh=innerHeight,els=[...main.children].filter(el=>el.getBoundingClientRect().top>vh*0.92);
  if(!els.length)return;
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('rvin');io.unobserve(en.target);}}),{threshold:.08,rootMargin:'0px 0px -6% 0px'});
  els.forEach(el=>{el.classList.add('rv');io.observe(el);});
  setTimeout(()=>{els.forEach(el=>el.classList.add('rvin'));io.disconnect();},4000);
}

    S.wlog=S.wlog||[];const ex=S.wlog.find(x=>x.d===d);if(ex)ex.kg=kg;else S.wlog.push({d,kg});S.wlog.sort((a,b)=>a.d<b.d?-1:1);
    if(S.profile)S.profile.weight=S.wlog[S.wlog.length-1].kg;save();toast('Poids noté : '+fmtN(kg,1)+' kg');render();return;}
  if(a==='wdel'){S.wlog=(S.wlog||[]).filter(x=>x.d!==id);save();render();return;}
  if(a==='pedit'){ui.pedit=!ui.pedit;ui.pe=null;ui.ped=null;render();return;}
  if(a==='pe'){ui.pe=id;ui.ped=null;render();scrollTop();return;}
  if(a==='pecancel'){ui.pe=null;ui.ped=null;render();return;}
  if(a==='pegrp'){const p=ui.ped;if(!p)return;p.groups=p.groups||[];p.groups=p.groups.includes(id)?p.groups.filter(x=>x!==id):p.groups.concat([id]);render();return;}
  if(a==='pesave'){const p=ui.ped;if(!p)return;if(!String(p.n||'').trim()){toast('Donne un nom au programme');return;}p.min=Math.max(Math.round(num(p.min))||30,5);
    const PR=myProgs(),i=PR.findIndex(x=>x.k===p.k);if(i>=0)PR[i]=p;else PR.push(p);ui.pe=null;ui.ped=null;save();toast('Programme enregistré');render();return;}
  if(a==='pedel'){S.progs=myProgs().filter(x=>x.k!==ui.pe);ui.pe=null;ui.ped=null;save();render();return;}
  if(a==='totop'){window.scrollTo({top:0,behavior:'smooth'});return;}
  if(a==='rest'){restStart(+id);return;}
  if(a==='restx'){ui.rest=null;restTick();return;}
  if(a==='dcastep'){S.dca=Math.max((S.dca||0)+(+id),0);save();render();return;}
  if(a==='tl'){ui.tl=id||'';ui._dir=id?1:-1;render();scrollTop();return;}

  /* pointage */
  if(a==='punchpop'){closeConfirm();const rec=S.work.days[td]||(S.work.days[td]={}),ns=nextStep(rec);if(!ns)return;rec[ns[0]]=hhmm();save();toast(ns[1]+' à '+rec[ns[0]]);burst(innerWidth/2,innerHeight/2,14);render();return;}
  if(a==='punch'){const rec=S.work.days[td]||(S.work.days[td]={}),ns=nextStep(rec);if(!ns)return;rec[ns[0]]=hhmm();save();toast(ns[1]+' à '+rec[ns[0]]);burst(e.clientX,e.clientY,ns[0]==='out'?30:14);render();return;}
  if(a==='nolunch'){const rec=S.work.days[td];if(!rec)return;const t=hhmm();rec.lo=t;rec.li=t;save();render();return;}
  if(a==='wsel'){ui.wd=id;render();return;}
  if(a==='wfull'){const k=id||ui.wd||td;S.work.days[k]=fullDay();save();toast('Journée complète enregistrée · '+(k===td?'aujourd\'hui':dShort(k)));render();return;}
  if(a==='wclear'){delete S.work.days[ui.wd||td];save();render();return;}

  if(a==='ciport'){const bl=blended();S.ci.init=S.proj.init||0;S.ci.monthly=S.dca||0;S.ci.rate=Math.round(bl.r*10)/10;S.ci.years=S.proj.years||20;save();render();return;}
  if(a==='rcneg'){ui.rc.neg=!ui.rc.neg;const o=$('#rcout');if(o)o.innerHTML=rcResult();return;}
  /* argent */
  if(a==='addline'){const n=val('l-n').trim(),w=num(val('l-w')),r=num(val('l-r'));if(!n||!(w>0))return;S.lines.push({id:uid(),name:n,cls:val('l-c'),pct:0,amt:w,r:isNaN(r)?null:r});syncInit();ui.open.fl=false;save();render();return;}
  if(a==='dell'){S.lines=S.lines.filter(x=>x.id!==id);syncInit();save();render();return;}
  if(a==='norm'){const t=pctTot();if(t>0){S.lines.forEach(l=>{l.pct=Math.round((l.pct||0)/t*1000)/10;});save();render();}return;}
  if(a==='addsc'){const l=S.scen[S.scen.length-1];S.scen.push(Object.assign({},l,{id:uid(),name:'Scénario '+(S.scen.length+1)}));save();render();return;}
  if(a==='delsc'){if(S.scen.length>1){S.scen=S.scen.filter(x=>x.id!==id);save();render();}return;}
  if(a==='scmode'){const[sid,mode]=id.split(':');const s=S.scen.find(x=>x.id===sid);if(s){s.mode=mode;save();render();}return;}
  if(a==='addinc'){const m=val('i-m'),v=num(val('i-a')),s=val('i-s');if(!m||isNaN(v))return;
    const ex=S.incomes.find(i=>i.m===m&&i.source===s);if(ex)ex.amount=v;else S.incomes.push({id:uid(),m,amount:v,source:s});save();render();return;}
  if(a==='delinc'){S.incomes=S.incomes.filter(i=>i.id!==id);save();render();return;}
  if(a==='addsrc'){const n=val('src-n').trim();if(!n||S.sources.includes(n))return;S.sources.push(n);save();render();return;}
  if(a==='addpay'){
    const fs=$('#p-f')?[...$('#p-f').files]:[],mDef=val('p-m'),s=val('p-s');
    if(!fs.length){ui.msg='Choisis un ou plusieurs fichiers PDF.';render();return;}
    ui.msg='Lecture de '+fs.length+' fiche'+(fs.length>1?'s':'')+'…';render();
    (async()=>{let ok=0,read=0,fail=0;
      for(const f of fs){const pid=uid();
        try{await idb.put(pid,f);}catch(er){fail++;continue;}
        const p={id:pid,m:mDef,source:s,net:0,name:f.name,size:f.size,tried:1};
        const d=await readPay(f);if(d&&(d.net||d.brut)){read++;}
        const dup=d&&d.m&&S.pays.find(x=>x.m===d.m&&x.source===s&&x.d&&x.d.net===d.net);
        if(dup){idb.del(pid).catch(()=>{});continue;}
        S.pays.push(p);if(d&&(d.net||d.brut))applyPay(p,d);ok++;}
      ui.msg=ok?(ok+' fiche'+(ok>1?'s':'')+' ajoutée'+(ok>1?'s':'')+(read<ok?', dont '+(ok-read)+' sans lecture automatique (renseigne le net à la main)':'')+'.'):(fail?'Le stockage de fichiers n\'est pas disponible dans ce navigateur.':'Ces fiches sont déjà enregistrées.');
      save();render();if(read)toast(read+' fiche'+(read>1?'s':'')+' lue'+(read>1?'s':''));})();return;}
  if(a==='rereadpays'){S.pays.forEach(p=>{delete p.tried;});scanPays();return;}
  if(a==='openpay'){const p=S.pays.find(x=>x.id===id);if(!p)return;
    idb.get(id).then(b=>{if(!b)throw new Error('x');return showPdf(b,p);}).catch(()=>{ui.msg='Impossible d\'ouvrir ce fichier ici.';render();});return;}
  if(a==='closepdf'){const o=$('#pdfv');if(o)o.remove();document.body.style.overflow=ui.sheet?'hidden':'';return;}
  if(a==='getpay'){const p=S.pays.find(x=>x.id===id);if(!p)return;
    idb.get(id).then(b=>{if(!b)throw new Error('x');return saveFile(p.name.toLowerCase().endsWith('.pdf')?p.name:p.name+'.pdf',b);}).then(()=>{ui.msg='Fiche enregistrée.';render();}).catch(er=>{ui.msg=er&&er.code==='declined'?'Enregistrement annulé.':'Impossible d\'enregistrer ce fichier ici.';render();});return;}
  if(a==='delpay'){idb.del(id).catch(()=>{});S.pays=S.pays.filter(x=>x.id!==id);save();render();return;}
  if(a==='savesim'){const p=S.sim,m=mortgage(p);S.sims.push({id:uid(),name:`${fmt(p.prix)} · ${p.taux} % · ${p.duree} ans`,mens:m.mens});save();render();return;}
  if(a==='delsim'){S.sims=S.sims.filter(x=>x.id!==id);save();render();return;}

  /* planning */
  if(a==='plsel'){e.preventDefault();ui.sel=id;ui.open.fe=false;ui.edraft=null;if(el.dataset.jump)ui.pm=monthOff(id);render();return;}
  if(a==='plm'){ui.pm=id==='0'?0:ui.pm+Number(id);render();return;}
  if(a==='newev'){ui.open.fe=true;ui.edraft=newEv();render();return;}
  if(a==='adde'){
    const d=ui.edraft;if(!d||!d.title.trim()||!d.date)return;
    const ev={id:uid(),title:d.title.trim(),kind:d.kind,date:d.date,time:d.time||'',dur:num(d.dur)||0,rep:d.rep||''};
    if(d.end&&d.end>d.date)ev.end=d.end;if(d.kind==='Sport')ev.sport=d.sport;
    S.events.push(ev);ui.sel=d.date;ui.pm=monthOff(d.date);ui.open.fe=false;ui.edraft=null;save();render();return;}
  if(a==='dele'){S.events=S.events.filter(x=>x.id!==id);save();render();return;}
  if(a==='evdone'){const ev=S.events.find(x=>x.id===id);if(!ev)return;
    ui.tab='sport';ui.sp='add';ui.draft=newDraft();ui.draft.type=ev.sport||'course';ui.draft.date=k||td;if(ev.dur)ui.draft.min=ev.dur;render();scrollTop();return;}

  /* nutrition */
  if(a==='saveprofile'){
    const age=num(val('p-a')),h=num(val('p-h')),w=num(val('p-w'));
    if(isNaN(age)||isNaN(h)||isNaN(w)||age<14||h<100||w<30)return;
    S.profile={sex:val('p-s'),age,height:h,weight:w,base:num(val('p-b')),goal:val('p-g')};
    S.wlog=S.wlog||[];const last=S.wlog[S.wlog.length-1];
    if(last&&last.d===td)last.kg=w;else if(!last||last.kg!==w)S.wlog.push({d:td,kg:w});
    ui.open.pf=false;save();render();return;}

  /* saisie */
  if(a==='dtype'){ui.draft.type=id;render();return;}
  if(a==='tpl'){applyTpl(id);render();return;}
  if(a==='deltpl'){S.templates=S.templates.filter(x=>x.id!==id);save();render();return;}
  if(a==='addex'){
    const name=val('ex-n').trim();if(!name)return;
    const lib=exLib();let group=lib[name];
    if(!group){group=val('ex-g');S.customEx.push({name,group});save();}
    const prev=lastSets(name);
    ui.draft.exs.push({name,group,prev,sets:prev?prev.map(t=>({kg:t.kg,reps:t.reps})):[{kg:'',reps:''}]});render();return;}
  if(a==='delex'){ui.draft.exs.splice(+id,1);render();return;}
  if(a==='addset'){const ex=ui.draft.exs[+id],l=ex.sets[ex.sets.length-1]||{kg:'',reps:''};ex.sets.push({kg:l.kg,reps:l.reps});render();return;}
  if(a==='delset'){const[i,j]=id.split(':').map(Number);const ex=ui.draft.exs[i];ex.sets.splice(j,1);if(!ex.sets.length)ui.draft.exs.splice(i,1);render();return;}
  if(a==='savetpl'){
    const n=val('tpl-n').trim(),d=ui.draft;if(!n){ui.msg='Donne un nom au modèle.';render();return;}
    const t={id:uid(),name:n,type:d.type};
    if(d.type==='muscu'){t.exs=d.exs.filter(x=>x.name).map(x=>[x.name,x.sets.length||3,num(x.sets[0]&&x.sets[0].reps)||10]);if(!t.exs.length){ui.msg='Ajoute au moins un exercice.';render();return;}}
    else{const m=num(d.min),di=num(d.dist);if(m>0)t.min=m;if(di>0)t.dist=di;if(d.type==='padel')t.fmt=d.fmt;if(!t.min&&!t.dist){ui.msg='Renseigne la durée ou la distance.';render();return;}}
    S.templates.push(t);ui.open.tn=false;ui.msg='';save();toast('Modèle ajouté');render();return;}
  if(a==='addw'){
    const d=ui.draft,t=d.type;let min=num(d.min);
    const w={id:uid(),date:d.date||td,type:t,rpe:num(d.rpe)||6};
    if(t==='muscu'){
      const exs=d.exs.map(x=>({name:x.name,group:x.group,sets:x.sets.map(y=>({kg:num(y.kg)||0,reps:num(y.reps)||0})).filter(y=>y.reps>0)})).filter(x=>x.sets.length);
      if(!exs.length){ui.msg='Ajoute au moins un exercice avec des répétitions.';render();return;}w.exs=exs;
      if(!(min>0))min=Math.round(sum(exs.map(x=>x.sets.length))*2.5+5);
    }else{
      if(!(min>0)){ui.msg='Indique la durée.';render();return;}
      if(t==='course'){const kk=num(d.dist);if(kk>0)w.dist=kk;}
      if(t==='padel')w.fmt=d.fmt;
      if(t==='bodyboard'){w.spot=d.spot;w.swell=d.swell;}
    }
    w.min=min;const prs=t==='muscu'?prCheck(w.exs):[];S.workouts.push(w);
    if(prs.length){setTimeout(()=>{toast('Record · '+prs[0].name+' '+prs[0].kg+' kg × '+prs[0].reps+(prs.length>1?' (+'+(prs.length-1)+')':''));},900);}
    evPlanned(w.date).filter(ev=>!ev.sport||ev.sport===t).forEach(ev=>{ev.done=ev.done||{};ev.done[w.date]=true;});
    ui.draft=null;ui.msg='';ui.sp='over';ui.open.tn=false;save();burst(e.clientX,e.clientY,26);toast('Séance enregistrée');render();scrollTop();return;}
  if(a==='delw'){S.workouts=S.workouts.filter(w=>w.id!==id);save();render();return;}
  if(a==='rcd'){ui.rc.d=String(id).replace('.',',');rcUpdate('d');return;}
  if(a==='rcclear'){ui.rc={d:'',t:'',p:'',v:'',order:[],neg:false};render();return;}
  if(a==='rcsave'){const f=rcFinal();if(!f)return;ui.tab='sport';ui.tl='';ui.sp='add';ui.qd={p:'race',date:todayK(),dist:String(Math.round(f.d*100)/100),min:String(Math.round(f.t))};render();scrollTop();return;}
});
const rcStr=(k,v)=>k==='d'?String(Math.round(v*100)/100).replace('.',','):k==='t'?fmtDur(v):fmtPace(v);
/* saisie sans « : » : les chiffres tapés sont mis en forme (500 → 5:00, 14530 → 1:45:30) */
function autoColon(v){
  v=String(v||'');
  if(/[.,]/.test(v))return v.replace(/[^0-9.,]/g,'');
  const d=v.replace(/\D/g,'').replace(/^0+(?=\d{3})/,'').slice(0,6);
  if(d.length<=2)return d;
  if(d.length<=4)return d.slice(0,-2)+':'+d.slice(-2);
  return d.slice(0,-4)+':'+d.slice(-4,-2)+':'+d.slice(-2);
}
function syncInit(){const t=sum(S.lines.map(l=>+l.amt||0));if(t>0)S.proj.init=Math.round(t);}
function rcUpdate(f){
  const r=ui.rc,key=f==='v'?'p':f;
  if(f==='v'){const v=num(r.v);r.p=v>0?fmtPace(60/v):'';}
  r.order=[key].concat(r.order.filter(x=>x!==key)).slice(0,2);
  const c=rcCompute();
  if(c.miss&&c.o[c.miss]!=null)r[c.miss]=rcStr(c.miss,c.o[c.miss]);
  const pm=parseDur(r.p);
  if(f!=='v')r.v=pm>0?String(Math.round(60/pm*100)/100).replace('.',','):'';
  ['d','t','p','v'].forEach(x=>{if(x!==f){const i=$('#rc-'+x);if(i&&i.value!==r[x])i.value=r[x];}});
  const o=$('#rcout');if(o)o.innerHTML=rcResult();
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.stepsync){S.stepsSync=t.value.trim();saveSoon();return;}
  if(t.dataset.pe&&ui.ped){ui.ped[t.dataset.pe]=t.value;if(t.dataset.pe==='t')render();return;}
  if(t.dataset.q&&ui.qd){ui.qd[t.dataset.q]=t.value;return;}
  if(t.dataset.steppct){const v=Math.round(num(t.value));if(v>=0&&v<=100){S.stepPct=v;saveSoon();}return;}
  if(t.dataset.stepgoal){const v=Math.round(num(t.value));if(v>0){S.stepGoal=v;saveSoon();}return;}
  if(t.dataset.padel){S.padel=S.padel||{};S.padel[t.dataset.padel]=t.value.replace(/\D/g,'');S.padel.date=todayK();saveSoon();clearTimeout(ui._pdt);ui._pdt=setTimeout(()=>{const a=document.activeElement,sel=a&&a.dataset&&a.dataset.padel;render();if(sel){const n=document.querySelector('[data-padel="'+sel+'"]');if(n){n.focus();}}},700);return;}
  if(t.dataset.mx){const[k,f]=t.dataset.mx.split(':');S.maxes=S.maxes||{};const m=S.maxes[k]||(S.maxes[k]={});let v=t.value;if(f==='t'){v=autoColon(v);if(v!==t.value)t.value=v;}m[f]=v;m.date=todayK();saveSoon();clearTimeout(ui._mxt);ui._mxt=setTimeout(()=>mxRefresh(k),450);return;}
  if(t.dataset.rc){const f=t.dataset.rc;if(f==='t'||f==='p'){const nv=autoColon(t.value);if(nv!==t.value)t.value=nv;}ui.rc[f]=t.value;rcUpdate(f);return;}
  if(t.dataset.evy){S.proj.years=+t.value;const l=$('#evy-l');if(l)l.textContent=S.proj.years+' an'+(S.proj.years>1?'s':'');evUpdate(false);saveSoon();return;}
  if(t.dataset.evi){S.proj.init=Math.max(num(t.value)||0,0);evUpdate(false);saveSoon();return;}
  if(t.dataset.dca&&ui.tab==='money'&&ui.money==='evol'){S.dca=Math.max(num(t.value)||0,0);evUpdate(false);saveSoon();return;}
  if(t.dataset.ci){const f=t.dataset.ci;if(f==='freq')return;const v=num(t.value);if(isNaN(v))return;S.ci[f]=v;
    document.querySelectorAll('[data-ci="'+f+'"]').forEach(x=>{if(x!==t)x.value=v;});ciUpdate();saveSoon();return;}
  if(t.dataset.gl){const f=t.dataset.gl,v=num(t.value);if(isNaN(v))return;S.goalT[f]=v;
    document.querySelectorAll('[data-gl="'+f+'"]').forEach(x=>{if(x!==t)x.value=v;});goalUpdate();saveSoon();return;}
  if(t.dataset.ng&&ui.ng){ui.ng[t.dataset.ng]=t.value;return;}
  if(t.dataset.sim){S.sim[t.dataset.sim]=num(t.value)||0;save();simUpdate();return;}
  if(t.dataset.e&&ui.edraft){ui.edraft[t.dataset.e]=t.value;return;}
  if(t.dataset.d&&ui.draft){ui.draft[t.dataset.d]=t.value;if(t.dataset.d==='rpe')render();return;}
  if(t.dataset.s&&ui.draft){const[i,j,k]=t.dataset.s.split(':');ui.draft.exs[+i].sets[+j][k]=t.value;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.e&&ui.edraft){ui.edraft[t.dataset.e]=t.value;if(t.dataset.e==='kind')render();return;}
  if(t.dataset.d&&ui.draft){ui.draft[t.dataset.d]=t.value;if(t.dataset.d==='min'||t.dataset.d==='dist')render();return;}
  if(t.dataset.s&&ui.draft){render();return;}
  if(t.dataset.goal){S.goals[t.dataset.goal]=Math.max(num(t.value)||1,1);save();renderSheet();render();return;}
  if(t.dataset.wdate){ui.wd=t.value||null;render();return;}
  if(t.dataset.wt){const k=t.dataset.wd||ui.wd||todayK();const r=S.work.days[k]||(S.work.days[k]={});if(t.value)r[t.dataset.wt]=t.value;else delete r[t.dataset.wt];save();render();return;}
  if(t.dataset.wtarget){S.work.target=Math.max(num(t.value)||39,1);save();if(ui.sheet)renderSheet();render();return;}
  if(t.dataset.ci==='freq'){S.ci.freq=+t.value;ciUpdate();save();return;}
  if(t.dataset.dca){S.dca=Math.max(num(t.value)||0,0);save();render();return;}
  if(t.dataset.la){const l=S.lines.find(x=>x.id===t.dataset.la);if(l){l.amt=Math.max(num(t.value)||0,0);syncInit();saveSoon();clearTimeout(ui._lat);ui._lat=setTimeout(()=>{const a=document.activeElement,sel=a&&a.dataset&&a.dataset.la,pos=a&&a.selectionStart;render();if(sel){const n=document.querySelector('[data-la="'+sel+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(er){}}}},700);}return;}
  if(t.dataset.lp){const l=S.lines.find(x=>x.id===t.dataset.lp);if(l){l.pct=Math.max(num(t.value)||0,0);save();render();}return;}
  if(t.dataset.sc){const[sid,f]=t.dataset.sc.split(':'),s=S.scen.find(x=>x.id===sid);
    if(s){if(f==='name')s.name=t.value.trim()||s.name;else if(f==='tilt')s.tilt=+t.value;else if(f==='monthly')s.monthly=t.value===''?null:Math.max(num(t.value)||0,0);else s[f]=f==='years'?Math.min(Math.max(Math.round(num(t.value))||1,1),50):(num(t.value)||0);save();render();}return;}
  if(t.dataset.ret){S.ret[t.dataset.ret]=num(t.value)||0;save();render();return;}
  if(t.dataset.spr){S.spread[t.dataset.spr]=Math.max(num(t.value)||0,0);save();render();return;}
  if(t.dataset.pj){S.proj[t.dataset.pj]=num(t.value)||0;save();render();return;}
  if(t.dataset.fuel){ui.fuel[t.dataset.fuel]=Math.max(num(t.value)||0,0);render();return;}
});

/* ================= démarrage ================= */
render();
visInit();
(function boot(){
  setInterval(gLive,1000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  window.addEventListener('pagehide',save);
})();


})();

</script>
