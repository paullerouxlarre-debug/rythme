<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rythme</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rythme">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E11" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
/* =====================================================================
   Rythme v3 : design système
   Principes : lisibilité d'abord (texte 16 px, contrastes AA, cibles de 44 px),
   une couleur par domaine (Boulot, Planning, Sport, Nutrition, Argent),
   cartes claires et plates, mouvements courts (< 250 ms) et sans rebond.
   ===================================================================== */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F0F1F4; --surface-3:#E2E5EA;
  --text:#14161B; --muted:#5B6270; --faint:#868C98; --sep:rgba(20,22,27,.09); --border:rgba(20,22,27,.09);
  --accent:#3B5BDB; --on-accent:#FFFFFF;
  --accent-ink:var(--accent); --accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));
  --positive:#2B8A3E; --negative:#D9363E; --warning:#B95F00; --gold:#B95F00; --clay:var(--accent);
  --c-plan:#0C8599; --c-sport:#E8590C; --c-food:#2F9E44; --c-money:#7048E8;
  --h-plan:#0B7285; --h-sport:#C2410C; --h-food:#2B7A3B; --h-money:#6741D9;
  --shadow:0 1px 2px rgba(20,22,27,.04),0 4px 14px rgba(20,22,27,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --font-body:var(--font); --serif:var(--font-display);
  --ease:cubic-bezier(.2,.7,.3,1);
  --tc:var(--accent); --tc2:color-mix(in srgb,var(--tc) 50%,var(--surface)); --hero:color-mix(in srgb,var(--accent) 86%,#000);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0E11; --surface:#17191E; --surface-2:#1F2228; --surface-3:#2C3038;
    --text:#EEF0F4; --muted:#A3A9B4; --faint:#717784; --sep:rgba(255,255,255,.08); --border:rgba(255,255,255,.08);
    --accent-ink:color-mix(in srgb,var(--accent) 62%,#fff); --accent-soft:color-mix(in srgb,var(--accent) 20%,var(--surface));
    --positive:#51CF66; --negative:#FF6B6B; --warning:#FFA94D; --gold:#FFA94D;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0E11; --surface:#17191E; --surface-2:#1F2228; --surface-3:#2C3038;
  --text:#EEF0F4; --muted:#A3A9B4; --faint:#717784; --sep:rgba(255,255,255,.08); --border:rgba(255,255,255,.08);
  --accent-ink:color-mix(in srgb,var(--accent) 62%,#fff); --accent-soft:color-mix(in srgb,var(--accent) 20%,var(--surface));
  --positive:#51CF66; --negative:#FF6B6B; --warning:#FFA94D; --gold:#FFA94D;
  --shadow:none; color-scheme:dark;
}
/* une couleur par domaine : graphiques, anneaux et carte de résumé */
body[data-tab=today]{ --tc:var(--accent); --hero:color-mix(in srgb,var(--accent) 86%,#000); }
body[data-tab=plan]{ --tc:var(--c-plan); --hero:var(--h-plan); }
body[data-tab=sport]{ --tc:var(--c-sport); --hero:var(--h-sport); }
body[data-tab=food]{ --tc:var(--c-food); --hero:var(--h-food); }
body[data-tab=money]{ --tc:var(--c-money); --hero:var(--h-money); }

/* ---------- base ---------- */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
html,body{ overscroll-behavior:none; touch-action:pan-x pan-y; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:40; }
button,input,select,textarea{ font-family:inherit; color:inherit; }
button{ cursor:pointer; }
input,textarea,select,[contenteditable]{ -webkit-user-select:text; user-select:text; font-size:16px!important; }
[hidden]{ display:none!important; }
html,body,*{ scrollbar-width:none; }
*::-webkit-scrollbar{ display:none; width:0; height:0; }
a{ color:var(--accent-ink); }
:focus-visible{ outline:2px solid var(--accent-ink); outline-offset:2px; }
.ic{ fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.cap1::first-letter{ text-transform:uppercase; }
.muted{ color:var(--muted); } .mono{ font-variant-numeric:tabular-nums; }
.pos{ color:var(--positive); } .neg{ color:var(--negative); }

/* ---------- mise en page ---------- */
.app{ max-width:560px; margin:0 auto; padding-block:0 calc(104px + env(safe-area-inset-bottom,0px)); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.topbar{ display:flex; justify-content:space-between; align-items:center; padding:12px 0 0; min-height:52px; }
.greeting{ margin:0; font-size:14px; color:var(--muted); font-weight:500; }
.avbtn{ width:40px; height:40px; border-radius:50%; border:1px solid var(--sep); background:var(--surface); color:var(--text); font-weight:650; font-size:16px; display:flex; align-items:center; justify-content:center; }
h1.page{ font-family:var(--font-display); font-weight:700; font-size:32px; line-height:1.1; letter-spacing:-.02em; margin:2px 0 4px; }
.pdate{ margin:0 0 18px; font-size:15px; color:var(--muted); font-weight:500; }
h1.page + :not(.pdate){ margin-top:14px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:30px 2px 12px; min-height:28px; }
.section-title{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.01em; margin:0; }
.section-sub{ font-size:14px; color:var(--muted); text-decoration:none; font-weight:500; text-align:right; }
a.section-sub{ color:var(--accent-ink); font-weight:600; padding:8px 0; }
.sublabel{ font-size:14px; font-weight:600; color:var(--muted); margin:20px 2px 8px; }
.note{ font-size:13.5px; color:var(--muted); line-height:1.5; margin:10px 2px 0; }
.empty{ padding:20px 16px; color:var(--muted); font-size:15px; line-height:1.5; }
.callout{ background:var(--accent-soft); border-radius:14px; padding:14px; font-size:15px; line-height:1.5; }

/* ---------- surfaces ---------- */
.card,.row-list,.form-panel,.toolrow,.mxpan,.qtile,.daycell,.mday,.tile{ background:var(--surface); border:1px solid var(--sep); box-shadow:var(--shadow); }
.card{ border-radius:20px; padding:16px; }
.card + .card{ margin-top:12px; }
.row-list{ border-radius:18px; overflow:hidden; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; min-height:56px; border-bottom:1px solid var(--sep); }
.row:last-child{ border-bottom:none; }
.row[data-act]{ cursor:pointer; }
.row-title{ font-size:16px; font-weight:600; line-height:1.3; }
.row-sub{ font-size:13.5px; color:var(--muted); margin-top:2px; }
.row-value{ font-size:16px; font-weight:600; text-align:right; white-space:nowrap; }
.row-change{ font-size:13px; margin-top:2px; text-align:right; }
.row-del{ width:36px; height:36px; border:none; background:none; color:var(--faint); font-size:22px; line-height:1; border-radius:50%; flex:none; }
.evbar{ width:4px; align-self:stretch; border-radius:2px; flex:none; }
.src{ font-size:11.5px; font-weight:700; color:#E8590C; margin-left:6px; }
.dot{ width:10px; height:10px; border-radius:50%; flex:none; display:inline-block; }
.tag{ font-size:12.5px; font-weight:650; padding:3px 8px; border-radius:7px; }
.tag.pos{ background:color-mix(in srgb,var(--positive) 14%,transparent); color:var(--positive); }
.tag.neg{ background:color-mix(in srgb,var(--negative) 14%,transparent); color:var(--negative); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat .k{ font-size:13.5px; color:var(--muted); margin-bottom:4px; }
.stat .v{ font-size:22px; font-weight:700; letter-spacing:-.01em; color:var(--text); }
.stat .s{ font-size:13px; color:var(--muted); margin-top:3px; line-height:1.35; }
.stat.box{ background:var(--surface); border:1px solid var(--sep); border-radius:16px; padding:14px; min-width:0; box-shadow:var(--shadow); }
.bignum{ font-family:var(--font-display); font-weight:700; font-size:40px; line-height:1.05; letter-spacing:-.02em; margin:0; }
.legend{ display:flex; flex-direction:column; gap:10px; font-size:15px; }
.legend .li{ display:flex; align-items:center; gap:10px; } .legend .li .n{ flex:1; } .legend .li .p{ font-size:14px; color:var(--muted); }
.lg{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-right:8px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.alloc-bar{ display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--surface-3); }
.progress{ height:8px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
.progress>div{ height:100%; border-radius:5px; background:var(--tc); transition:width .4s var(--ease); }

/* ---------- contrôles ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:48px; border:none; border-radius:14px; padding:12px 16px; font-size:16px; font-weight:600; background:var(--surface-2); color:var(--text); transition:transform .08s ease,opacity .15s; }
.btn:active,.chip:active,.iconbtn:active,.navbtn:active,.mxs:active,.pbtn:active,.toolrow:active,.qtile:active,.mday:active,.daycell:active,.pdb:active{ transform:scale(.97); }
.btn-primary{ background:var(--accent); color:var(--on-accent); flex:1; }
.btn-ghost{ background:var(--accent-soft); color:var(--accent-ink); }
.btn.danger,.btn-ghost.danger{ background:color-mix(in srgb,var(--negative) 12%,transparent); color:var(--negative); }
.btn[disabled]{ opacity:.45; }
.form-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.iconbtn,.navbtn{ width:40px; height:40px; border-radius:50%; border:1px solid var(--sep); background:var(--surface); color:var(--text); font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none; }
.back{ display:inline-flex; align-items:center; gap:2px; border:none; background:none; color:var(--accent-ink); font-weight:600; font-size:17px; padding:10px 0 6px; min-height:44px; }
.chip{ display:inline-flex; align-items:center; gap:6px; min-height:36px; border:1px solid var(--sep); background:var(--surface); color:var(--text); border-radius:999px; padding:7px 14px; font-size:14px; font-weight:600; }
.chip.on{ background:var(--text); color:var(--bg); border-color:transparent; }
.chip.static{ cursor:default; min-height:30px; padding:5px 12px; font-size:13.5px; background:var(--surface-2); }
.chip.static.on{ background:var(--text); color:var(--bg); }
.chip.off{ opacity:.45; }
.chip .ic{ vertical-align:-3px; }
.seg{ display:flex; background:var(--surface-3); border-radius:12px; padding:3px; margin:0 0 12px; gap:2px; }
.seg button{ flex:1; min-height:36px; border:none; background:none; padding:6px 4px; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap; transition:background .15s,color .15s; }
.seg button.on{ background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.bdg{ display:inline-block; margin-left:5px; min-width:18px; padding:0 5px; border-radius:9px; background:var(--negative); color:#fff; font-style:normal; font-size:11.5px; line-height:18px; font-weight:700; }

/* ---------- formulaires ---------- */
.form-panel{ border-radius:18px; padding:16px; margin-bottom:14px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:end; }
.field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.field.wide{ grid-column:1/-1; }
.field label{ font-size:13.5px; color:var(--muted); font-weight:500; line-height:1.25; }
.field input,.field select,.inl,.plain,.mini,.wform input,.mxin input,textarea.code{ width:100%; min-width:0; max-width:100%; border:1px solid transparent; background:var(--surface-2); color:var(--text); border-radius:12px; padding:11px 12px; outline:none; }
.field input,.field select{ height:48px; line-height:1.2; }
.field input:focus,.field select:focus,.inl:focus,.wform input:focus,.mxin input:focus,textarea.code:focus,.mini:focus{ border-color:var(--accent-ink); background:var(--surface); }
.field select{ -webkit-appearance:none; appearance:none; padding-right:34px; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%; background-size:5px 5px; background-repeat:no-repeat; }
input[type=date],input[type=time],input[type=month]{ -webkit-appearance:none; appearance:none; display:block; text-align:left; }
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{ text-align:left; margin:0; }
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{ opacity:.5; }
input[type=file]{ font-size:14px!important; max-width:100%; }
input[type=checkbox],input[type=range]{ accent-color:var(--accent); }
input[type=range]{ width:100%; min-width:0; flex:1; }
.inl{ flex:1; width:auto; } .plain{ margin-bottom:8px; }
.mini{ width:80px; text-align:right; padding:8px; }
textarea.code{ font:13px ui-monospace,Menlo,monospace; resize:none; word-break:break-all; }

/* ---------- carte de résumé (une par onglet, couleur du domaine) ---------- */
.hero2{ position:relative; border-radius:24px; padding:18px; margin-bottom:14px; background:var(--hero); color:#fff; }
.hero2 .sm{ font-size:13.5px; font-weight:600; color:rgba(255,255,255,.82); }
.hero2 .big{ font-family:var(--font-display); font-weight:700; font-size:36px; letter-spacing:-.02em; line-height:1.08; margin:2px 0; }
.hero2 .mini3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,.22); }
.hero2 .mini3>div{ min-width:0; padding:0 10px; border-left:1px solid rgba(255,255,255,.22); }
.hero2 .mini3>div:first-child{ border-left:none; padding-left:0; }
.hero2 .mini3 small{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.82); }
.hero2 .mini3 small i{ width:8px; height:8px; border-radius:50%; flex:none; }
.hero2 .mini3 b{ display:block; font-size:17px; font-weight:700; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hero2 .muted,.hero2 .stat .k,.hero2 .field label,.hero2 .note{ color:rgba(255,255,255,.82); }
.hero2 .stat .v{ color:#fff; }
.hero2 .chip.static{ background:rgba(255,255,255,.18); color:#fff; border-color:transparent; }
.hero2 .chip{ background:rgba(255,255,255,.16); color:#fff; border-color:transparent; }
.hero2 .chip.on{ background:#fff; color:var(--hero); }
.hero2 .inl{ background:rgba(255,255,255,.18); color:#fff; } .hero2 .inl::placeholder{ color:rgba(255,255,255,.7); }
.hero2 .iconbtn,.hero2 .navbtn{ background:rgba(255,255,255,.18); color:#fff; border-color:transparent; }
.hero2 .btn-primary{ background:#fff; color:var(--hero); }
.hero2 .btn-ghost{ background:rgba(255,255,255,.18); color:#fff; }
.hero2 .seg{ background:rgba(0,0,0,.18); } .hero2 .seg button{ color:rgba(255,255,255,.85); } .hero2 .seg button.on{ background:#fff; color:var(--hero); }
.hero2 a{ color:#fff; }
.stp{ display:flex; gap:8px; flex:none; }
.stp button{ width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.2); color:#fff; font-size:22px; font-weight:600; line-height:1; }
.tday-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.arings{ flex:none; overflow:visible; }
.tsum{ flex:1; min-width:0; display:grid; gap:10px; }
.tsum small{ display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; color:rgba(255,255,255,.85); }
.tsum small i{ width:9px; height:9px; border-radius:50%; flex:none; }
.tsum b{ display:block; font-size:18px; font-weight:700; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* anneaux et grilles */
.rw{ position:relative; width:92px; height:92px; margin:0 auto; max-width:100%; }
.rc{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:700; }
.rings3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; }
.rl{ font-size:13px; font-weight:600; margin-top:8px; line-height:1.35; }
.heat12{ display:grid; grid-template-columns:repeat(12,1fr); gap:4px; }
.heat12 i{ aspect-ratio:1; border-radius:5px; background:var(--surface-3); display:block; }
.heat12 i.fut{ opacity:.35; }
.heatw{ display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; }
.heatw i{ aspect-ratio:1; border-radius:5px; background:var(--surface-3); display:block; }
.kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:12px; }
.kpis>div{ background:var(--surface); border:1px solid var(--sep); border-radius:14px; padding:10px 6px; text-align:center; min-width:0; }
.kpis small{ display:block; font-size:12px; color:var(--muted); font-weight:600; }
.kpis b{ font-size:16px; font-weight:700; }
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile{ text-align:left; border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:3px; min-width:0; position:relative; }
.tile b{ font-size:16px; } .tile span{ font-size:13px; color:var(--muted); }

/* ---------- planning ---------- */
.wkhead{ display:flex; align-items:center; justify-content:space-between; margin:4px 0 12px; }
.wkhead b{ font-family:var(--font-display); font-size:20px; font-weight:700; }
.wkstrip{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.daycell{ border-radius:14px; padding:8px 0 7px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text); min-width:0; }
.daycell span{ font-size:12px; color:var(--muted); font-weight:600; }
.daycell b{ font-size:17px; font-weight:700; }
.daycell i{ height:6px; display:flex; gap:2px; }
.daycell i u,.mday i u{ width:6px; height:6px; border-radius:50%; display:block; }
.daycell.tod{ background:var(--text); color:var(--bg); border-color:transparent; }
.daycell.tod span{ color:var(--bg); opacity:.75; }
.mhead{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; font-size:12.5px; color:var(--muted); text-align:center; margin-bottom:6px; font-weight:600; }
.mgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.mday{ border-radius:12px; min-height:52px; padding:7px 2px 6px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; min-width:0; color:var(--text); box-shadow:none; }
.mday b{ font-size:15px; font-weight:600; }
.mday i{ height:6px; display:flex; gap:2px; }
.mday.out{ opacity:.35; }
.mday.sel{ background:var(--text)!important; color:var(--bg); border-color:transparent; }
.mday.tod:not(.sel){ border:2px solid var(--tc); }
.acc{ border-bottom:1px solid var(--sep); }
.acc:last-child{ border-bottom:none; }
.acc summary{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:15px 16px; min-height:52px; font-weight:600; font-size:16px; list-style:none; cursor:pointer; }
.acc summary::after{ content:""; width:8px; height:8px; border-right:2px solid var(--faint); border-bottom:2px solid var(--faint); transform:rotate(45deg); margin-right:4px; transition:transform .2s; }
.acc[open] summary::after{ transform:rotate(225deg); }
.acc summary::-webkit-details-marker{ display:none; }
.acc p{ margin:0 16px 16px; font-size:15px; line-height:1.55; color:var(--muted); }

/* ---------- pointage ---------- */
.pdue{ display:flex; align-items:center; gap:12px; padding:12px 12px 12px 14px; margin:0 0 14px; border-radius:18px; background:var(--surface); border:1.5px solid var(--accent); }
.pdue.late{ border-color:var(--warning); }
.pdue.soon{ border-color:var(--sep); }

.wtr{ font-size:13.5px; font-weight:650; border-radius:8px; padding:4px 8px; background:var(--surface-2); } .wtr.dn{ color:var(--positive); } .wtr.up{ color:var(--warning); }

/* ---------- argent ---------- */
.mtiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* ---------- graphiques ---------- */
svg[data-scrub]{ touch-action:pan-y; cursor:crosshair; }
.scg line{ stroke:var(--text); stroke-width:1; stroke-dasharray:3 3; opacity:0; } .scg.on line{ opacity:.5; }
.sctip{ position:absolute; z-index:5; transform:translateY(-100%); opacity:0; pointer-events:none; background:var(--text); color:var(--bg); border-radius:10px; padding:7px 10px; font-size:13px; line-height:1.45; white-space:nowrap; transition:opacity .12s; }

.sctip b{ display:block; } .sctip span{ display:flex; align-items:center; gap:5px; } .sctip i{ width:7px; height:7px; border-radius:50%; flex:none; }

/* ---------- barre d'onglets ---------- */
nav.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:color-mix(in srgb,var(--surface) 86%,transparent); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-top:1px solid var(--sep); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
.tabbar-inner{ max-width:560px; margin:0 auto; display:flex; padding:6px 4px 4px; }
.tab{ position:relative; flex:1; min-width:0; min-height:50px; background:none; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px 0; color:var(--faint); }
.tab svg{ width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.tab span{ font-size:11px; font-weight:600; white-space:nowrap; }
.tab.on{ color:var(--accent-ink); }
.tab.on svg{ stroke-width:2.1; }
.tab.due::after{ content:""; position:absolute; top:4px; left:calc(50% + 10px); width:9px; height:9px; border-radius:50%; background:var(--negative); box-shadow:0 0 0 2px var(--surface); }

/* titre compact en haut quand on fait défiler */
.ctitle{ position:fixed; left:0; right:0; top:0; z-index:45; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px; text-align:center; font-weight:650; font-size:17px; background:color-mix(in srgb,var(--bg) 86%,transparent); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-bottom:1px solid var(--sep); opacity:0; pointer-events:none; transition:opacity .15s; }
.ctitle.on{ opacity:1; pointer-events:auto; }

/* ---------- fenêtres ---------- */
.sheet{ position:fixed; inset:0; z-index:90; background:var(--bg); overflow:auto; padding-top:env(safe-area-inset-top,0px); animation:sheetin .24s var(--ease); }
.sheet.static{ animation:none; }
.sheet-in{ max-width:560px; margin:0 auto; padding-block:14px calc(40px + env(safe-area-inset-bottom,0px)); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.sheet-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.swatches{ display:flex; gap:12px; flex-wrap:wrap; }
.sw{ width:40px; height:40px; border-radius:50%; border:3px solid var(--surface); box-shadow:0 0 0 1px var(--sep); }
.sw.on{ box-shadow:0 0 0 2px var(--text); }
.cfm{ position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.45); animation:cffade .16s ease; }
.cfm.out{ opacity:0; transition:opacity .16s; }
.cfbox{ width:100%; max-width:360px; background:var(--surface); border-radius:22px; padding:22px 18px 16px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.3); animation:cfin .2s var(--ease); }
.cfbox.shake{ animation:cfshake .4s ease; }
.cfi{ width:52px; height:52px; margin:0 auto 10px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb,var(--negative) 12%,transparent); color:var(--negative); }
.cfbox h3{ margin:0 0 8px; font-size:19px; }
.cfbox p{ margin:0 0 16px; font-size:15px; line-height:1.45; color:var(--muted); }
.cfrow{ display:flex; gap:8px; margin-top:10px; }
.cfrow .btn{ flex:1; }
.cfrow .cfdel{ background:var(--negative); color:#fff; }
.stepg{ max-width:400px; text-align:left; max-height:calc(100vh - 60px); overflow:auto; }
.stepg h3{ text-align:center; } .stepg p{ text-align:left; }
.stepg ol{ margin:0 0 12px; padding-left:20px; font-size:15px; line-height:1.5; } .stepg li{ margin-bottom:6px; }
.stepg code{ font-size:13px; background:var(--surface-2); padding:1px 5px; border-radius:5px; }
.pdfv{ position:fixed; inset:0; z-index:95; background:rgba(0,0,0,.92); overflow:auto; padding:calc(60px + env(safe-area-inset-top,0px)) 8px 24px; }
.pdfv canvas{ display:block; width:100%; max-width:760px; margin:0 auto 10px; background:#fff; border-radius:4px; }
.pdfv .x{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; z-index:96; flex:none; }
.pdfv .msg{ color:#fff; text-align:center; padding:40px 20px; font-size:15px; }
.fx{ position:fixed; inset:0; pointer-events:none; z-index:120; }
.toast{ position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); max-width:calc(100vw - 32px); background:#1B1D22; color:#F2F3F5; padding:12px 18px; border-radius:14px; font-weight:600; font-size:15px; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:toast 2.6s var(--ease) both; text-align:center; }
#landlock{ display:none; }
@media (orientation:landscape) and (max-height:520px){
  #landlock{ display:flex; position:fixed; inset:0; z-index:400; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:var(--bg); color:var(--text); text-align:center; padding:20px; }
  #landlock b{ font-size:22px; } #landlock span{ color:var(--muted); font-size:15px; }
  #landlock svg{ color:var(--accent-ink); }
  body{ overflow:hidden; }
}

/* ---------- mouvement : court, une seule entrée de page ---------- */
#main.enter{ animation:pagein .2s var(--ease) both; }
@keyframes pagein{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
@keyframes sheetin{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }

@keyframes cfin{ from{ opacity:0; transform:scale(.97); } }

/* =====================================================================
   v4 : « Verre liquide ». Panneaux translucides flous sur un fond à halos.
   Six ambiances (data-skin), choisies dans Réglages ; data-theme suit l'ambiance.
   ===================================================================== */
:root{
  --base:#EEF0F7; --b1:#C9B8FF; --b2:#FFB38A; --b3:#8FD3FF;
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.78); --edge:rgba(255,255,255,.85); --panel:rgba(255,255,255,.94);

}
:root[data-skin]{ --bg:var(--base); --surface:var(--glass-hi); --border:var(--edge); --shadow:0 8px 28px rgba(30,30,60,.08); --c-plan:var(--r3); --c-sport:var(--r1); --c-food:var(--r2); --c-money:var(--deep); --h-plan:var(--deep); --h-sport:var(--deep); --h-food:var(--deep); --h-money:var(--deep); }
:root[data-skin=lilas]{ --base:#EEF0F7; --b1:#C9B8FF; --b2:#FFB38A; --b3:#8FD3FF; --text:#16161A; --muted:#44444F; --faint:#6E6E7A; --sep:rgba(22,22,26,.08); --surface-2:rgba(22,22,26,.05); --surface-3:rgba(22,22,26,.09); --accent:#4F46E5; --accent-ink:#4338CA; --deep:#4F46E5; --r1:#FF2D55; --r2:#30D158; --r3:#0A84FF; }
:root[data-skin=aube]{ --base:#FFF3EE; --b1:#FFB4A2; --b2:#FFD6A5; --b3:#F7A8C8; --text:#2A1712; --muted:#6B4A40; --faint:#94766C; --sep:rgba(42,23,18,.09); --surface-2:rgba(42,23,18,.05); --surface-3:rgba(42,23,18,.09); --accent:#C2410C; --accent-ink:#B43A0A; --deep:#B8432A; --r1:#F0502E; --r2:#E8930C; --r3:#D6336C; }
:root[data-skin=lagon]{ --base:#EAF7F5; --b1:#8EE3D0; --b2:#9BD5FF; --b3:#C8F2A6; --text:#0E2A2A; --muted:#3F5E5C; --faint:#6E8A88; --sep:rgba(14,42,42,.09); --surface-2:rgba(14,42,42,.05); --surface-3:rgba(14,42,42,.09); --accent:#0B7A6A; --accent-ink:#0A6B5D; --deep:#0B6E63; --r1:#00A88F; --r2:#F59F00; --r3:#2F6FED; }
:root[data-skin=brume]{ --base:#F1F2F4; --b1:#D6DCE8; --b2:#E6E8ED; --b3:#C7D3EA; --text:#14161B; --muted:#4D525C; --faint:#7A808B; --sep:rgba(20,22,27,.08); --surface-2:rgba(20,22,27,.05); --surface-3:rgba(20,22,27,.09); --accent:#3B5BDB; --accent-ink:#3451C4; --deep:#3B5BDB; --r1:#3B5BDB; --r2:#5C7CFA; --r3:#91A7FF; }
:root[data-skin=minuit]{ --base:#0B0D1A; --b1:#4C2BB8; --b2:#0E4D92; --b3:#8A2B6E; --text:#F4F5FA; --muted:#B0B5CA; --faint:#7E839A; --sep:rgba(255,255,255,.09); --surface-2:rgba(255,255,255,.07); --surface-3:rgba(255,255,255,.12); --accent:#6E5BFF; --accent-ink:#B3A8FF; --deep:#4B3BC9; --r1:#FF375F; --r2:#32D74B; --r3:#64D2FF;
  --glass:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.12); --edge:rgba(255,255,255,.14); --panel:rgba(24,26,44,.96); --shadow:none; --positive:#51CF66; --negative:#FF6B6B; --warning:#FFA94D; }
:root[data-skin=foret]{ --base:#0C1612; --b1:#1F6B4E; --b2:#2C4F7A; --b3:#6B5B1F; --text:#EEF5F0; --muted:#A9BDB2; --faint:#7A8F84; --sep:rgba(255,255,255,.09); --surface-2:rgba(255,255,255,.07); --surface-3:rgba(255,255,255,.12); --accent:#1B7D58; --accent-ink:#6FE0AE; --deep:#1E5A43; --r1:#FFB020; --r2:#3DDC97; --r3:#6CB8FF;
  --glass:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.12); --edge:rgba(255,255,255,.14); --panel:rgba(20,32,27,.96); --shadow:none; --positive:#51CF66; --negative:#FF6B6B; --warning:#FFA94D; }
:root[data-skin]{ --accent-soft:color-mix(in srgb,var(--accent) 16%,transparent); --bgimg:radial-gradient(circle at 12% 8%,var(--b1) 0,transparent 46%),radial-gradient(circle at 96% 42%,var(--b2) 0,transparent 42%),radial-gradient(circle at 24% 92%,var(--b3) 0,transparent 48%),var(--base); }
body[data-tab=today]{ --tc:var(--r3); } body[data-tab=plan]{ --tc:var(--r3); } body[data-tab=sport]{ --tc:var(--r1); } body[data-tab=food]{ --tc:var(--r2); } body[data-tab=money]{ --tc:var(--accent); }
body[data-tab]{ --hero:color-mix(in srgb,var(--deep) 84%,transparent); }

/* fond à halos, fixe sous le contenu */
body{ background:var(--base); }
.bgfx{ position:fixed; inset:0; z-index:0; pointer-events:none; background:var(--bgimg); }
.app{ position:relative; z-index:1; }
body::before{ background:transparent; }

/* panneaux en verre */
.card,.row-list,.form-panel,.stat.box,.toolrow,.kpis>div,.pdue,.stpb,.mxpan,.qtile,.tile,.daycell,.mday{ background:var(--glass); border:1px solid var(--edge); box-shadow:var(--shadow); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); }
.daycell,.mday{ -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:none; }
.card{ border-radius:26px; } .row-list{ border-radius:24px; } .stat.box{ border-radius:20px; } .toolrow{ border-radius:22px; } .form-panel{ border-radius:24px; }
.pdue{ border:1.5px solid var(--accent); }
.mday.out{ background:transparent; border-color:transparent; }
.hero2{ border-radius:30px; background:var(--hero); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid rgba(255,255,255,.22); box-shadow:0 14px 34px color-mix(in srgb,var(--deep) 28%,transparent); }
.btn{ border-radius:999px; }
.btn-primary,.pdb{ background:var(--accent); color:#fff; }
.btn-ghost{ background:var(--accent-soft); color:var(--accent-ink); }
.chip{ background:var(--glass-hi); border-color:var(--edge); }
.iconbtn,.navbtn,.avbtn,.mxs{ background:var(--glass-hi); border-color:var(--edge); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); }
.seg{ background:var(--surface-3); border-radius:999px; } .seg button{ border-radius:999px; }
.seg button.on{ background:var(--panel); }
.field input,.field select,.inl,.plain,.mini,.wform input,.mxin input,textarea.code{ background:var(--surface-2); }
.field input:focus,.field select:focus,.wform input:focus,.mxin input:focus{ background:var(--glass-hi); }
.pbtn{ background:var(--accent); box-shadow:0 16px 40px color-mix(in srgb,var(--accent) 35%,transparent); }
.pbtn.due{ box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 24%,transparent),0 16px 40px color-mix(in srgb,var(--accent) 35%,transparent); }
.bcard{ background:rgba(14,15,22,.86); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-radius:28px; }
.mtile{ background:color-mix(in srgb,var(--c1) 62%,#000); border-radius:24px; }
.tico{ background:color-mix(in srgb,var(--tc) 14%,transparent)!important; }

/* barre d'onglets flottante */
nav.tabbar{ left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); padding:0; border-radius:999px; border:1px solid var(--edge); background:color-mix(in srgb,var(--panel) 78%,transparent); box-shadow:0 10px 30px rgba(0,0,0,.14); max-width:536px; margin:0 auto; }

.tab{ min-height:52px; border-radius:999px; }
.tab.on{ background:var(--accent-soft); }
.ctitle{ background:color-mix(in srgb,var(--base) 70%,transparent); }

/* fenêtres */
.sheet{ background:var(--bgimg); }
.cfbox{ background:var(--panel); border:1px solid var(--edge); border-radius:28px; }
.toast{ background:var(--panel); color:var(--text); border:1px solid var(--edge); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-radius:999px; }
.restp{ background:var(--panel); color:var(--text); border:1px solid var(--edge); }
.sctip{ background:var(--text); color:var(--base); }

/* choix d'ambiance */
.skins{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.skin{ border:none; background:none; padding:0; display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--text); font-size:13.5px; font-weight:600; }
.skin i{ width:100%; aspect-ratio:1; max-width:64px; border-radius:20px; border:1px solid var(--sep); }
.skin.on i{ box-shadow:0 0 0 2.5px var(--accent-ink); }

/* =====================================================================
   v4.1 : mouvements façon Apple. Ressorts courts, entrées échelonnées,
   anneaux et barres qui se remplissent, pastille d'onglet qui glisse.
   Tout est coupé si l'iPhone demande de réduire les animations.
   ===================================================================== */
:root{ --spring:cubic-bezier(.32,.72,0,1); --bounce:cubic-bezier(.34,1.5,.64,1); }
#main.enter{ animation:none; }
#main.enter>*{ animation:rise .46s var(--spring) both; }
#main.enter>*:nth-child(2){ animation-delay:.03s; } #main.enter>*:nth-child(3){ animation-delay:.06s; } #main.enter>*:nth-child(4){ animation-delay:.09s; }
#main.enter>*:nth-child(5){ animation-delay:.12s; } #main.enter>*:nth-child(6){ animation-delay:.15s; } #main.enter>*:nth-child(7){ animation-delay:.18s; }
#main.enter>*:nth-child(n+8){ animation-delay:.2s; }
@keyframes rise{ from{ opacity:0; transform:translateY(16px) scale(.985); } to{ opacity:1; transform:none; } }
.enter .arc{ animation:arcin 1s var(--spring) .15s both; }
@keyframes arcin{ from{ stroke-dashoffset:var(--L); } }
.enter svg .rg{ animation:ringin 1s var(--spring) .15s both; }
@keyframes ringin{ from{ stroke-dasharray:0 400; } }
.enter svg rect.bar{ transform-box:fill-box; transform-origin:50% 100%; animation:barup .7s var(--spring) both; }
@keyframes barup{ from{ transform:scaleY(0); } }
.enter .progress>div,.enter .mxbar i,.enter .paybar i,.enter .alloc-bar>div{ transform-origin:left center; animation:growx .8s var(--spring) .12s both; }
@keyframes growx{ from{ transform:scaleX(0); } }
/* pastille d'onglet qui glisse d'un onglet à l'autre */
.tabbar-inner{ position:relative; }
.tabpill{ position:absolute; top:4px; bottom:4px; left:0; width:0; border-radius:999px; background:var(--accent-soft); opacity:0; transition:transform .55s var(--bounce),width .55s var(--bounce),opacity .2s; }
.tab{ z-index:1; } .tab.on{ background:none; }
.tab.on svg{ animation:tabpop .5s var(--bounce); }
@keyframes tabpop{ 0%{ transform:scale(.82); } 55%{ transform:scale(1.14); } 100%{ transform:none; } }
/* appui : léger enfoncement, retour en ressort */
.btn,.chip,.toolrow,.qtile,.tile,.mday,.daycell,.iconbtn,.navbtn,.avbtn,.pbtn,.pdb,.mxs,.wkmini,.mxc,.skin,.seg button{ transition:transform .4s var(--bounce),background .2s,color .2s,box-shadow .3s; }
.btn:active,.chip:active,.toolrow:active,.qtile:active,.tile:active,.mday:active,.daycell:active,.iconbtn:active,.navbtn:active,.avbtn:active,.pdb:active,.mxs:active,.wkmini:active,.mxc:active,.skin:active{ transform:scale(.95); transition-duration:.1s; }
.pbtn:active{ transform:scale(.93); transition-duration:.1s; }
/* fenêtres : feuille qui monte, boîte qui s'ouvre en ressort */
.sheet{ animation:sheetup .5s var(--spring); }
@keyframes sheetup{ from{ transform:translateY(100%); } to{ transform:none; } }
.cfm{ animation:cffade .25s ease; }
.cfbox{ animation:cfpop .45s var(--bounce); }
@keyframes cfpop{ from{ opacity:0; transform:scale(.86); } to{ opacity:1; transform:none; } }
.toast{ animation:toastin 2.6s var(--spring) both; }
@keyframes toastin{ 0%{ opacity:0; transform:translate(-50%,28px) scale(.9); } 12%{ opacity:1; transform:translate(-50%,0) scale(1); } 88%{ opacity:1; transform:translate(-50%,0) scale(1); } 100%{ opacity:0; transform:translate(-50%,8px) scale(.96); } }
.pring{ position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; border:2px solid var(--accent); animation:pring .6s var(--spring) forwards; }
@keyframes pring{ from{ opacity:.7; transform:scale(1); } to{ opacity:0; transform:scale(9); } }
.ctitle{ transition:opacity .25s var(--spring); }
details.wdet[open] summary ~ *{ animation:rise .4s var(--spring) both; }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{ transition:none!important; animation:none!important; } }

<script>
(function(){
"use strict";

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN;};
const fmt=n=>(isFinite(n)?n:0).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
const fmtS=n=>(n>=0?'+':'−')+Math.abs(isFinite(n)?n:0).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
const fmtN=(n,d=0)=>(isFinite(n)?n:0).toLocaleString('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:d});
const pct=(n,d=1)=>(n>=0?'+':'−')+Math.abs(isFinite(n)?n:0).toFixed(d).replace('.',',')+' %';

const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const dLong=k=>new Date(k+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const mShort=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('fr-FR',{month:'short'}).replace('.','')+' '+y.slice(2);};
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const sum=a=>a.reduce((s,x)=>s+x,0);

const fmtC=n=>{n=Math.floor(n);if(n<1e4)return n.toLocaleString('fr-FR');const u=['k','M','Md','T'];let i=-1,v=n;while(v>=1000&&i<u.length-1){v/=1000;i++;}return v.toLocaleString('fr-FR',{maximumFractionDigits:v<100?2:1})+' '+u[i];};
const fmtH=m=>{m=Math.max(Math.round(m),0);return Math.floor(m/60)+' h '+pad(m%60);};

/* ================= constants ================= */

/* ambiances « verre liquide » : [id, nom, halo, fond, sombre] */

const blankGame=()=>({pts:0,life:0,taps:0,skin:0,skins:[0],claimed:{},myg:[],mig:0,chest:{last:'',streak:0,best:0},own:[],eq:{head:'',face:'',bg:''},badges:{},circle:0,wb:'',sprint:{day:'',plays:0,best:0},goal:{wT:'',wS:'',dT:'',dFrom:''}});
const blank=()=>({lines:[],ret:{ETF:6.5,Actions:8,Crypto:12},spread:{ETF:2.5,Actions:3.5,Crypto:8},dca:0,scen:null,
  proj:{init:5000,monthly:300,years:20,infl:2,goal:200000},ci:{init:1000,monthly:200,rate:7,years:20,freq:12},
  incomes:[],sources:['Salaire','Freelance','Dividendes','Autre'],pays:[],

function migrate(d){
  const o=Object.assign(blank(),d||{});
  o.lines=(o.lines||[]).map(l=>{const n=Object.assign({},l);if(n.pct==null)n.pct=n.w||0;delete n.w;return n;});
  o.incomes=(o.incomes||[]).map(i=>Object.assign({source:'Salaire'},i));
  o.events=(o.events||[]).map(e=>Object.assign({},e,{kind:e.kind==='Travail'?'Boulot':(EK[e.kind]?e.kind:'Perso')}));

  const dg=blankGame();['myg','chest','own','eq','badges','sprint'].forEach(k=>{if(o.game[k]==null||typeof o.game[k]!==typeof dg[k])o.game[k]=dg[k];});

function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[];}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}

function importStrava(text){
  const rows=parseCSV(text);if(rows.length<2)return {err:'Fichier vide ou illisible.'};
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=n=>h.indexOf(n);
  const iId=col('activity id'),iD=col('activity date'),iT=col('activity type'),iDist=col('distance'),iMv=col('moving time'),iEl=col('elapsed time');
  if(iD<0||iT<0)return {err:'Colonnes « Activity Date » et « Activity Type » introuvables. L\'export doit être en anglais.'};
  const have=new Set(S.workouts.map(w=>w.sid).filter(Boolean));
  let added=0,dup=0,skip=0,bad=0;
  rows.slice(1).forEach(r=>{
    const type=SV[(r[iT]||'').trim().toLowerCase()];if(!type){skip++;return;}
    const sid=iId>=0?String(r[iId]).trim():'';if(sid&&have.has(sid)){dup++;return;}
    const dt=new Date(r[iD]);if(isNaN(dt)){bad++;return;}
    const sec=num(iMv>=0&&r[iMv]?r[iMv]:r[iEl]);if(!(sec>=180)){skip++;return;}
    const w={id:uid(),date:dkey(dt),type,rpe:6,min:Math.round(sec/60),src:'strava',sid:sid||undefined};
    if(type==='course'){let k=num(iDist>=0?r[iDist]:'');if(k>200)k=k/1000;if(k>0)w.dist=Math.round(k*100)/100;}
    S.workouts.push(w);if(sid)have.add(sid);added++;
  });
  S.imported=(S.imported||0)+added;
  return {added,dup,skip,bad};
}

/* jours marqués « x » dans la feuille de temps → événements « Congé » dans le planning */
function addConges(days){
  const has=k=>evOn(k).some(e=>e.kind==='Congé');
  const ds=[...new Set(days)].filter(k=>!has(k)).sort();if(!ds.length)return 0;
  const groups=[];
  ds.forEach(k=>{const g=groups[groups.length-1];
    if(g){let gap=addD(g.end,1),ok=true;while(gap<k){const w=new Date(gap+'T12:00').getDay();if(w!==0&&w!==6){ok=false;break;}gap=addD(gap,1);}
      if(ok){g.end=k;g.n++;return;}}
    groups.push({start:k,end:k,n:1});});
  groups.forEach(g=>S.events.push({id:uid(),title:g.n>1?'Congés':'Congé',kind:'Congé',date:g.start,end:g.end>g.start?g.end:'',time:'',dur:'',rep:'',src:'xlsx'}));
  return ds.length;
}
function importHours(rows,opt){
  opt=opt||{};
  const sv=v=>v==null?'':String(v).trim();
  let hi=-1;
  for(let i=0;i<Math.min(20,rows.length);i++){if((rows[i]||[]).some(c=>/^date\b/i.test(sv(c)))){hi=i;break;}}
  if(hi<0)for(let i=0;i<Math.min(20,rows.length);i++){if((rows[i]||[]).some(c=>/^(jour|day)s?$/i.test(sv(c)))){hi=i;break;}}
  const h=hi>=0?rows[hi].map(x=>sv(x).toLowerCase()):[];
  const find=(re,not)=>h.findIndex((x,i)=>re.test(x)&&!(not||[]).includes(i));
  const iD=hi>=0?(h.findIndex(x=>/^date\b/.test(x))>=0?h.findIndex(x=>/^date\b/.test(x)):find(/date|jour/)):0;
  const iLo=hi>=0?find(/(d[ée]but|d[ée]part|sortie).*(pause|d[ée]j|midi)|(pause|d[ée]j|midi).*(d[ée]but|d[ée]part|sortie)/):-1;
  const iLi=hi>=0?find(/(fin|retour|reprise).*(pause|d[ée]j|midi)|(pause|d[ée]j|midi).*(fin|retour|reprise)/):-1;
  const pz=[iLo,iLi];
  const iPz=hi>=0?find(/pause|d[ée]j|midi/,pz):-1;
  const used=[iD,iLo,iLi,iPz];
  const iIn=hi>=0?find(/d[ée]but|arriv|entr[ée]e|start|^in$|embauche|prise|matin/,used):1;
  const iOut=hi>=0?find(/^fin|\bfin\b|d[ée]part|sortie|end|^out$|d[ée]bauche|soir/,used.concat([iIn])):2;
  const iDur=hi>=0?find(/heure|dur[ée]e|total|hours|travaill|temps/,used.concat([iIn,iOut])):-1;
  const pDate=v=>{
    if(v instanceof Date&&!isNaN(v))return dkey(v);
    if(typeof v==='number'&&v>20000&&v<80000){if(opt.d1904)v+=1462;const d=new Date(Math.round((v-25569)*86400000));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
    const s=sv(v);let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
    m=s.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if(m){let y=+m[3];if(y<100)y+=2000;const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+pad(mo)+'-'+pad(d);}
    m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
    return null;};
  const pTime=v=>{
    if(typeof v==='number'){if(v>=0&&v<1)return Math.round(v*1440);return NaN;}
    if(v instanceof Date&&!isNaN(v))return v.getUTCHours()*60+v.getUTCMinutes();
    const s=sv(v).toLowerCase();let m=s.match(/^(\d{1,2})\s*[:h]\s*(\d{2})?/);
    if(m){const a=+m[1]*60+(m[2]?+m[2]:0);return a<1440?a:NaN;}
    return NaN;};
  const pDur=(v,pause)=>{
    if(typeof v==='number'){if(v<=0)return 0;if(v<1)return Math.round(v*1440);return pause?Math.round(v):Math.round(v<=24?v*60:v);}
    const t=pTime(v);if(!isNaN(t))return t;
    const n=num(sv(v));if(isNaN(n)||n<=0)return 0;return pause?Math.round(n):Math.round(n<=24?n*60:n);};
  const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
  let added=0,dup=0,bad=0,tot=0,off=0;const batch={},offs=[];
  rows.slice(hi+1).forEach(r=>{
    if(!r||!r.length)return;
    const k=pDate(r[iD]);if(!k){if(r.some(c=>(typeof c==='number'&&c>0&&c<1)||/^\d{1,2}\s*[:h]\s*\d{2}$/.test(sv(c))))bad++;return;}
    let rec=null;
    if(iIn>=0&&/^x$/i.test(sv(r[iIn]))){off++;offs.push(k);return;}
    const a=iIn>=0?pTime(r[iIn]):NaN,b=iOut>=0?pTime(r[iOut]):NaN;
    if(!isNaN(a)&&isNaN(b)&&k===todayK()){const lo=iLo>=0?pTime(r[iLo]):NaN,li=iLi>=0?pTime(r[iLi]):NaN;rec={in:hm(a)};if(!isNaN(lo))rec.lo=hm(lo);if(!isNaN(li))rec.li=hm(li);batch[k]=rec;return;}
    if(isNaN(a)&&isNaN(b)&&(iDur<0||!(pDur(r[iDur],false)>0)))return;
    if(!isNaN(a)&&!isNaN(b)&&b>a){
      rec={in:hm(a),out:hm(b)};
      const lo=iLo>=0?pTime(r[iLo]):NaN,li=iLi>=0?pTime(r[iLi]):NaN;
      if(!isNaN(lo)&&!isNaN(li)&&li>lo&&lo>a&&li<b){rec.lo=hm(lo);rec.li=hm(li);}
      else{const p=iPz>=0?pDur(r[iPz],true):0;
        if(p>0&&p<b-a){const s0=Math.round((a+b)/2-p/2);rec.lo=hm(s0);rec.li=hm(s0+p);}}
    }else if(iDur>=0){
      const d=pDur(r[iDur],false);
      if(d>0&&d<900){const p=iPz>=0?pDur(r[iPz],true):0;const net=Math.max(d-p,1);
        if(batch[k]&&batch[k].syn){const t=tmin(batch[k].out)+net;if(t<1440){batch[k].out=hm(t);}return;}
        rec={in:'09:00',out:hm(540+net),syn:1};}
    }
    if(!rec){bad++;return;}
    batch[k]=rec;
  });
  Object.keys(batch).forEach(k=>{
    const ex=S.work.days[k];
    if(ex&&ex.in&&ex.out){dup++;return;}
    const rec=batch[k];delete rec.syn;
    S.work.days[k]=rec;added++;tot+=workMin(rec,false);
  });
  const conge=addConges(offs);
  return {added,dup,bad,tot,off,conge,cols:hi>=0?'':'sans en-têtes (colonnes : date, début, fin, pause)'};
}

function dayCtx(k){
  const ev=evOn(k),sp=ev.filter(e=>e.kind==='Sport'&&!e.end);
  const planMin=sum(sp.map(e=>e.dur||0)),doneMin=sum(wOn(k).map(w=>w.min));
  const min=Math.max(planMin,doneMin);
  const wr=S.work.days[k];

  const work=ev.some(e=>e.kind==='Boulot')||!!(wr&&wr.in)||(dw>=1&&dw<=5&&!ev.some(e=>e.kind==='Voyage'||e.kind==='Congé'));
  const trip=ev.some(e=>e.kind==='Voyage');
  const relax=ev.some(e=>e.kind==='Détente');
  const kc=sum(sp.map(e=>(MET[e.sport||'course']||6)*weight()*((e.dur||0)/60)));
  const kcDone=sum(wOn(k).map(kcal));

  return {k,min,id,name:names[id],col:cols[id],work,trip,relax,kc:Math.max(kc,kcDone),sports:sp};
}
const CARB=[[3,5],[3,5],[5,7],[6,10]];
function nutriDay(k){
  const p=S.profile;if(!p)return null;
  const c=dayCtx(k),w=p.weight,h=c.min/60;
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='h'?5:-161);

  if(c.trip)base*=1.04;
  const adj={perte:0.85,maintien:1,prise:1.10}[p.goal]||1;
  const kc=(base+c.kc)*adj;
  const [cl,ch]=CARB[c.id];

  const prot=Math.round(w*(p.goal==='perte'?1.9:p.goal==='prise'?1.8:1.6));
  const fat=Math.max(Math.round((kc-carbs*4-prot*4)/9),Math.round(w*0.8));

  return {c,bmr,kc,carbs,carbLo:Math.round(w*cl),carbHi:Math.round(w*ch),prot,protLo:Math.round(w*1.4),protHi:Math.round(w*2),fat,water,
    pre:c.id>=2?'Repas riche en glucides et léger en fibres 2 à 4 h avant.':c.id===1?'Une collation légère si tu as faim, sinon rien de spécial.':'Rien de spécial, répartis les protéines sur 3 à 4 repas.',

/* ================= course : calcul ================= */
function parseDur(s){
  s=String(s||'').trim().replace(',','.');if(!s)return NaN;
  const p=s.split(':').map(Number);if(p.some(x=>!isFinite(x)||x<0))return NaN;
  if(p.length===1)return p[0];
  if(p.length===2)return p[0]+p[1]/60;
  return p[0]*60+p[1]+p[2]/60;
}
function fmtDur(m){
  if(!isFinite(m)||m<=0)return '';
  let s=Math.round(m*60);const h=Math.floor(s/3600);s-=h*3600;const mi=Math.floor(s/60);s-=mi*60;
  return h>0?`${h}:${pad(mi)}:${pad(s)}`:`${mi}:${pad(s)}`;
}
function fmtPace(m){if(!isFinite(m)||m<=0)return '';let a=Math.floor(m),b=Math.round((m-a)*60);if(b===60){a++;b=0;}return a+':'+pad(b);}
function rcCompute(){
  const r=ui.rc,known=r.order.slice(0,2);
  if(known.length<2)return {};
  const d=num(r.d),t=parseDur(r.t),p=parseDur(r.p),o={};
  const miss=['d','t','p'].find(x=>!known.includes(x));
  if(miss==='d'&&t>0&&p>0)o.d=t/p;
  if(miss==='t'&&d>0&&p>0)o.t=d*p;
  if(miss==='p'&&d>0&&t>0)o.p=t/d;
  return {miss,o};
}

const PSTEPS=[['in','Arrivée'],['lo','Pause déj.'],['li','Retour'],['out','Départ']];
function workMin(rec,live){
  if(!rec||!rec.in)return 0;
  const a=tmin(rec.in);let end=null,lunch=0;
  if(rec.out)end=tmin(rec.out);
  else if(live){const n=new Date();end=n.getHours()*60+n.getMinutes();}
  if(rec.lo&&rec.li)lunch=Math.max(tmin(rec.li)-tmin(rec.lo),0);
  else if(rec.lo&&!rec.li&&!rec.out){end=tmin(rec.lo);}
  if(end==null)return 0;
  return Math.max(end-a-lunch,0);
}
const workDay=k=>workMin(S.work.days[k],k===todayK());
const dayTarget=()=>Math.round((S.work.target||39)*60/5);
const mhm=m=>pad(Math.floor(m/60))+':'+pad(Math.round(m%60));

function leaveAt(rec){if(!rec||!rec.in||rec.out)return null;const lunch=rec.lo&&rec.li?Math.max(tmin(rec.li)-tmin(rec.lo),0):60;const t=tmin(rec.in)+dayTarget()+lunch;return t<24*60?mhm(t):null;}

  const pd=punchDue(),pk=pd?pd.key:'';if(pk!==_pdk){const first=_pdk==='';_pdk=pk;if(!first&&ui.tab==='today'&&!document.querySelector('input:focus'))render();else decorate();setTimeout(duePopup,first?1600:300);}

const V={},M={},SP={};
const evPlanned=k=>evOn(k).filter(e=>e.kind==='Sport'&&!e.end);
function evRow(e,k,full){

function weekDots(){

V.today=function(){
  if(ui.tl==='calc')return `<button class="back" data-act="tl" data-id="">‹ Aujourd'hui</button><h1 class="page" style="margin-top:0">Calcul de course</h1>${SP.calc()}`;
  const td=todayK(),tm=addD(td,1),ev0=evOn(td),ev1=evOn(tm),w=wOn(td),min=moveMin(td),smin=stepMin(td),g=S.goals.dayMin;
  const dtxt=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const ws=wk(td),days=[0,1,2,3,4,5,6].map(i=>addD(ws,i)),wsess=inDays(days);
  const ctx=dayCtx(td);
  const bars=lastDays(7).map(k=>({l:new Date(k+'T12:00').toLocaleDateString('fr-FR',{weekday:'narrow'}),v:moveMin(k),c:k===td?'var(--c-sport)':'var(--surface-3)'}));

  const RG=[{p:g?min/g:0,c1:'#FFC078',k:'Bouger',v:min+' / '+g+' min'},{p:S.goals.weekSessions?wsess.length/S.goals.weekSessions:0,c1:'#8CE99A',k:'Séances',v:wsess.length+' / '+S.goals.weekSessions+' cette sem.'},r3];
  RG.forEach(r=>r.c2=r.c1);

    <div class="chips" style="margin-top:14px"><span class="chip static">${ctx.name}${ctx.min?' · '+ctx.min+' min prévues':''}</span>${streak()?`<span class="chip static">Série de ${streak()} j</span>`:''}</div></div>

  <div style="margin-top:12px">${weekDots()}</div>

  <div class="section-head"><h2 class="section-title">Sport</h2><span class="section-sub">${min} sur ${g} min</span></div>

};

/* ---- Planning ---- */
V.plan=function(){return `<h1 class="page">Planning</h1>${planMonth()}`;};

function planMonth(){
  if(!ui.sel)ui.sel=todayK();
  const td=todayK(),b=new Date();b.setDate(1);b.setMonth(b.getMonth()+ui.pm);
  const y=b.getFullYear(),m=b.getMonth(),lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),rows=lead+dim>35?42:35;
  const cells=[];
  for(let i=0;i<rows;i++){
    const dt=new Date(y,m,1-lead+i),k=dkey(dt),out=dt.getMonth()!==m,ev=evOn(k),hasW=wOn(k).length>0;
    const kinds=[...new Set(ev.map(e=>e.kind).concat(hasW?['Sport']:[]))].slice(0,4);
    const trip=ev.find(e=>e.end&&e.date<=k&&k<=e.end);
    cells.push(`<button class="mday ${out?'out':''} ${ui.sel===k?'sel':''} ${k===td?'tod':''}" ${ui.sel!==k&&(ev.length||hasW)?`style="background:color-mix(in srgb,${EK[(trip||ev[0]||{kind:'Sport'}).kind]} ${trip?26:14}%,var(--surface))"`:''} data-act="plsel" data-id="${k}"><b>${dt.getDate()}</b><i>${kinds.map(x=>`<u style="background:${ui.sel===k?'#fff':EK[x]}"></u>`).join('')}</i></button>`);
  }
  const mp=`${y}-${pad(m+1)}`,occ={};
  for(let d=1;d<=dim;d++){const k=`${mp}-${pad(d)}`;evOn(k).forEach(e=>{(occ[e.id]||(occ[e.id]={e,days:[]})).days.push(k);});}
  const list=Object.values(occ).sort((a,b)=>a.days[0]<b.days[0]?-1:1);
  const nw=S.workouts.filter(w=>w.date.startsWith(mp)).length;
  const trips=sum(list.filter(x=>x.e.kind==='Voyage').map(x=>x.days.length));
  const bds=list.filter(x=>x.e.kind==='Anniversaire').length;
  const sel=ui.sel,evs=evOn(sel),ws=wOn(sel);
  const d=ui.edraft,f=(l,k,attr,cls='')=>`<div class="field ${cls}"><label>${l}</label><input data-e="${k}" value="${esc(d[k])}" ${attr}></div>`;
  const form=ui.open.fe&&d?`<div class="form-panel" style="margin-top:12px"><div class="form-grid">
    ${f('Titre','title','placeholder="Week-end à Lisbonne, anniversaire de Léa…"','wide')}
    <div class="field"><label>Type</label><select data-e="kind">${Object.keys(EK).map(x=>`<option ${d.kind===x?'selected':''}>${x}</option>`).join('')}</select></div>
    <div class="field"><label>Répétition</label><select data-e="rep"><option value="" ${!d.rep?'selected':''}>Aucune</option><option value="w" ${d.rep==='w'?'selected':''}>Chaque semaine</option><option value="y" ${d.rep==='y'?'selected':''}>Chaque année</option></select></div>
    ${f('Date','date','type="date"')}${f('Jusqu\'au (voyage, vacances)','end','type="date"')}
    ${f('Heure','time','type="time"')}${f('Durée (min)','dur','type="number" inputmode="numeric"')}
    ${d.kind==='Sport'?`<div class="field wide"><label>Sport</label><select data-e="sport">${Object.entries(SPORTS).map(([k,v])=>`<option value="${k}" ${d.sport===k?'selected':''}>${v.name}</option>`).join('')}</select></div>`:''}</div>
    <div class="form-actions"><button class="btn btn-primary" data-act="adde">Ajouter au planning</button><button class="btn btn-ghost" data-act="toggle" data-id="fe">Annuler</button></div></div>`
    :`<button class="btn btn-primary" style="width:100%;margin-top:12px" data-act="newev">Ajouter un événement</button>`;
  const up=[];for(let i=0;i<90&&up.length<5;i++){const k=addD(td,i);evOn(k).forEach(e=>{if(!up.find(x=>x.e.id===e.id)&&up.length<5)up.push({k,e});});}
  const nxt=up[0];
  return `
  <div class="hero2"><div class="sm">Prochain événement</div><div class="big" style="font-size:26px">${nxt?esc(nxt.e.title):'Rien de prévu'}</div>
    <div class="sm">${nxt?(nxt.k===td?'Aujourd\'hui':dLong(nxt.k))+' · '+hm(nxt.e):'Ajoute un événement plus bas'}</div>
    <div class="mini3"><div><small>Événements</small><b>${list.length}</b></div><div><small>Séances</small><b>${nw}</b></div><div><small>Voyage</small><b>${trips} j</b></div></div></div>
  <div class="wkhead"><button class="navbtn" data-act="plm" data-id="-1" aria-label="Mois précédent">‹</button><b class="cap1">${new Date(y,m,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</b><button class="navbtn" data-act="plm" data-id="1" aria-label="Mois suivant">›</button></div>
  <div class="mhead">${['L','M','M','J','V','S','D'].map(x=>`<span>${x}</span>`).join('')}</div>
  <div class="mgrid">${cells.join('')}</div>
  <div class="chips" style="margin-top:12px">${Object.entries(EK).map(([k,c])=>`<span class="lg"><span class="dot" style="background:${c}"></span>${k}</span>`).join('')}</div>
  ${ui.pm!==0?`<button class="btn btn-ghost" style="width:100%;margin-top:10px;padding:8px" data-act="plm" data-id="0">Revenir à ce mois-ci</button>`:''}

  <div class="section-head"><h2 class="section-title cap1">${dLong(sel)}</h2></div>
  <div class="row-list">${evs.map(e=>evRow(e,sel,true)).join('')}${ws.map(x=>`<div class="row" style="align-items:stretch;gap:12px"><div class="evbar" style="background:${SPORTS[x.type].col}"></div><div style="flex:1"><div class="row-title">${SPORTS[x.type].name}${x.src==='strava'?'<span class="src">Strava</span>':''}</div><div class="row-sub">Séance enregistrée · ${x.min} min${x.dist?' · '+fmtN(x.dist,1)+' km':''}</div></div></div>`).join('')}${!evs.length&&!ws.length?'<div class="empty">Rien ce jour-là.</div>':''}</div>
  ${form}

  <div class="section-head"><h2 class="section-title">Ce mois-ci</h2><span class="section-sub">${list.length} événement${list.length>1?'s':''}${bds?' · '+bds+' anniversaire'+(bds>1?'s':''):''}</span></div>
  <div class="row-list">${list.map(x=>`<div class="row" style="align-items:stretch;gap:12px;cursor:pointer" data-act="plsel" data-id="${x.days[0]}" data-jump="1"><div class="evbar" style="background:${EK[x.e.kind]}"></div><div style="flex:1;min-width:0"><div class="row-title">${esc(x.e.title)}</div><div class="row-sub">${x.days.length>1?dShort(x.days[0])+' au '+dShort(x.days[x.days.length-1]):dShort(x.days[0])} · ${esc(x.e.kind)}</div></div></div>`).join('')||'<div class="empty">Aucun événement ce mois-ci.</div>'}</div>
  ${up.length?`<div class="section-head"><h2 class="section-title">À venir</h2></div><div class="row-list">${up.map(({k,e})=>`<div class="row" style="align-items:stretch;gap:12px"><div class="evbar" style="background:${EK[e.kind]}"></div><div style="flex:1;min-width:0"><div class="row-title">${esc(e.title)}</div><div class="row-sub">${dShort(k)} · ${hm(e)}</div></div></div>`).join('')}</div>`:''}`;
}


/* ---- Boulot (dans Ma journée) : pointage modifiable ---- */
function dueBanner(){
  const p=punchDue();if(!p)return '';
  const t=p.st==='late'?'Tu n\'as pas pointé '+p.label:p.st==='soon'?'Bientôt : pointer '+p.label:'C\'est l\'heure de pointer '+p.label;
  const s=p.st==='late'?'Prévu entre '+hm2(p.w[0])+' et '+hm2(p.w[1])+' · l\'heure reste modifiable':'Créneau habituel '+hm2(p.w[0])+'–'+hm2(p.w[1]);
  return `<div class="pdue ${p.st}"><div class="pdi">${IC('clock',20)}</div><div class="pdt"><b>${t}</b><small>${s}</small></div><button class="pdb" data-act="punch">Pointer <span id="pdnow">${hhmm()}</span></button></div>`;
}
function workCard(){
  const td=todayK(),rec=S.work.days[td]||{},ns=nextStep(rec),tgt=S.work.target||39;
  const ws=wk(td),wkMin=workWeek(ws),pct=Math.min(wkMin/(tgt*60),1);
  if(!dayCtx(td).work&&!rec.in)return '';
  const open=!!ui.open.wk||!!punchDue();
  const head=`<div class="section-head"><h2 class="section-title">Boulot</h2><span class="section-sub">${fmtH(wkMin)} sur ${tgt} h cette semaine</span></div>`;
  if(!open)return head+`<button class="card wkmini" data-act="toggle" data-id="wk"><div style="flex:1;min-width:0"><b id="wlive">${fmtH(workMin(rec,true))}</b><small>${rec.in?'Arrivée '+rec.in+(rec.out?' · départ '+rec.out:ns?' · prochaine étape : '+ns[1].toLowerCase():''):'Pas encore pointé'}</small></div><span class="mxgo" style="margin:0">Détails ›</span></button>`;
  return head+`<div class="card punch">
    <div class="bignum" id="wlive">${fmtH(workMin(rec,true))}</div>
    <div class="muted" style="font-size:13px;margin-top:-8px">travaillées aujourd'hui</div>
    <button class="pbtn ${ns?'':'done'} ${punchDue()?'due':''}" data-act="punch" ${ns?'':'disabled'} aria-label="Pointer"><span>${ns?ns[1]:'Journée finie'}</span><small>${ns?'Appuie pour pointer':'À demain'}</small></button>
    <div class="steps">${PSTEPS.map(([k,l])=>`<label class="${rec[k]?'on':''}">${l}<input type="time" value="${rec[k]||''}" data-wt="${k}" data-wd="${td}" aria-label="Modifier ${l}"></label>`).join('')}</div>
    ${leaveAt(rec)?`<div class="leave">${IC('clock',15)}<span>Départ pour ${fmtH(dayTarget())} : <b>${leaveAt(rec)}</b></span></div>`:''}
    <div class="muted" style="font-size:12px">Touche une heure pour la modifier.</div>
    <button class="chip" data-act="wfull" data-id="${td}">Journée complète · ${fmtH(dayTarget())}</button>
    ${ns&&ns[0]==='lo'?'<button class="chip" data-act="nolunch">Pas de pause aujourd\'hui</button>':''}
    <div class="progress" style="width:100%;height:10px"><div style="width:${Math.round(pct*100)}%;background:linear-gradient(90deg,var(--tc),var(--tc2))"></div></div>
  </div>
  <details class="card wdet" ${ui.open.wst?'open':''}><summary data-act="togglesum" data-id="wst"><span>Stats et historique</span><span class="muted" style="font-size:13px">${ui.open.wst?'Masquer':'Afficher'}</span></summary>${ui.open.wst?workStats():''}</details>`;
}
function workStats(){
  const td=todayK(),tgt=S.work.target||39,ws=wk(td),dt=dayTarget();
  const dayItems=[0,1,2,3,4,5,6].map(i=>{const k=addD(ws,i);return {l:['L','M','M','J','V','S','D'][i],v:workDay(k),c:k===td?'var(--tc)':'var(--surface-3)'};});
  const wsList=weeks(8);
  const wkItems=wsList.map(k=>({l:dShort(k).split(' ')[0],v:workWeek(k),c:k===ws?'var(--tc)':'var(--surface-3)'}));
  const done=Object.keys(S.work.days).filter(workDone).sort();
  const past=done.filter(k=>k>=addD(td,-28));
  const avgDay=avg(past.map(workDay));
  const avgIn=avg(past.map(k=>tmin(S.work.days[k].in))),avgOut=avg(past.map(k=>tmin(S.work.days[k].out)));
  const lun=past.map(k=>S.work.days[k]).filter(r=>r.lo&&r.li&&r.li>r.lo).map(r=>tmin(r.li)-tmin(r.lo));
  /* solde : chaque journée complète comparée à l'objectif du jour (week-end : tout compte en plus) */
  const diff=k=>workDay(k)-(isWkday(k)?dt:0);
  const bal=sum(done.map(diff));
  const sg=v=>(v>=0?'+':'−')+fmtH(Math.abs(v));
  const mk=td.slice(0,7),mDays=done.filter(k=>k.startsWith(mk));
  const mTot=sum(mDays.map(workDay)),mBal=sum(mDays.map(diff));
  const wkLeft=tgt*60-workWeek(ws);
  const long=past.length?past.reduce((a,k)=>workDay(k)>workDay(a)?k:a):null;
  const dows=[1,2,3,4,5].map(d=>{const ks=done.filter(k=>k>=wsList[0]&&new Date(k+'T12:00').getDay()===d);return {l:['L','M','M','J','V'][d-1],v:ks.length?avg(ks.map(workDay)):0,c:'var(--tc)'};});
  const months=[5,4,3,2,1,0].map(i=>{const d=new Date(td+'T12:00');d.setDate(1);d.setMonth(d.getMonth()-i);const m=dkey(d).slice(0,7);
    return {l:d.toLocaleDateString('fr-FR',{month:'short'}).replace('.',''),v:sum(done.filter(k=>k.startsWith(m)).map(workDay)),c:m===mk?'var(--tc)':'var(--surface-3)'};});
  const sd=ui.wd||td,sr=S.work.days[sd]||{};
  const hist=Object.keys(S.work.days).filter(k=>S.work.days[k].in).sort().reverse().slice(0,8);
  const box=(k,v,s)=>`<div class="stat box"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  return `<div style="margin-top:14px">
  <div class="sublabel" style="margin-top:0">Cette semaine</div>${barChart(dayItems,{h:120,fy:v=>fmtN(v/60,1)+' h'})}
  <div class="grid2" style="margin-top:12px">
    ${box(wkLeft>0?'Reste cette semaine':'Semaine faite',wkLeft>0?fmtH(wkLeft):sg(-wkLeft),'sur '+tgt+' h')}
    ${box('Solde d\'heures',done.length?sg(bal):'—',done.length?'depuis le '+dShort(done[0])+' · '+fmtH(dt)+' par jour':'aucune journée complète')}
  </div>
  <div class="sublabel">Ce mois-ci</div>
  <div class="grid2">
    ${box('Heures travaillées',mDays.length?fmtH(mTot):'—',mDays.length+' jour'+(mDays.length>1?'s':'')+' complet'+(mDays.length>1?'s':''))}
    ${box('Solde du mois',mDays.length?sg(mBal):'—','vs '+fmtH(dt)+' par jour')}
  </div>
  <div class="sublabel">4 dernières semaines</div>
  <div class="grid2">
    ${box('Moyenne par jour',past.length?fmtH(avgDay):'—')}
    ${box('Pause déjeuner',lun.length?fmtH(avg(lun)):'—','en moyenne')}
    ${box('Arrivée moyenne',past.length?mhm(avgIn):'—')}
    ${box('Départ moyen',past.length?mhm(avgOut):'—')}
    ${long?box('Plus longue journée',fmtH(workDay(long)),dLong(long)):''}
    ${past.length?box('Jours complets',past.length,'sur 4 semaines'):''}
  </div>
  <div class="sublabel">Heures par semaine</div>${barChart(wkItems,{h:130,goal:tgt*60,goalLabel:tgt+' h',fy:v=>fmtN(v/60,0)})}
  ${dows.some(d=>d.v>0)?`<div class="sublabel">Moyenne par jour de la semaine</div><div class="note" style="margin:-4px 4px 6px">Pointillés : ${fmtH(dt)}</div>${barChart(dows,{h:120,goal:dt,fy:v=>fmtN(v/60,1)})}`:''}
  <div class="sublabel">Heures par mois</div>${barChart(months,{h:120,fy:v=>fmtN(v/60,0)})}
  <div class="sublabel">Corriger un autre jour</div>
  <div class="form-panel" style="margin:0"><div class="form-grid">
    <div class="field wide"><label>Date</label><input type="date" value="${sd}" data-wdate="1"></div>
    ${PSTEPS.map(([k,l])=>`<div class="field"><label>${l}</label><input type="time" value="${sr[k]||''}" data-wt="${k}" data-wd="${sd}"></div>`).join('')}

function parseStepsText(t){
  const MO={janv:1,jan:1,'févr':2,fev:2,'fév':2,feb:2,mars:3,mar:3,avr:4,apr:4,mai:5,may:5,juin:6,jun:6,juil:7,jul:7,'août':8,aout:8,aug:8,sept:9,sep:9,oct:10,nov:11,'déc':12,dec:12};
  const out={};
  String(t||'').split(/\r?\n|;(?=\s*\d{4}-)/).forEach(line=>{
    const l=line.trim();if(!l)return;let k=null,rest=l;
    let m=l.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m){k=m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);rest=l.replace(m[0],' ');}
    else if((m=l.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;k=y+'-'+pad(+m[2])+'-'+pad(+m[1]);rest=l.replace(m[0],' ');}
    else if((m=l.toLowerCase().match(/(\d{1,2})\s+([a-zéû]+)\.?\s+(\d{4})/))){const mo=MO[m[2].slice(0,4)]||MO[m[2].slice(0,3)];if(mo){k=m[3]+'-'+pad(mo)+'-'+pad(+m[1]);rest=l.toLowerCase().replace(m[0],' ');}}
    if(!k)return;
    rest=rest.replace(/à\s*\d{1,2}[:h]\d{2}/gi,' ').replace(/\b\d{1,2}:\d{2}(:\d{2})?\b/g,' ');
    const nums=(rest.match(/\d[\d\s  ]*(?:[.,]\d+)?/g)||[]).map(x=>Math.round(parseFloat(x.replace(/[\s  ]/g,'').replace(',','.')))).filter(n=>n>=0&&n<200000);
    if(!nums.length)return;const v=Math.max(...nums);
    out[k]=Math.max(out[k]||0,v);
  });
  return out;
}
async function parseHealthXml(file,onProg){
  /* lecture par morceaux : supporte les gros export.xml de l'app Santé sans saturer la mémoire */
  const per={},CH=4*1024*1024,dec=new TextDecoder();let pos=0,carry='';
  const re=/<Record type="HKQuantityTypeIdentifierStepCount"[^>]*?sourceName="([^"]*)"[^>]*?startDate="(\d{4}-\d{2}-\d{2})[^"]*"[^>]*?value="([\d.]+)"/g;
  while(pos<file.size){
    const buf=await file.slice(pos,pos+CH).arrayBuffer();pos+=CH;
    let txt=carry+dec.decode(buf,{stream:pos<file.size});
    const cut=txt.lastIndexOf('<Record');carry=cut>0&&pos<file.size?txt.slice(cut):'';if(carry)txt=txt.slice(0,cut);
    let m;re.lastIndex=0;while((m=re.exec(txt))){const k=m[2],src=m[1],v=+m[3];(per[k]=per[k]||{})[src]=(per[k][src]||0)+v;}
    if(onProg)onProg(Math.min(pos/file.size,1));
  }
  const out={};Object.keys(per).forEach(k=>{out[k]=Math.round(Math.max(...Object.values(per[k])));});
  return out;
}

const goalRate=()=>{const t=S.goalT;return(t.rate!=null&&t.rate!=='')?+t.rate:Math.round(blended().r*10)/10;};
const goalInit=()=>{const t=S.goalT;return(t.init!=null&&t.init!=='')?+t.init:(S.proj.init||0);};
function goalCalc(){
  const t=S.goalT,y=Math.min(Math.max(Math.round(t.years)||1,1),50),n=y*12,rate=goalRate(),r=Math.pow(1+rate/100,1/12)-1,init=goalInit(),T=+t.target||0,dca=S.dca||0;
  const g=Math.pow(1+r,n);
  const need=r>0?Math.max((T-init*g)*r/(g-1),0):Math.max((T-init)/n,0);
  const path=pm=>{let v=init;const o=[v];for(let m=1;m<=n;m++){v=v*(1+r)+pm;if(m%12===0)o.push(v);}return o;};
  let months=init>=T?0:null;if(months==null){let v=init;for(let m=1;m<=1200;m++){v=v*(1+r)+dca;if(v>=T){months=m;break;}}}
  const needFor=yy=>{const nn=yy*12,gg=Math.pow(1+r,nn);return r>0?Math.max((T-init*gg)*r/(gg-1),0):Math.max((T-init)/nn,0);};
  return {y,n,rate,r,init,T,dca,need,pn:path(need),pd:path(dca),months,needFor};
}

const lineRate=l=>(l.r!=null&&l.r!==''&&isFinite(l.r))?+l.r:(S.ret[l.cls]||0);
function mix(){
  const tot=pctTot(),ct={};CLASSES.forEach(c=>ct[c]=0);
  S.lines.forEach(l=>{ct[l.cls]+=lw(l);});
  if(tot<=0)return {tot:0,ct,sh:{ETF:0,Actions:0,Crypto:0},empty:true};
  const sh={};CLASSES.forEach(c=>sh[c]=ct[c]/tot);
  return {tot,ct,sh,empty:false};
}
function blended(){
  const m=mix();
  if(m.empty)return {r:S.ret.ETF,sp:S.spread.ETF,m};
  return {r:sum(S.lines.map(l=>lw(l)*lineRate(l)))/m.tot,sp:sum(S.lines.map(l=>lw(l)*(S.spread[l.cls]||0)))/m.tot,m};
}
function project(init,monthly,years,r){
  const rm=Math.pow(1+r/100,1/12)-1;let v=init;const out=[v];
  for(let y=1;y<=years;y++){for(let i=0;i<12;i++)v=v*(1+rm)+monthly;out.push(v);}
  return out;
}

const LCOL=['#0FA97A','#0A84FF','#FF9500','#AF52DE','#FF2D55','#32ADE6','#F5B400','#8E8E93'];
function evCalc(y){
  const tot=pctTot(),lines=tot>0?S.lines:[{id:'x',name:'ETF monde',cls:'ETF',pct:100}],T=tot>0?tot:100;
  const init=S.proj.init||0,dca=S.dca||0;
  const layers=lines.map((l,i)=>{const sh=lw(l)/T,r=lineRate(l),sp=S.spread[l.cls]||0;
    return {name:l.name,c:LCOL[i%LCOL.length],cls:l.cls,sh,v:project(init*sh,dca*sh,y,r),lo:project(init*sh,dca*sh,y,Math.max(r-sp,-5)),hi:project(init*sh,dca*sh,y,r+sp)};});
  const sumAt=(k,i)=>sum(layers.map(L=>L[k][i]));
  const mid=layers[0].v.map((_,i)=>sumAt('v',i)),lo=mid.map((_,i)=>sumAt('lo',i)),hi=mid.map((_,i)=>sumAt('hi',i));
  const versed=mid.map((_,i)=>init+dca*12*i);
  return {layers,mid,lo,hi,versed,empty:tot<=0};
}
function stackArea(ev,y,reveal){

  const paths=ev.layers.map((L,li)=>{
    const top=cum[li],bot=li?cum[li-1]:ev.mid.map(()=>0);
    const up=top.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    const dn=bot.map((v,i)=>'L'+X(n-1-i).toFixed(1)+' '+Y(bot[n-1-i]).toFixed(1)).join(' ');
    return `<path d="${up} ${dn} Z" fill="${L.c}" fill-opacity=".88"/>`;}).join('');
  const line=(arr,c,dash,w)=>`<path d="${arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="${w||1.6}" ${dash?'stroke-dasharray="5 4"':''} stroke-linecap="round" stroke-linejoin="round"/>`;
  const step=Math.ceil(n/6);
  const labs=Array.from({length:n},(_,i)=>(i%step===0||i===n-1)?`<text x="${X(i)}" y="${H-6}" font-size="10" text-anchor="middle" style="fill:var(--muted)">${i===0?'0':i+' a'}</text>`:'').join('');
  const grid=[.25,.5,.75,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" style="stroke:var(--border)"/>`).join('');
  return `<svg class="${reveal?'reveal':''}" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Évolution possible du portefeuille"${scrubData(W,pt,H-pb,Array.from({length:n},(_,i)=>X(i)),Array.from({length:n},(_,i)=>`<b>${i?'Dans '+i+' an'+(i>1?'s':''):'Aujourd\'hui'}</b><span>Probable ${esc(fmtK(ev.mid[i]))}</span><span>Versé ${esc(fmtK(ev.versed[i]))}</span><span>Fourchette ${esc(fmtK(ev.lo[i]))} – ${esc(fmtK(ev.hi[i]))}</span>`))}>${grid}${paths}${line(ev.versed,'#fff',1,1.8)}${line(ev.hi,'var(--text)',1,1.2)}${line(ev.lo,'var(--text)',1,1.2)}<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" style="stroke:var(--border)"/>${labs}</svg>`;
}

}

function ciRun(c){
  const y=Math.min(Math.max(Math.round(c.years)||1,1),60),f=c.freq||12;
  const rm=Math.pow(1+(c.rate||0)/100/f,f/12)-1;
  let v=c.init||0,ver=c.init||0;const rows=[{y:0,ver,v,int:0}];
  for(let a=1;a<=y;a++){for(let i=0;i<12;i++){v=v*(1+rm)+(c.monthly||0);ver+=(c.monthly||0);}rows.push({y:a,ver,v,int:v-ver});}
  const rr=(c.rate||0)/100,mo=c.monthly||0,simple=(c.init||0)*(1+rr*y)+mo*12*y+mo*rr*y*(12*y-1)/2;
  return {rows,y,fin:v,ver,int:v-ver,simple};
}
function ciChart(rows){
  const W=340,H=200,pl=6,pr=6,pt=12,pb=22,n=rows.length-1;
  const mx=Math.max(...rows.map(r=>r.v),1),bw=(W-pl-pr)/n,w=Math.max(Math.min(bw*.7,26),2);
  const Y=v=>pt+(H-pt-pb)*(1-v/mx);
  const step=Math.ceil(n/8);

async function pdfLines(blob){
  const L=await loadPdfJs(),doc=await L.getDocument({data:await blob.arrayBuffer()}).promise,out=[];
  for(let i=1;i<=Math.min(doc.numPages,3);i++){
    const tc=await (await doc.getPage(i)).getTextContent(),rows=[];
    tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r){r={y,it:[]};rows.push(r);}r.it.push({x,s:it.str});});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.it.sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim()));
  }
  return out;
}
const AMT='(\\d{1,3}(?:[ \\u00a0\\u202f]\\d{3})*(?:[.,]\\d{1,2})?)';
const pAmt=s=>{if(s==null)return null;s=String(s).replace(/[   ]/g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:null;};
function parsePay(lines){
  const T=lines.join(' \n ').replace(/[  ]/g,' '),F=T.replace(/\s*\n\s*/g,' ');
  const g=(re)=>{const m=F.match(re);return m?pAmt(m[1]):null;};
  const d={};
  let m=F.match(/Du\s+(\d{2})\/(\d{2})\/(\d{4})\s+au\s+(\d{2})\/(\d{2})\/(\d{4})/i);
  if(m)d.m=m[3]+'-'+m[2];
  else{const MO={janvier:1,'février':2,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,'août':8,aout:8,septembre:9,octobre:10,novembre:11,'décembre':12,decembre:12};
    const mm=F.toLowerCase().match(/(janvier|f[ée]vrier|mars|avril|mai|juin|juillet|ao[uû]t|septembre|octobre|novembre|d[ée]cembre)\s+(20\d{2})/);
    if(mm)d.m=mm[2]+'-'+pad(MO[mm[1]]||MO[mm[1].normalize('NFD').replace(/[̀-ͯ]/g,'')]);}
  d.brut=g(new RegExp('(?:Salaire\\s+)?brut(?:\\s+total)?\\s*:?\\s*'+AMT+'\\s*€','i'))??g(new RegExp('R[ÉE]MUN[ÉE]RATION BRUTE\\s+'+AMT,'i'));
  d.charges=g(new RegExp('Charges salariales\\s*:?\\s*'+AMT,'i'))??g(new RegExp('TOTAL DES COTISATIONS ET CONTRIBUTIONS\\s+'+AMT,'i'));
  d.netAvant=g(new RegExp('Net à payer avant imp[ôo]t(?: sur le revenu)?\\s*:?\\s*'+AMT,'i'));
  d.impot=g(new RegExp('Imp[ôo]t (?:sur le revenu )?prélevé(?: à la source)?\\s*:?\\s*-?\\s*'+AMT,'i'));
  d.netSocial=g(new RegExp('Montant net social\\s*:?\\s*'+AMT,'i'));
  d.net=g(new RegExp('Net à payer après imp[ôo]t\\s*:?\\s*'+AMT,'i'))??g(new RegExp('Net payé\\s*:?\\s*'+AMT,'i'))??g(new RegExp('Salaire net à payer\\s+'+AMT+'\\s*€','i'));
  m=F.match(new RegExp('Assiette de l.imp[ôo]t.*?Cumul imp[ôo]t prélevé.*?'+AMT+'\\s*€\\s+(\\d{1,2}(?:[.,]\\d{1,2})?)\\s*%\\s+'+AMT+'\\s*€?\\s+'+AMT,'i'));
  if(m){d.imposable=pAmt(m[1]);d.taux=pAmt(m[2]);d.cumImposable=pAmt(m[3]);d.cumImpot=pAmt(m[4]);}
  else{d.taux=g(/Taux (?:neutre|personnalis[ée]|PAS)?\s*:?\s*(\d{1,2}(?:[.,]\d{1,2})?)\s*%/i);d.imposable=g(new RegExp('Net imposable\\s*:?\\s*'+AMT,'i'));}
  m=F.match(new RegExp('TOTAL DES COTISATIONS ET CONTRIBUTIONS\\s+'+AMT+'\\s+'+AMT,'i'));if(m)d.patronal=pAmt(m[2]);
  d.cout=g(new RegExp('Co[ûu]t (?:global|total employeur)\\s*:?\\s*'+AMT,'i'));
  m=F.match(/Cong[ée]s pay[ée]s[^]{0,140}?(\d+[.,]\d+)\s*jours/i);if(m)d.cp=pAmt(m[1]);
  m=F.match(/\bRTT\b[^]{0,200}?(\d+[.,]\d+)\s*jours/i);if(m)d.rtt=pAmt(m[1]);
  if(d.net==null&&d.netAvant!=null&&d.impot!=null)d.net=Math.round((d.netAvant-d.impot)*100)/100;
  if(d.cout==null&&d.brut!=null&&d.patronal!=null)d.cout=Math.round((d.brut+d.patronal)*100)/100;
  Object.keys(d).forEach(k=>{if(d[k]==null)delete d[k];});
  return d;
}
async function readPay(blob){try{return parsePay(await pdfLines(blob));}catch(e){return null;}}
let _payScan=false;
function scanPays(){
  if(_payScan)return;const todo=S.pays.filter(p=>!p.d&&!p.tried);if(!todo.length)return;_payScan=true;
  (async()=>{let n=0;for(const p of todo){p.tried=1;try{const b=await idb.get(p.id);if(!b)continue;const d=await readPay(b);if(d&&(d.net||d.brut)){applyPay(p,d);n++;}}catch(e){}}
    _payScan=false;save();if(n){toast(n+' fiche'+(n>1?'s':'')+' lue'+(n>1?'s':''));if(ui.tab==='money'&&ui.money==='inc')render();}})();
}
function applyPay(p,d){
  p.d=d;if(d.m&&!p.mFixed)p.m=d.m;if(d.net)p.net=d.net;
  if(p.net){const ex=S.incomes.find(i=>i.m===p.m&&i.source===p.source);if(ex)ex.amount=p.net;else S.incomes.push({id:uid(),m:p.m,amount:p.net,source:p.source});}
}
const payWithD=()=>S.pays.filter(p=>p.d&&(p.d.net||p.d.brut)).sort((a,b)=>a.m<b.m?-1:1);
const f2=n=>(isFinite(n)?n:0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';

function periodDays(){return ui.per==='all'?null:lastDays(+ui.per);}
function groupStats(days){
  const ws=days?inDays(days):S.workouts;
  const g={};GROUPS.forEach(x=>g[x]={sets:0,vol:0,last:'',ex:{}});
  const bump=(grp,n,d)=>{if(n>0){g[grp].sets+=n;if(d>g[grp].last)g[grp].last=d;}};
  ws.forEach(w=>{
    if(w.type==='muscu'){exsOf(w).forEach(e=>{const k=g[e.group]||(g[e.group]={sets:0,vol:0,last:'',ex:{}});
      k.sets+=e.sets.length;k.vol+=sum(e.sets.map(t=>(t.kg||0)*(t.reps||0)));if(w.date>k.last)k.last=w.date;k.ex[e.name]=(k.ex[e.name]||0)+e.sets.length;});}
    else if(w.type==='course'){bump('Jambes',Math.round(w.min/8),w.date);bump('Abdos',Math.round(w.min/40),w.date);}
    else if(w.type==='padel'){bump('Jambes',Math.round(w.min/15),w.date);bump('Bras',Math.round(w.min/30),w.date);bump('Épaules',Math.round(w.min/30),w.date);}
    else if(w.type==='bodyboard'){bump('Bras',Math.round(w.min/20),w.date);bump('Épaules',Math.round(w.min/20),w.date);bump('Jambes',Math.round(w.min/30),w.date);bump('Dos',Math.round(w.min/40),w.date);}
  });
  return g;
}

  else TPL_O.forEach((x,i)=>{if(x.t===t)out.push({ref:'o:'+i,n:x.n,d:x.d});});
  S.templates.filter(x=>x.type===t).forEach(x=>out.push({ref:'c:'+x.id,n:x.name,d:x.type==='muscu'?x.exs.length+' exercices':(x.min?x.min+' min':'')+(x.dist?' · '+x.dist+' km':''),custom:x.id}));

function applyTpl(ref){

  if(k==='m'){d.exs=TPL_M[+id].x.map(([n,s,r])=>exFromTpl(n,s,r));}
  else if(k==='o'){const t=TPL_O[+id];d.min=t.min;if(t.fmt)d.fmt=t.fmt;}
