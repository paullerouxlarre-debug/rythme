<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rythme</title>
<style>
/* =====================================================================
   Rythme v3 : design système
   Principes : lisibilité d'abord (texte 16 px, contrastes AA, cibles de 44 px),
   une couleur par domaine (Boulot, Planning, Sport, Nutrition, Argent),
   cartes claires et plates, mouvements courts (< 250 ms) et sans rebond.
   ===================================================================== */
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#F0F1F4; --surface-3:#E2E5EA;
  --text:#14161B; --muted:#5B6270; --faint:#868C98; --sep:rgba(20,22,27,.09); --border:rgba(20,22,27,.09);
  --accent:#3B5BDB; --on-accent:#FFFFFF;
  --accent-ink:var(--accent); --accent-soft:color-mix(in srgb,var(--accent) 11%,var(--surface));
  --positive:#2B8A3E; --negative:#D9363E; --warning:#B95F00; --gold:#B95F00; --clay:var(--accent);
  --c-plan:#0C8599; --c-sport:#E8590C; --c-food:#2F9E44; --c-money:#7048E8;
  --h-plan:#0B7285; --h-sport:#C2410C; --h-food:#2B7A3B; --h-money:#6741D9;
  --shadow:0 1px 2px rgba(20,22,27,.04),0 4px 14px rgba(20,22,27,.04);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
  --font-body:var(--font); --serif:var(--font-display);
  --ease:cubic-bezier(.2,.7,.3,1);
  --tc:var(--accent); --tc2:color-mix(in srgb,var(--tc) 50%,var(--surface)); --hero:color-mix(in srgb,var(--accent) 86%,#000);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0E11; --surface:#17191E; --surface-2:#1F2228; --surface-3:#2C3038;
    --text:#EEF0F4; --muted:#A3A9B4; --faint:#717784; --sep:rgba(255,255,255,.08); --border:rgba(255,255,255,.08);
    --accent-ink:color-mix(in srgb,var(--accent) 62%,#fff); --accent-soft:color-mix(in srgb,var(--accent) 20%,var(--surface));
    --positive:#51CF66; --negative:#FF6B6B; --warning:#FFA94D; --gold:#FFA94D;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0E11; --surface:#17191E; --surface-2:#1F2228; --surface-3:#2C3038;
  --text:#EEF0F4; --muted:#A3A9B4; --faint:#717784; --sep:rgba(255,255,255,.08); --border:rgba(255,255,255,.08);
  --accent-ink:color-mix(in srgb,var(--accent) 62%,#fff); --accent-soft:color-mix(in srgb,var(--accent) 20%,var(--surface));
  --positive:#51CF66; --negative:#FF6B6B; --warning:#FFA94D; --gold:#FFA94D;
  --shadow:none; color-scheme:dark;
}
/* une couleur par domaine : graphiques, anneaux et carte de résumé */
body[data-tab=today]{ --tc:var(--accent); --hero:color-mix(in srgb,var(--accent) 86%,#000); }
body[data-tab=plan]{ --tc:var(--c-plan); --hero:var(--h-plan); }
body[data-tab=sport]{ --tc:var(--c-sport); --hero:var(--h-sport); }
body[data-tab=food]{ --tc:var(--c-food); --hero:var(--h-food); }
body[data-tab=money]{ --tc:var(--c-money); --hero:var(--h-money); }

/* ---------- base ---------- */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
html,body{ overscroll-behavior:none; touch-action:pan-x pan-y; }
body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:40; }
button,input,select,textarea{ font-family:inherit; color:inherit; }
button{ cursor:pointer; }
input,textarea,select,[contenteditable]{ -webkit-user-select:text; user-select:text; font-size:16px!important; }
[hidden]{ display:none!important; }
html,body,*{ scrollbar-width:none; }
*::-webkit-scrollbar{ display:none; width:0; height:0; }
a{ color:var(--accent-ink); }
:focus-visible{ outline:2px solid var(--accent-ink); outline-offset:2px; }
.ic{ fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.cap1::first-letter{ text-transform:uppercase; }
.muted{ color:var(--muted); } .mono{ font-variant-numeric:tabular-nums; }
.pos{ color:var(--positive); } .neg{ color:var(--negative); }

/* ---------- mise en page ---------- */
.app{ max-width:560px; margin:0 auto; padding-block:0 calc(104px + env(safe-area-inset-bottom,0px)); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.topbar{ display:flex; justify-content:space-between; align-items:center; padding:12px 0 0; min-height:52px; }
.greeting{ margin:0; font-size:14px; color:var(--muted); font-weight:500; }
.avbtn{ width:40px; height:40px; border-radius:50%; border:1px solid var(--sep); background:var(--surface); color:var(--text); font-weight:650; font-size:16px; display:flex; align-items:center; justify-content:center; }
h1.page{ font-family:var(--font-display); font-weight:700; font-size:32px; line-height:1.1; letter-spacing:-.02em; margin:2px 0 4px; }
.pdate{ margin:0 0 18px; font-size:15px; color:var(--muted); font-weight:500; }
h1.page + :not(.pdate){ margin-top:14px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:30px 2px 12px; min-height:28px; }
.section-title{ font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.01em; margin:0; }
.section-sub{ font-size:14px; color:var(--muted); text-decoration:none; font-weight:500; text-align:right; }
a.section-sub{ color:var(--accent-ink); font-weight:600; padding:8px 0; }
.sublabel{ font-size:14px; font-weight:600; color:var(--muted); margin:20px 2px 8px; }
.note{ font-size:13.5px; color:var(--muted); line-height:1.5; margin:10px 2px 0; }
.empty{ padding:20px 16px; color:var(--muted); font-size:15px; line-height:1.5; }
.callout{ background:var(--accent-soft); border-radius:14px; padding:14px; font-size:15px; line-height:1.5; }

/* ---------- surfaces ---------- */
.card,.row-list,.form-panel,.toolrow,.mxpan,.qtile,.daycell,.mday,.tile{ background:var(--surface); border:1px solid var(--sep); box-shadow:var(--shadow); }
.card{ border-radius:20px; padding:16px; }
.card + .card{ margin-top:12px; }
.row-list{ border-radius:18px; overflow:hidden; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; min-height:56px; border-bottom:1px solid var(--sep); }
.row:last-child{ border-bottom:none; }
.row[data-act]{ cursor:pointer; }
.row-title{ font-size:16px; font-weight:600; line-height:1.3; }
.row-sub{ font-size:13.5px; color:var(--muted); margin-top:2px; }
.row-value{ font-size:16px; font-weight:600; text-align:right; white-space:nowrap; }
.row-change{ font-size:13px; margin-top:2px; text-align:right; }
.row-del{ width:36px; height:36px; border:none; background:none; color:var(--faint); font-size:22px; line-height:1; border-radius:50%; flex:none; }
.evbar{ width:4px; align-self:stretch; border-radius:2px; flex:none; }
.src{ font-size:11.5px; font-weight:700; color:#E8590C; margin-left:6px; }
.dot{ width:10px; height:10px; border-radius:50%; flex:none; display:inline-block; }
.tag{ font-size:12.5px; font-weight:650; padding:3px 8px; border-radius:7px; }
.tag.pos{ background:color-mix(in srgb,var(--positive) 14%,transparent); color:var(--positive); }
.tag.neg{ background:color-mix(in srgb,var(--negative) 14%,transparent); color:var(--negative); }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat .k{ font-size:13.5px; color:var(--muted); margin-bottom:4px; }
.stat .v{ font-size:22px; font-weight:700; letter-spacing:-.01em; color:var(--text); }
.stat .s{ font-size:13px; color:var(--muted); margin-top:3px; line-height:1.35; }
.stat.box{ background:var(--surface); border:1px solid var(--sep); border-radius:16px; padding:14px; min-width:0; box-shadow:var(--shadow); }
.bignum{ font-family:var(--font-display); font-weight:700; font-size:40px; line-height:1.05; letter-spacing:-.02em; margin:0; }
.legend{ display:flex; flex-direction:column; gap:10px; font-size:15px; }
.legend .li{ display:flex; align-items:center; gap:10px; } .legend .li .n{ flex:1; } .legend .li .p{ font-size:14px; color:var(--muted); }
.lg{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); margin-right:8px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.alloc-bar{ display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--surface-3); }
.progress{ height:8px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
.progress>div{ height:100%; border-radius:5px; background:var(--tc); transition:width .4s var(--ease); }

/* ---------- contrôles ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:48px; border:none; border-radius:14px; padding:12px 16px; font-size:16px; font-weight:600; background:var(--surface-2); color:var(--text); transition:transform .08s ease,opacity .15s; }
.btn:active,.chip:active,.iconbtn:active,.navbtn:active,.mxs:active,.pbtn:active,.toolrow:active,.qtile:active,.mday:active,.daycell:active,.pdb:active{ transform:scale(.97); }
.btn-primary{ background:var(--accent); color:var(--on-accent); flex:1; }
.btn-ghost{ background:var(--accent-soft); color:var(--accent-ink); }
.btn.danger,.btn-ghost.danger{ background:color-mix(in srgb,var(--negative) 12%,transparent); color:var(--negative); }
.btn[disabled]{ opacity:.45; }
.form-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.iconbtn,.navbtn{ width:40px; height:40px; border-radius:50%; border:1px solid var(--sep); background:var(--surface); color:var(--text); font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none; }
.back{ display:inline-flex; align-items:center; gap:2px; border:none; background:none; color:var(--accent-ink); font-weight:600; font-size:17px; padding:10px 0 6px; min-height:44px; }
.chip{ display:inline-flex; align-items:center; gap:6px; min-height:36px; border:1px solid var(--sep); background:var(--surface); color:var(--text); border-radius:999px; padding:7px 14px; font-size:14px; font-weight:600; }
.chip.on{ background:var(--text); color:var(--bg); border-color:transparent; }
.chip.static{ cursor:default; min-height:30px; padding:5px 12px; font-size:13.5px; background:var(--surface-2); }
.chip.static.on{ background:var(--text); color:var(--bg); }
.chip.off{ opacity:.45; }
.chip .ic{ vertical-align:-3px; }
.seg{ display:flex; background:var(--surface-3); border-radius:12px; padding:3px; margin:0 0 12px; gap:2px; }
.seg button{ flex:1; min-height:36px; border:none; background:none; padding:6px 4px; border-radius:9px; font-size:14px; font-weight:600; color:var(--muted); white-space:nowrap; transition:background .15s,color .15s; }
.seg button.on{ background:var(--surface); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.bdg{ display:inline-block; margin-left:5px; min-width:18px; padding:0 5px; border-radius:9px; background:var(--negative); color:#fff; font-style:normal; font-size:11.5px; line-height:18px; font-weight:700; }

/* ---------- formulaires ---------- */
.form-panel{ border-radius:18px; padding:16px; margin-bottom:14px; }
.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:end; }
.field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.field.wide{ grid-column:1/-1; }
.field label{ font-size:13.5px; color:var(--muted); font-weight:500; line-height:1.25; }
.field input,.field select,.inl,.plain,.mini,.wform input,.mxin input,textarea.code{ width:100%; min-width:0; max-width:100%; border:1px solid transparent; background:var(--surface-2); color:var(--text); border-radius:12px; padding:11px 12px; outline:none; }
.field input,.field select{ height:48px; line-height:1.2; }
.field input:focus,.field select:focus,.inl:focus,.wform input:focus,.mxin input:focus,textarea.code:focus,.mini:focus{ border-color:var(--accent-ink); background:var(--surface); }
.field select{ -webkit-appearance:none; appearance:none; padding-right:34px; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%; background-size:5px 5px; background-repeat:no-repeat; }
input[type=date],input[type=time],input[type=month]{ -webkit-appearance:none; appearance:none; display:block; text-align:left; }
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{ text-align:left; margin:0; }
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{ opacity:.5; }
input[type=file]{ font-size:14px!important; max-width:100%; }
input[type=checkbox],input[type=range]{ accent-color:var(--accent); }
input[type=range]{ width:100%; min-width:0; flex:1; }
.inl{ flex:1; width:auto; } .plain{ margin-bottom:8px; }
.mini{ width:80px; text-align:right; padding:8px; }
textarea.code{ font:13px ui-monospace,Menlo,monospace; resize:none; word-break:break-all; }

/* ---------- carte de résumé (une par onglet, couleur du domaine) ---------- */
.hero2{ position:relative; border-radius:24px; padding:18px; margin-bottom:14px; background:var(--hero); color:#fff; }
.hero2 .sm{ font-size:13.5px; font-weight:600; color:rgba(255,255,255,.82); }
.hero2 .big{ font-family:var(--font-display); font-weight:700; font-size:36px; letter-spacing:-.02em; line-height:1.08; margin:2px 0; }
.hero2 .mini3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); margin-top:16px; padding-top:12px; border-top:1px solid rgba(255,255,255,.22); }
.hero2 .mini3>div{ min-width:0; padding:0 10px; border-left:1px solid rgba(255,255,255,.22); }
.hero2 .mini3>div:first-child{ border-left:none; padding-left:0; }
.hero2 .mini3 small{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.82); }
.hero2 .mini3 small i{ width:8px; height:8px; border-radius:50%; flex:none; }
.hero2 .mini3 b{ display:block; font-size:17px; font-weight:700; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hero2 .muted,.hero2 .stat .k,.hero2 .field label,.hero2 .note{ color:rgba(255,255,255,.82); }
.hero2 .stat .v{ color:#fff; }
.hero2 .chip.static{ background:rgba(255,255,255,.18); color:#fff; border-color:transparent; }
.hero2 .chip{ background:rgba(255,255,255,.16); color:#fff; border-color:transparent; }
.hero2 .chip.on{ background:#fff; color:var(--hero); }
.hero2 .inl{ background:rgba(255,255,255,.18); color:#fff; } .hero2 .inl::placeholder{ color:rgba(255,255,255,.7); }
.hero2 .iconbtn,.hero2 .navbtn{ background:rgba(255,255,255,.18); color:#fff; border-color:transparent; }
.hero2 .btn-primary{ background:#fff; color:var(--hero); }
.hero2 .btn-ghost{ background:rgba(255,255,255,.18); color:#fff; }
.hero2 .seg{ background:rgba(0,0,0,.18); } .hero2 .seg button{ color:rgba(255,255,255,.85); } .hero2 .seg button.on{ background:#fff; color:var(--hero); }
.hero2 a{ color:#fff; }
.stp{ display:flex; gap:8px; flex:none; }
.stp button{ width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.2); color:#fff; font-size:22px; font-weight:600; line-height:1; }
.tday-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.arings{ flex:none; overflow:visible; }
.tsum{ flex:1; min-width:0; display:grid; gap:10px; }
.tsum small{ display:flex; align-items:center; gap:7px; font-size:13.5px; font-weight:600; color:rgba(255,255,255,.85); }
.tsum small i{ width:9px; height:9px; border-radius:50%; flex:none; }
.tsum b{ display:block; font-size:18px; font-weight:700; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* anneaux et grilles */
.rw{ position:relative; width:92px; height:92px; margin:0 auto; max-width:100%; }
.rc{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:700; }
.rings3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; }
.rl{ font-size:13px; font-weight:600; margin-top:8px; line-height:1.35; }
.heat12{ display:grid; grid-template-columns:repeat(12,1fr); gap:4px; }
.heat12 i{ aspect-ratio:1; border-radius:5px; background:var(--surface-3); display:block; }
.heat12 i.fut{ opacity:.35; }
.heatw{ display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; grid-auto-columns:1fr; gap:4px; }
.heatw i{ aspect-ratio:1; border-radius:5px; background:var(--surface-3); display:block; }
.kpis{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:12px; }
.kpis>div{ background:var(--surface); border:1px solid var(--sep); border-radius:14px; padding:10px 6px; text-align:center; min-width:0; }
.kpis small{ display:block; font-size:12px; color:var(--muted); font-weight:600; }
.kpis b{ font-size:16px; font-weight:700; }
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.tile{ text-align:left; border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:3px; min-width:0; position:relative; }
.tile b{ font-size:16px; } .tile span{ font-size:13px; color:var(--muted); }

/* ---------- planning ---------- */
.wkhead{ display:flex; align-items:center; justify-content:space-between; margin:4px 0 12px; }
.wkhead b{ font-family:var(--font-display); font-size:20px; font-weight:700; }
.wkstrip{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.daycell{ border-radius:14px; padding:8px 0 7px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text); min-width:0; }
.daycell span{ font-size:12px; color:var(--muted); font-weight:600; }
.daycell b{ font-size:17px; font-weight:700; }
.daycell i{ height:6px; display:flex; gap:2px; }
.daycell i u,.mday i u{ width:6px; height:6px; border-radius:50%; display:block; }
.daycell.tod{ background:var(--text); color:var(--bg); border-color:transparent; }
.daycell.tod span{ color:var(--bg); opacity:.75; }
.mhead{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; font-size:12.5px; color:var(--muted); text-align:center; margin-bottom:6px; font-weight:600; }
.mgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.mday{ border-radius:12px; min-height:52px; padding:7px 2px 6px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; min-width:0; color:var(--text); box-shadow:none; }
.mday b{ font-size:15px; font-weight:600; }
.mday i{ height:6px; display:flex; gap:2px; }
.mday.out{ opacity:.35; }
.mday.sel{ background:var(--text)!important; color:var(--bg); border-color:transparent; }
.mday.tod:not(.sel){ border:2px solid var(--tc); }
.acc{ border-bottom:1px solid var(--sep); }
.acc:last-child{ border-bottom:none; }
.acc summary{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:15px 16px; min-height:52px; font-weight:600; font-size:16px; list-style:none; cursor:pointer; }
.acc summary::after{ content:""; width:8px; height:8px; border-right:2px solid var(--faint); border-bottom:2px solid var(--faint); transform:rotate(45deg); margin-right:4px; transition:transform .2s; }
.acc[open] summary::after{ transform:rotate(225deg); }
.acc summary::-webkit-details-marker{ display:none; }
.acc p{ margin:0 16px 16px; font-size:15px; line-height:1.55; color:var(--muted); }

/* ---------- pointage ---------- */
.pdue{ display:flex; align-items:center; gap:12px; padding:12px 12px 12px 14px; margin:0 0 14px; border-radius:18px; background:var(--surface); border:1.5px solid var(--accent); }
.pdue.late{ border-color:var(--warning); }
.pdue.soon{ border-color:var(--sep); }
.pdi{ width:40px; height:40px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--accent-soft); color:var(--accent-ink); }
.pdue.late .pdi{ background:color-mix(in srgb,var(--warning) 14%,transparent); color:var(--warning); }
.pdt{ flex:1; min-width:0; } .pdt b{ display:block; font-size:15.5px; font-weight:650; line-height:1.25; } .pdt small{ display:block; font-size:13px; color:var(--muted); margin-top:2px; }
.pdb{ flex:none; min-height:44px; border:none; border-radius:12px; padding:10px 14px; background:var(--accent); color:var(--on-accent); font-weight:650; font-size:15px; }

.mxpan b{ display:block; font-size:14px; font-weight:650; } .mxpan small{ display:block; font-size:12.5px; color:var(--muted); margin-top:2px; line-height:1.3; }
.mxpan.on{ background:var(--text); color:var(--bg); border-color:transparent; } .mxpan.on small{ color:color-mix(in srgb,var(--bg) 72%,transparent); }

/* ---------- nutrition ---------- */

.wtop b{ display:block; font-family:var(--font-display); font-weight:700; font-size:36px; letter-spacing:-.02em; } .wtop b span{ font-size:18px; color:var(--muted); font-weight:600; }
.wtr{ font-size:13.5px; font-weight:650; border-radius:8px; padding:4px 8px; background:var(--surface-2); } .wtr.dn{ color:var(--positive); } .wtr.up{ color:var(--warning); }

/* ---------- argent ---------- */
.mtiles{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.mtile{ border:none; text-align:left; color:#fff; border-radius:20px; padding:14px; min-height:140px; display:flex; flex-direction:column; justify-content:space-between; min-width:0; background:color-mix(in srgb,var(--c1) 68%,#000); }
.mtile small{ display:block; font-size:13px; font-weight:600; color:rgba(255,255,255,.85); } .mtile b{ font-size:21px; font-weight:700; display:block; line-height:1.15; }
.mtile .viz{ margin:4px 0 10px; }
.toolrow{ width:100%; display:flex; align-items:center; gap:12px; border-radius:18px; padding:12px 14px; color:var(--text); margin-top:10px; text-align:left; min-height:64px; font:inherit; }

.tico svg{ width:24px; height:24px; fill:none; stroke:var(--tc); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.chev{ color:var(--faint); font-size:26px; line-height:1; flex:none; }
.payc{ padding:16px; }
.payh{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.payh small{ display:block; font-size:13px; color:var(--muted); font-weight:600; }
.payh b{ display:block; font-family:var(--font-display); font-weight:700; font-size:32px; margin-top:2px; }
.paytx{ font-size:13px; font-weight:650; color:var(--tc); background:color-mix(in srgb,var(--tc) 12%,transparent); border-radius:8px; padding:4px 8px; white-space:nowrap; }
.payflow{ margin-top:12px; border-top:1px solid var(--sep); }

.payflow span{ color:var(--muted); } .payflow em{ font-style:normal; font-size:13px; opacity:.8; margin-left:4px; }
.payflow b{ font-weight:600; } .payflow .tot span{ color:var(--text); font-weight:650; } .payflow .tot b{ font-weight:700; }
.paybar{ height:8px; border-radius:5px; background:var(--surface-3); margin-top:14px; overflow:hidden; }
.paybar i{ display:block; height:100%; border-radius:5px; background:var(--tc); }

/* ---------- graphiques ---------- */
svg[data-scrub]{ touch-action:pan-y; cursor:crosshair; }
.scg line{ stroke:var(--text); stroke-width:1; stroke-dasharray:3 3; opacity:0; } .scg.on line{ opacity:.5; }
.sctip{ position:absolute; z-index:5; transform:translateY(-100%); opacity:0; pointer-events:none; background:var(--text); color:var(--bg); border-radius:10px; padding:7px 10px; font-size:13px; line-height:1.45; white-space:nowrap; transition:opacity .12s; }
.sctip.on{ opacity:1; }
.sctip b{ display:block; } .sctip span{ display:flex; align-items:center; gap:5px; } .sctip i{ width:7px; height:7px; border-radius:50%; flex:none; }

/* ---------- barre d'onglets ---------- */
nav.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:color-mix(in srgb,var(--surface) 86%,transparent); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-top:1px solid var(--sep); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
.tabbar-inner{ max-width:560px; margin:0 auto; display:flex; padding:6px 4px 4px; }
.tab{ position:relative; flex:1; min-width:0; min-height:50px; background:none; border:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px 0; color:var(--faint); }
.tab svg{ width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.tab span{ font-size:11px; font-weight:600; white-space:nowrap; }
.tab.on{ color:var(--accent-ink); }
.tab.on svg{ stroke-width:2.1; }
.tab.due::after{ content:""; position:absolute; top:4px; left:calc(50% + 10px); width:9px; height:9px; border-radius:50%; background:var(--negative); box-shadow:0 0 0 2px var(--surface); }

/* titre compact en haut quand on fait défiler */
.ctitle{ position:fixed; left:0; right:0; top:0; z-index:45; padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 10px; text-align:center; font-weight:650; font-size:17px; background:color-mix(in srgb,var(--bg) 86%,transparent); -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px); border-bottom:1px solid var(--sep); opacity:0; pointer-events:none; transition:opacity .15s; }
.ctitle.on{ opacity:1; pointer-events:auto; }

/* ---------- fenêtres ---------- */
.sheet{ position:fixed; inset:0; z-index:90; background:var(--bg); overflow:auto; padding-top:env(safe-area-inset-top,0px); animation:sheetin .24s var(--ease); }
.sheet.static{ animation:none; }
.sheet-in{ max-width:560px; margin:0 auto; padding-block:14px calc(40px + env(safe-area-inset-bottom,0px)); padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
.sheet-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.swatches{ display:flex; gap:12px; flex-wrap:wrap; }
.sw{ width:40px; height:40px; border-radius:50%; border:3px solid var(--surface); box-shadow:0 0 0 1px var(--sep); }
.sw.on{ box-shadow:0 0 0 2px var(--text); }
.cfm{ position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(0,0,0,.45); animation:cffade .16s ease; }
.cfm.out{ opacity:0; transition:opacity .16s; }
.cfbox{ width:100%; max-width:360px; background:var(--surface); border-radius:22px; padding:22px 18px 16px; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,.3); animation:cfin .2s var(--ease); }
.cfbox.shake{ animation:cfshake .4s ease; }
.cfi{ width:52px; height:52px; margin:0 auto 10px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb,var(--negative) 12%,transparent); color:var(--negative); }
.cfbox h3{ margin:0 0 8px; font-size:19px; }
.cfbox p{ margin:0 0 16px; font-size:15px; line-height:1.45; color:var(--muted); }
.cfrow{ display:flex; gap:8px; margin-top:10px; }
.cfrow .btn{ flex:1; }
.cfrow .cfdel{ background:var(--negative); color:#fff; }
.stepg{ max-width:400px; text-align:left; max-height:calc(100vh - 60px); overflow:auto; }
.stepg h3{ text-align:center; } .stepg p{ text-align:left; }
.stepg ol{ margin:0 0 12px; padding-left:20px; font-size:15px; line-height:1.5; } .stepg li{ margin-bottom:6px; }
.stepg code{ font-size:13px; background:var(--surface-2); padding:1px 5px; border-radius:5px; }
.pdfv{ position:fixed; inset:0; z-index:95; background:rgba(0,0,0,.92); overflow:auto; padding:calc(60px + env(safe-area-inset-top,0px)) 8px 24px; }
.pdfv canvas{ display:block; width:100%; max-width:760px; margin:0 auto 10px; background:#fff; border-radius:4px; }
.pdfv .x{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; z-index:96; flex:none; }
.pdfv .msg{ color:#fff; text-align:center; padding:40px 20px; font-size:15px; }
.fx{ position:fixed; inset:0; pointer-events:none; z-index:120; }
.toast{ position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); max-width:calc(100vw - 32px); background:#1B1D22; color:#F2F3F5; padding:12px 18px; border-radius:14px; font-weight:600; font-size:15px; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:toast 2.6s var(--ease) both; text-align:center; }
#landlock{ display:none; }
@media (orientation:landscape) and (max-height:520px){
  #landlock{ display:flex; position:fixed; inset:0; z-index:400; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:var(--bg); color:var(--text); text-align:center; padding:20px; }
  #landlock b{ font-size:22px; } #landlock span{ color:var(--muted); font-size:15px; }
  #landlock svg{ color:var(--accent-ink); }
  body{ overflow:hidden; }
}

/* ---------- mouvement : court, une seule entrée de page ---------- */
#main.enter{ animation:pagein .2s var(--ease) both; }
@keyframes pagein{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
@keyframes sheetin{ from{ transform:translateY(24px); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes cffade{ from{ opacity:0; } }
@keyframes cfin{ from{ opacity:0; transform:scale(.97); } }
@keyframes cfshake{ 25%,75%{ transform:translateX(-6px); } 50%{ transform:translateX(6px); } }
