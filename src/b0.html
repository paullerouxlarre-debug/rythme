<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rythme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
  /* Direction : app iOS. Gris système, cartes blanches arrondies, grands titres, barre d'onglets translucide.
     La couleur d'accent est choisie dans les réglages (variable --accent posée par le script). */
  :root{
    --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F2F2F7; --surface-3:#E5E5EA;
    --text:#000000; --muted:#8E8E93; --sep:rgba(60,60,67,.16); --border:rgba(60,60,67,.16);
    --accent:#1F9D55; --on-accent:#fff; --accent-soft:color-mix(in srgb,var(--accent) 15%,transparent);
    --negative:#FF3B30; --gold:#FF9500;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
    --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
    --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",sans-serif;
    color-scheme:light; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C;
      --text:#FFFFFF; --muted:#98989F; --sep:rgba(84,84,88,.5); --border:rgba(84,84,88,.5);
      --negative:#FF453A; --gold:#FF9F0A; --shadow:none; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C;
    --text:#FFFFFF; --muted:#98989F; --sep:rgba(84,84,88,.5); --border:rgba(84,84,88,.5);
    --negative:#FF453A; --gold:#FF9F0A; --shadow:none; color-scheme:dark;
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:15px; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
  body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:40; }
  button,input,select{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  [hidden]{ display:none!important; }

  .app{ max-width:560px; margin:0 auto; padding:0 16px 130px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
  .topbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 2px 0; min-height:52px; }
  .greeting{ margin:0; font-size:13px; color:var(--muted); font-weight:500; }
  .avbtn{ width:36px; height:36px; border-radius:50%; border:none; background:var(--accent-soft); color:var(--accent); font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; transition:transform .15s ease; }
  .avbtn:active{ transform:scale(.92); }

  h1.page{ font-family:var(--font-display); font-weight:800; font-size:34px; letter-spacing:-.025em; margin:2px 2px 14px; line-height:1.08; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:26px 4px 10px; gap:10px; }
  .section-title{ font-family:var(--font-display); font-weight:700; font-size:21px; letter-spacing:-.015em; margin:0; }
  .section-sub{ font-size:13px; color:var(--muted); }
  .sublabel{ font-size:13px; font-weight:600; color:var(--muted); margin:18px 4px 8px; }
  .muted{ color:var(--muted); }
  .mono{ font-variant-numeric:tabular-nums; }
  .pos{ color:var(--accent); } .neg{ color:var(--negative); }
  a{ color:var(--accent); }

  .iconbtn,.navbtn{ width:34px; height:34px; border-radius:50%; border:none; background:var(--accent-soft); color:var(--accent); font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none; transition:transform .12s ease; }
  .iconbtn:active,.navbtn:active{ transform:scale(.9); }

  .seg{ display:flex; background:var(--surface-3); border-radius:10px; padding:2px; margin:0 0 10px; }
  .seg button{ flex:1; border:none; background:none; padding:7px 4px; border-radius:8px; font-size:13px; font-weight:600; color:var(--text); opacity:.62; transition:all .2s ease; white-space:nowrap; }
  .seg button.on{ background:var(--surface); opacity:1; box-shadow:0 2px 6px rgba(0,0,0,.14); }

  .card{ background:var(--surface); border-radius:20px; padding:16px; box-shadow:var(--shadow); }
  .card + .card{ margin-top:12px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat .k{ font-size:12.5px; color:var(--muted); margin-bottom:3px; }
  .stat .v{ font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .stat .s{ font-size:12px; color:var(--muted); margin-top:3px; }
  .stat.box{ background:var(--surface); border-radius:16px; padding:14px; box-shadow:var(--shadow); min-width:0; }
  .bignum{ font-family:var(--font-display); font-weight:800; font-size:40px; line-height:1.05; letter-spacing:-.02em; margin:0; }
  .tag{ font-size:12px; font-weight:700; padding:3px 8px; border-radius:7px; }
  .tag.pos{ background:var(--accent-soft); } .tag.neg{ background:color-mix(in srgb,var(--negative) 14%,transparent); }

  .row-list{ background:var(--surface); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
  .row{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:.5px solid var(--sep); gap:10px; }
  .row:last-child{ border-bottom:none; }
  .row-title{ font-size:15.5px; font-weight:600; }
  .row-sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .row-value{ font-size:15px; font-weight:600; text-align:right; }
  .row-change{ font-size:12px; margin-top:2px; text-align:right; }
  .row-del{ background:none; border:none; color:var(--muted); font-size:20px; padding:0 2px; line-height:1; }
  .empty{ padding:22px 16px; color:var(--muted); font-size:14px; line-height:1.5; }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; }

  .form-panel{ background:var(--surface); border-radius:18px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field.wide{ grid-column:1/-1; }
  .field label{ font-size:12.5px; color:var(--muted); font-weight:500; }
  .field input,.field select,.inl,.plain{ width:100%; border:none; background:var(--surface-2); color:var(--text); border-radius:11px; padding:11px 12px; font-size:16px; outline:none; min-width:0; }
  .field input:focus,.field select:focus,.inl:focus{ box-shadow:0 0 0 2px var(--accent); }
  .inl{ flex:1; width:auto; }
  .plain{ margin-bottom:8px; }
  .form-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .btn{ border:none; border-radius:13px; padding:12px 16px; font-size:15px; font-weight:600; transition:transform .12s ease,opacity .2s ease; }
  .btn:active{ transform:scale(.97); opacity:.85; }
  .btn-primary{ background:var(--accent); color:var(--on-accent); flex:1; }
  .btn-ghost{ background:var(--accent-soft); color:var(--accent); }
  .btn.danger{ background:color-mix(in srgb,var(--negative) 14%,transparent); color:var(--negative); }
  input[type=file]{ font-size:13px; max-width:100%; }
  input[type=checkbox]{ width:auto!important; accent-color:var(--accent); }

  .alloc-bar{ display:flex; height:10px; border-radius:6px; overflow:hidden; background:var(--surface-3); }
  .legend{ display:flex; flex-direction:column; gap:8px; font-size:13.5px; }
  .legend .li{ display:flex; align-items:center; gap:8px; }
  .legend .li .n{ flex:1; }
  .legend .li .p{ font-size:13px; color:var(--muted); }
  .progress{ height:8px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
  .progress div{ height:100%; border-radius:5px; }
  .note{ font-size:12.5px; color:var(--muted); line-height:1.5; margin:10px 4px 0; }
  .callout{ background:var(--accent-soft); border-radius:14px; padding:13px 14px; font-size:14px; line-height:1.5; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
  .chip{ border:none; background:var(--surface-3); color:var(--text); border-radius:999px; padding:8px 13px; font-size:13.5px; font-weight:600; transition:transform .12s ease,background .2s ease; }
  .chip:active{ transform:scale(.95); }
  .chip.on{ background:var(--accent); color:var(--on-accent); }
  .chip.static{ cursor:default; } .chip.off{ opacity:.4; }
  .lg{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-right:6px; }
  .tiles{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile{ text-align:left; border:none; background:var(--surface); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:3px; min-width:0; box-shadow:var(--shadow); position:relative; transition:transform .12s ease; }
  .tile b{ font-size:15px; color:var(--text); } .tile span{ font-size:12.5px; color:var(--muted); }
  .tile:active{ transform:scale(.97); }
  .tile .x{ position:absolute; top:6px; right:8px; color:var(--muted); font-size:16px; padding:2px 6px; }

  .exblock{ background:var(--surface-2); border-radius:14px; padding:12px; margin-bottom:10px; }
  .setrow{ display:grid; grid-template-columns:30px 1fr 1fr 1fr 24px; gap:8px; align-items:center; margin-top:8px; }
  .setrow.head{ font-size:11.5px; color:var(--muted); margin-top:10px; }
  .setrow input{ width:100%; min-width:0; border:none; background:var(--surface); color:var(--text); border-radius:9px; padding:9px 6px; font-size:16px; text-align:center; }
  .setn{ width:24px; height:24px; border-radius:50%; background:var(--surface); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .exadd{ display:flex; gap:8px; flex-wrap:wrap; }
  .exadd input,.exadd select{ border:none; background:var(--surface-2); color:var(--text); border-radius:11px; padding:11px 12px; font-size:16px; min-width:0; }
  .exadd input{ flex:1 1 160px; }
  .mini{ width:74px; border:none; background:var(--surface-2); color:var(--text); border-radius:9px; padding:8px 8px; font-size:15px; text-align:right; }

  .rings3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; text-align:center; }
  .rw{ position:relative; width:92px; height:92px; margin:0 auto; max-width:100%; }
  .rc{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:700; }
  .rl{ font-size:12.5px; font-weight:600; margin-top:8px; line-height:1.35; }
  .heat12{ display:grid; grid-template-columns:repeat(12,1fr); gap:4px; }
  .heat12 i{ aspect-ratio:1; border-radius:5px; background:var(--surface-3); display:block; }
  .heat12 i.fut{ opacity:.35; }

  .evbar{ width:4px; align-self:stretch; border-radius:3px; flex:none; }
  .wkhead{ display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px; }
  .wkhead b{ font-family:var(--font-display); font-size:20px; font-weight:700; }
  .wkstrip{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .daycell{ border:none; background:var(--surface); color:var(--text); border-radius:14px; padding:9px 0 8px; display:flex; flex-direction:column; align-items:center; gap:4px; box-shadow:var(--shadow); }
  .daycell span{ font-size:11.5px; color:var(--muted); font-weight:600; }
  .daycell b{ font-size:17px; font-weight:700; }
  .daycell i{ height:6px; display:flex; gap:2px; }
  .daycell i u{ width:6px; height:6px; border-radius:50%; display:block; }
  .daycell.tod{ background:var(--accent); color:var(--on-accent); }
  .daycell.tod span{ color:var(--on-accent); opacity:.85; }
  .mhead{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; font-size:11.5px; color:var(--muted); text-align:center; margin-bottom:5px; font-weight:600; }
  .mgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
  .mday{ border:none; background:var(--surface); color:var(--text); border-radius:12px; min-height:54px; padding:7px 2px 6px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; min-width:0; box-shadow:var(--shadow); transition:transform .12s ease; }
  .mday:active{ transform:scale(.94); }
  .mday b{ font-size:14.5px; font-weight:600; }
  .mday i{ height:6px; display:flex; gap:2px; }
  .mday i u{ width:6px; height:6px; border-radius:50%; display:block; }
  .mday.out{ opacity:.35; }
  .mday.sel{ background:var(--accent); color:var(--on-accent); }
  .mday.tod:not(.sel){ box-shadow:inset 0 0 0 2px var(--accent); }
  .src{ font-size:11px; font-weight:700; color:#FC4C02; margin-left:6px; }
  .acc{ border-bottom:.5px solid var(--sep); }
  .acc summary{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 16px; font-weight:600; font-size:15.5px; list-style:none; }
  .acc summary::-webkit-details-marker{ display:none; }
  .acc p{ margin:0 16px 14px; font-size:14px; line-height:1.55; color:var(--muted); }
  .quest .qchk{ width:26px; height:26px; border-radius:50%; border:2px solid var(--surface-3); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--on-accent); flex:none; transition:all .25s ease; }
  .quest.done .qchk{ background:var(--accent); border-color:var(--accent); }

  /* barre d'onglets */
  nav.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:50; background:color-mix(in srgb,var(--bg) 78%,transparent); backdrop-filter:saturate(180%) blur(22px); -webkit-backdrop-filter:saturate(180%) blur(22px); border-top:.5px solid var(--sep); padding-bottom:env(safe-area-inset-bottom,0px); }
  .tabbar-inner{ max-width:560px; margin:0 auto; display:flex; padding:6px 4px 4px; }
  .tab{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; color:var(--muted); min-width:0; transition:color .2s ease; }
  .tab svg{ width:25px; height:25px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .tab span{ font-size:10px; font-weight:600; white-space:nowrap; }
  .tab.on{ color:var(--accent); }
  .tab.on svg{ animation:pop .45s cubic-bezier(.3,1.6,.5,1); }
  button:focus-visible,input:focus-visible,select:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* feuilles (réglages, lecteur PDF) */
  .sheet{ position:fixed; inset:0; z-index:90; background:var(--bg); overflow:auto; animation:sheetin .38s cubic-bezier(.2,.9,.3,1); padding-top:env(safe-area-inset-top,0px); }
  .sheet-in{ max-width:560px; margin:0 auto; padding:14px 16px calc(40px + env(safe-area-inset-bottom,0px)); }
  .sheet-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .swatches{ display:flex; gap:12px; flex-wrap:wrap; }
  .sw{ width:36px; height:36px; border-radius:50%; border:3px solid var(--surface); box-shadow:0 0 0 2px transparent; transition:transform .15s ease; }
  .sw.on{ box-shadow:0 0 0 2px var(--text); transform:scale(1.08); }
  .pdfv{ position:fixed; inset:0; z-index:95; background:rgba(0,0,0,.92); overflow:auto; padding:calc(54px + env(safe-area-inset-top,0px)) 8px 24px; }
  .pdfv canvas{ display:block; width:100%; max-width:760px; margin:0 auto 10px; background:#fff; border-radius:4px; }
  .pdfv .x{ position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); right:12px; z-index:96; }
  .pdfv .msg{ color:#fff; text-align:center; padding:40px 20px; font-size:14px; }

  /* ===== Jeu idle ===== */
  .scene{ position:relative; height:340px; border-radius:28px; overflow:hidden; background:linear-gradient(180deg,#1B1464 0%,#4B2FA8 42%,#B24FC2 72%,#FF8A5B 100%); box-shadow:0 10px 30px rgba(75,47,168,.35); isolation:isolate; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .scene .sk i{ position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; animation:twinkle 3s ease-in-out infinite; }
  .scene .moon{ position:absolute; right:26px; top:112px; width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FFF6D6,#FFD97A); box-shadow:0 0 40px rgba(255,217,122,.6); animation:glow 4s ease-in-out infinite; }
  .scene .cl{ position:absolute; height:18px; border-radius:20px; background:rgba(255,255,255,.18); animation:drift linear infinite; }
  .scene .cl::before{ content:""; position:absolute; left:14px; top:-9px; width:26px; height:20px; border-radius:50%; background:inherit; }
  .scene .hills{ position:absolute; left:0; right:0; bottom:0; width:100%; height:130px; z-index:1; }
  .res{ position:absolute; left:14px; right:14px; top:14px; display:flex; gap:8px; z-index:3; }
  .res .pill{ flex:1; background:rgba(255,255,255,.16); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:16px; padding:8px 12px; color:#fff; min-width:0; }
  .res .pill small{ display:block; font-size:11px; opacity:.8; font-weight:600; }
  .res .pill b{ font-size:21px; font-weight:800; letter-spacing:-.02em; display:flex; align-items:center; gap:6px; }
  .res .pill svg{ width:17px; height:17px; flex:none; }
  .mascot-wrap{ position:absolute; left:50%; bottom:46px; width:170px; height:170px; margin-left:-85px; z-index:2; cursor:pointer; animation:bob 3s ease-in-out infinite; }
  .mascot-wrap svg{ width:100%; height:100%; overflow:visible; transition:transform .12s cubic-bezier(.3,1.8,.5,1); }
  .mascot-wrap.tap svg{ transform:scale(.88,1.1); }
  .mascot-wrap .blink{ animation:blink 4.5s infinite; transform-box:fill-box; transform-origin:center; }
  .mascot-wrap .arm{ transform-box:fill-box; transform-origin:top center; animation:wave 2.2s ease-in-out infinite; }
  .shadow{ position:absolute; left:50%; bottom:40px; width:110px; height:14px; margin-left:-55px; border-radius:50%; background:rgba(0,0,0,.28); z-index:1; animation:shadow 3s ease-in-out infinite; }
  .hint{ position:absolute; left:0; right:0; bottom:10px; text-align:center; color:rgba(255,255,255,.85); font-size:12px; font-weight:600; z-index:3; }
  .fl{ position:absolute; z-index:5; color:#FFE27A; font-weight:800; font-size:20px; pointer-events:none; text-shadow:0 2px 6px rgba(0,0,0,.35); animation:floatup .9s ease-out forwards; }
  .gen{ display:flex; align-items:center; gap:12px; padding:12px 14px; }
  .gico{ width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex:none; color:#fff; }
  .gico svg{ width:26px; height:26px; fill:none; stroke:#fff; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .buy{ border:none; border-radius:12px; padding:9px 12px; font-weight:800; font-size:13.5px; background:var(--surface-3); color:var(--muted); min-width:92px; transition:transform .12s ease; display:flex; flex-direction:column; align-items:center; line-height:1.15; }
  .buy small{ font-size:11px; font-weight:600; opacity:.85; }
  .buy.ok{ background:linear-gradient(135deg,#FFB020,#FF7A1A); color:#fff; box-shadow:0 4px 14px rgba(255,138,26,.45); animation:wiggle 2.4s ease-in-out infinite; }
  .buy:active{ transform:scale(.94); }
  .buy.star.ok{ background:linear-gradient(135deg,#B06BFF,#6C4BFF); box-shadow:0 4px 14px rgba(108,75,255,.45); }
  .gcount{ white-space:nowrap; font-size:12px; font-weight:800; padding:2px 8px; border-radius:8px; background:var(--surface-3); margin-left:6px; }
  .claim{ border:none; border-radius:11px; padding:8px 12px; font-weight:800; font-size:13px; background:linear-gradient(135deg,#B06BFF,#6C4BFF); color:#fff; flex:none; animation:wiggle 2.4s ease-in-out infinite; }
  .claimed{ font-size:12.5px; color:var(--muted); font-weight:600; flex:none; }
  .mult{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .mult span{ font-size:12px; font-weight:700; padding:4px 9px; border-radius:8px; background:var(--accent-soft); color:var(--accent); }
  .skin{ width:44px; height:44px; border-radius:50%; border:3px solid var(--surface); transition:transform .15s ease; position:relative; }
  .skin.on{ box-shadow:0 0 0 2px var(--text); transform:scale(1.08); }
  .skin.lock::after{ content:""; position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,.45); }

  /* ===== Pointage ===== */
  .punch{ display:flex; flex-direction:column; align-items:center; padding:22px 16px; gap:14px; }

  /* =====================================================================

  :root{

      --text:#EDEDEF; --muted:#8A8A91; --sep:rgba(255,255,255,.07); --border:rgba(255,255,255,.07);

  }
