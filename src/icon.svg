<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Rythme · logo « Aube » : soleil levant et trois vagues de verre. Pleine page : iOS arrondit lui-même les coins. -->
  <defs>
