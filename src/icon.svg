<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Rythme · logo « Aube », version glyphe sur noir : soleil levant et deux vagues. Pleine page, iOS arrondit les coins. -->
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A31"/><stop offset="1" stop-color="#08080B"/></linearGradient>
<radialGradient id="sun" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#FFD36B"/><stop offset="1" stop-color="#FF9A2E"/></radialGradient>
<linearGradient id="wa" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8E6E"/><stop offset="1" stop-color="#F0507A"/></linearGradient>
<linearGradient id="wb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B562E0"/><stop offset="1" stop-color="#6A3FD0"/></linearGradient>
<linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.12"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="up"><rect x="0" y="0" width="1024" height="560"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/></filter>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<circle cx="512" cy="500" r="230" fill="#FF9A2E" fill-opacity="0.55" filter="url(#glow)"/>
<g filter="url(#sh)">
<g clip-path="url(#up)"><circle cx="512" cy="530" r="178" fill="url(#sun)"/></g>
<path d="M200 600 C300 530 410 530 512 600 C614 670 724 670 824 600" fill="none" stroke="url(#wa)" stroke-width="76" stroke-linecap="round"/>
<path d="M200 735 C300 665 410 665 512 735 C614 805 724 805 824 735" fill="none" stroke="url(#wb)" stroke-width="76" stroke-linecap="round" stroke-opacity="1"/>
</g>
<ellipse cx="455" cy="430" rx="62" ry="30" fill="#fff" fill-opacity="0.7"/>
<rect width="1024" height="1024" fill="url(#gloss)"/>
</svg>